name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - name: Install Capacitor, Firebase and test tools
        run: npm install

      - name: Bundle Firebase into the app
        run: |
          mkdir -p www/vendor
          cp node_modules/firebase/firebase-app-compat.js node_modules/firebase/firebase-auth-compat.js node_modules/firebase/firebase-firestore-compat.js www/vendor/

      - name: Smoke test (client and trainer flows)
        run: node test/smoke.js

      - name: Database rules tests (official Firestore emulator)
        run: npx --yes firebase-tools@13 emulators:exec --only firestore --project demo-primal "node test/rules.test.js"

      - name: Package the web version for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Create Android project
        run: npx cap add android

      - name: App icon and splash
        run: npx --yes @capacitor/assets@3 generate --android
        continue-on-error: true

      - name: Allow rest-timer vibration and city lookup
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />#' android/app/src/main/AndroidManifest.xml

      - name: Keep the app's data out of backups and phone-to-phone transfers
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android:allowBackup="true"' "$M" || { echo "::error::allowBackup not found in the manifest; check the Capacitor template"; exit 1; }
          sed -i 's#android:allowBackup="true"#android:allowBackup="false" android:fullBackupContent="false" android:dataExtractionRules="@xml/data_extraction_rules"#' "$M"
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/data_extraction_rules.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <exclude domain="root" /><exclude domain="file" /><exclude domain="database" /><exclude domain="sharedpref" /><exclude domain="external" />
              </cloud-backup>
              <device-transfer>
                  <exclude domain="root" /><exclude domain="file" /><exclude domain="database" /><exclude domain="sharedpref" /><exclude domain="external" />
              </device-transfer>
          </data-extraction-rules>
          XML
          sed -i 's/^          //' android/app/src/main/res/xml/data_extraction_rules.xml
          grep -o 'android:allowBackup="[a-z]*"' "$M"

      - name: Keep the screen on while the app is open
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(head -1 "$F")
          cat > "$F" <<JAVA
          $PKG

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              }
          }
          JAVA
          cat "$F"

      - name: Set version number
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Use the app's permanent signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | tr -d ' \r\n' | base64 -d > android/app/primal.keystore
            keytool -list -keystore android/app/primal.keystore -storepass android | grep -i fingerprint
            cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  permanent {
                      storeFile file('primal.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.permanent
                  }
              }
          }
          GRADLE
            echo "Signing with the permanent key"
          else
            cat >> android/app/build.gradle <<'GRADLE'

          android {
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLE
            echo "::warning::ANDROID_KEYSTORE_B64 secret is not set, so this build uses a temporary key and will not install over other builds."
          fi

      - name: Copy the app into Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Show APK signature
        run: keytool -printcert -jarfile android/app/build/outputs/apk/release/app-release.apk | grep -m1 SHA256

      - name: Check the APK is a release build with backups off
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          if "$AAPT" dump badging "$APK" | grep -q "application-debuggable"; then echo "::error::The APK is debuggable"; exit 1; fi
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > manifest.txt
          grep -i "allowBackup" manifest.txt
          grep -i "allowBackup" manifest.txt | grep -q "0x0$" || { echo "::error::Backups are not switched off"; exit 1; }
          grep -qi "dataExtractionRules" manifest.txt || { echo "::error::Phone-to-phone transfer rules are missing"; exit 1; }
          echo "Release build, not debuggable, backups off"

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PrimalStrength-${{ github.run_number }}.apk
          cp android/app/build/outputs/apk/release/app-release.apk PrimalStrength.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimalStrength-apk
          path: PrimalStrength-*.apk

      - name: Publish as a release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Primal Strength build ${{ github.run_number }}
          files: |
            PrimalStrength-*.apk
            PrimalStrength.apk

  web:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the web version
        id: deployment
        uses: actions/deploy-pages@v4
