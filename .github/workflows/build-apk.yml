name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - name: Install Capacitor, Firebase and test tools
        run: npm install

      - name: Bundle Firebase into the app
        run: |
          mkdir -p www/vendor
          cp node_modules/firebase/firebase-app-compat.js node_modules/firebase/firebase-auth-compat.js node_modules/firebase/firebase-firestore-compat.js www/vendor/

      - name: Smoke test (client and trainer flows)
        run: node test/smoke.js

      - name: Package the web version for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Create Android project
        run: npx cap add android

      - name: App icon and splash
        run: npx --yes @capacitor/assets@3 generate --android
        continue-on-error: true

      - name: Allow rest-timer vibration
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.VIBRATE" />#' android/app/src/main/AndroidManifest.xml

      - name: Set version number
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Use the app's permanent signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | tr -d ' \r\n' | base64 -d > android/app/primal.keystore
            keytool -list -keystore android/app/primal.keystore -storepass android | grep -i fingerprint
            cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file('primal.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          GRADLE
            echo "Signing with the permanent key"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret is not set, so this build uses a temporary key and will not install over other builds."
          fi

      - name: Copy the app into Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show APK signature
        run: keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 SHA256

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PrimalStrength-${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PrimalStrength-apk
          path: PrimalStrength-*.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Primal Strength build ${{ github.run_number }}
          files: PrimalStrength-*.apk

  web:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the web version
        id: deployment
        uses: actions/deploy-pages@v4
