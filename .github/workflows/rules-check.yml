name: Rules check (test branches)

on:
  push:
    branches: [ 'test/**' ]

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Smoke test
        run: node test/smoke.js
      - name: Database rules tests (official Firestore emulator)
        run: npx firebase emulators:exec --only firestore --project demo-primal "node test/rules.test.js"
