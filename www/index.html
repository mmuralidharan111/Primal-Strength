<style>
/* Layout: one-column phone app — sticky header, scrolling view, fixed bottom tab bar; Trainerize-style logging rows */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --sunk:#EEF0EC; --ink:#15181C; --muted:#5F6772; --line:#DADDD7;
  --accent:#0E5A7E; --accent-soft:#E4ECF8; --cta:#F5C518; --cta-ink:#1A1600;
  --good:#2D7A4C; --good-soft:#E2F1E7; --warn:#A8670F; --warn-soft:#FBF0DC; --bad:#B42318; --bad-soft:#FBE6E3;
  --chart-2:#C2410C;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1215; --surface:#171B20; --sunk:#1E242A; --ink:#E8EBEE; --muted:#9AA3AD; --line:#2A3139;
  --accent:#6A9BEA; --accent-soft:#1B2A40; --cta:#F2C744; --cta-ink:#1A1600;
  --good:#5BC28A; --good-soft:#15291E; --warn:#E3A945; --warn-soft:#2E2412; --bad:#F07167; --bad-soft:#341A18;
  --chart-2:#F0965A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1215; --surface:#171B20; --sunk:#1E242A; --ink:#E8EBEE; --muted:#9AA3AD; --line:#2A3139;
  --accent:#6A9BEA; --accent-soft:#1B2A40; --cta:#F2C744; --cta-ink:#1A1600;
  --good:#5BC28A; --good-soft:#15291E; --warn:#E3A945; --warn-soft:#2E2412; --bad:#F07167; --bad-soft:#341A18;
  --chart-2:#F0965A; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{flex:1;min-width:0}
.mark{height:34px;width:auto;flex:none}.mark.dk{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mark.lt{display:none}:root:not([data-theme="light"]) .mark.dk{display:block}}
:root[data-theme="dark"] .mark.lt{display:none}:root[data-theme="dark"] .mark.dk{display:block}
.brand b{display:block;font-family:var(--f-display);font-size:20px;letter-spacing:.2px;line-height:1.1}
.brand span{font-size:13px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:14px;padding-block:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.2px}
h1{font-size:30px;line-height:1.05}
h2{font-size:22px}
h3{font-size:18px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--sunk);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--cta);color:var(--cta-ink);border-color:transparent;font-size:18px;padding:14px 24px;font-family:var(--f-display);letter-spacing:.3px}
.btn.blue{background:var(--accent);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:.02em}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.banner.bad{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.banner.info{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.banner b{font-weight:700}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);width:100%;font-weight:400}
textarea{resize:vertical;min-height:64px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{min-width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* tab bar */
nav.tabs{--navbg:var(--surface);position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{background:none;border:0;padding:8px 0 10px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
/* workout list + overview */
.wcard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.dayblock{width:54px;height:54px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-size:28px;flex:none}
.dayblock.sm{width:44px;height:44px;font-size:16px;border-radius:10px;background:var(--sunk);color:var(--ink)}
.exlist{display:flex;flex-direction:column}
.exitem{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.exitem:first-child{border-top:0}
.exitem b{display:block;font-size:17px}
.metaline{display:flex;flex-direction:column;gap:6px;font-size:16px}
.metaline div{display:flex;gap:10px;align-items:center}
.metaline svg{width:20px;height:20px;flex:none}
.equip{display:flex;gap:8px;flex-wrap:wrap}
.equip span{background:var(--sunk);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600}
.sticky-cta{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:5}
.sticky-cta .btn{pointer-events:auto;min-width:220px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.group-head{background:var(--sunk);margin-inline:-16px;padding:10px 16px;font-weight:700}
/* logging */
.logbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.logbar .wrap{display:flex;align-items:center;gap:8px;padding-block:8px}
.logbar .title{flex:1;min-width:0}
.logbar .title b{font-family:var(--f-display);font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logbar .title span{font-size:13px;color:var(--muted)}
.savebtn{font-family:var(--f-display);font-size:20px;font-weight:700;background:none;border:0;padding:6px 8px}
.excard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}
.excard.done{border-left-color:var(--good)}
.exhead{display:flex;gap:10px;align-items:flex-start}
.exhead .nm{flex:1;min-width:0}
.exhead .nm b{font-size:19px;display:block;line-height:1.2}
.exhead .nm span{font-size:14px;color:var(--muted)}
.exhead .iconbtn{width:38px;height:38px;color:var(--accent);border-color:transparent;background:var(--accent-soft)}
.swapbtn{display:inline-flex;align-items:center;gap:6px;color:var(--accent);background:var(--accent-soft);border-color:transparent;padding:8px 12px;flex:none;font-weight:600;min-height:38px}
.troopmark{height:44px;width:auto;flex:none}
nav.tabs button svg.troopicon{width:30px}
.restchip{display:flex;align-items:center;justify-content:space-between;background:var(--sunk);border-radius:999px;padding:6px 6px 6px 14px;color:var(--accent);font-size:14px;font-weight:600}
.restchip button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;color:var(--accent);font-weight:700;display:flex;gap:6px;align-items:center}
.sets{display:grid;grid-template-columns:44px minmax(0,1fr) 72px 72px 44px;gap:8px 8px;align-items:center}
.sets .h{font-weight:700;font-size:14px}
.sets .lbl{font-weight:600;font-size:15px}
.sets .prev{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.sets input:disabled{background:var(--sunk);color:var(--muted)}
.tick{width:44px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.tick svg{width:20px;height:20px}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.setrow-done input{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.hint{font-size:14px;border-radius:10px;padding:8px 10px;background:var(--good-soft);color:var(--good);font-weight:600}
.cue{font-size:14px;color:var(--muted)}
.toggle{width:50px;height:30px;border-radius:999px;background:var(--line);border:0;position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:23px}
/* timer */
.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:24;pointer-events:none}
.timer .wrap{pointer-events:auto}
.timer .box{background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer .box b{font-family:var(--f-display);font-size:30px;min-width:76px;font-variant-numeric:tabular-nums}
.timer .box .bar{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.timer .box .bar i{display:block;height:100%;background:var(--cta)}
.timer .box button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:999px;padding:6px 10px;font-weight:700;font-size:14px}
.timer.ring .box{background:var(--cta);color:var(--cta-ink)}
.timer.ring .box button{color:var(--cta-ink);border-color:var(--cta-ink)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.wt{position:fixed;inset:0;z-index:60;background:#0B1A12;color:#fff;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.wt.rest{background:#0B1830}.wt.done{background:#14181D}
.wt-in{width:100%;max-width:1100px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.wt-phase{font-family:var(--f-display);font-size:clamp(24px,7vmin,64px);text-transform:uppercase;letter-spacing:.06em;color:#9FE3B4}
.wt.rest .wt-phase{color:#9CC4FF}
.wt-big{font-family:var(--f-display);font-size:clamp(72px,min(34vw,46vh),420px);line-height:.95;font-variant-numeric:tabular-nums}
.wt-sub{font-size:clamp(16px,4vmin,30px);opacity:.85}
.wt-bar{width:min(100%,900px);height:10px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden}.wt-bar i{display:block;height:100%;background:#F5C518}
.wt-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.wt .btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.35)}.wt .btn.primary{background:#F5C518;color:#1A1600;border-color:#F5C518}
.wt .wt-round{min-width:180px;min-height:64px;font-size:22px}
@media (orientation:landscape) and (max-height:540px){.wt-big{font-size:min(30vw,58vh)}.wt-in{gap:4px}.wt-btns .btn{min-height:40px;padding:6px 12px}}
.gymbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;background:var(--bg);border-bottom:1px solid var(--line);padding:10px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px))}
.gymbar .mark{height:40px}
.gymgrid{display:grid;gap:14px;overflow-x:auto;align-items:start}
.gymcol{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.gex{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.gex b{font-size:18px}
.gsets{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;align-items:center}
.gsets .h{font-weight:700;font-size:13px;color:var(--muted)}
.gsets input{width:100%;height:52px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:center;font-size:20px;font-variant-numeric:tabular-nums}
.gsets .tick{width:52px;height:52px}
.gsel{border:1px solid var(--line);border-radius:10px;padding:12px;font-size:17px;background:var(--surface);color:var(--ink);width:100%}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:45}
.confetti i{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:ps-fall 2.4s linear forwards}
@keyframes ps-fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:50;font-size:15px;max-width:calc(100% - 32px)}
/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.strip div{background:var(--sunk);border-radius:10px;padding:6px 2px;text-align:center;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:0}
.strip div b{font-size:15px;color:var(--ink);font-family:var(--f-display)}
.strip div.today{outline:2px solid var(--accent)}
.strip div.lift b{color:var(--accent)}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
/* tables + charts */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
svg.chart{width:100%;height:auto;display:block}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
svg.chart .s1{stroke:var(--accent);fill:none;stroke-width:2.5}
svg.chart .s1a{fill:var(--accent);opacity:.12}
svg.chart .d1{fill:var(--accent)}
svg.chart .s2{stroke:var(--chart-2);fill:none;stroke-width:2;stroke-dasharray:5 4}
svg.chart .d2{fill:var(--chart-2)}
svg.chart .lab{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--f-body)}
svg.chart .bar{fill:var(--accent)}
svg.chart .bar.low{fill:color-mix(in srgb,var(--accent) 45%,var(--sunk))}
svg.chart .plan{stroke:var(--ink);stroke-width:2}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px;background:var(--accent)}
.legend i.b{background:var(--chart-2)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:14px}
.thumb{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.histitem{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.histitem:first-of-type{border-top:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.sets{grid-template-columns:34px minmax(0,1fr) 62px 62px 40px;gap:6px}.grid3{grid-template-columns:1fr 1fr}}
/* Gym web app (owner and front desk): wide layout, side menu on big screens */
.gymapp main .wrap{max-width:1180px}
.gymapp svg.chart{max-width:720px;max-height:260px}
.gymapp header.top .wrap{max-width:1180px}
.gymapp nav.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media (min-width:900px){
  .gymapp nav.tabs{top:0;bottom:0;right:auto;width:210px;border-top:0;border-right:1px solid var(--line);padding-top:calc(72px + env(safe-area-inset-top,0px))}
  .gymapp nav.tabs .wrap{display:flex!important;flex-direction:column;gap:2px;padding:0 10px}
  .gymapp nav.tabs button{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;font-size:15px;border-radius:10px}
  .gymapp nav.tabs button.on{background:var(--accent-soft)}
  .gymapp header.top{z-index:26}
  .gymapp main,.gymapp header.top{margin-left:210px}
  .gymapp main{padding-bottom:40px}
  .gymapp .grid3{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
}
.receipt{background:#fff;color:#15181C;border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.receipt table{width:100%;border-collapse:collapse;font-size:14px}.receipt th,.receipt td{border-bottom:1px solid #DADDD7;padding:6px 4px;text-align:left}
.receipt .muted{color:#5F6772}
@media print{
  body *{visibility:hidden!important}
  .receipt,.receipt *{visibility:visible!important}
  .receipt{position:fixed;left:0;top:0;width:100%;border:0}
}
</style>

function personalProgram(){
  const p = baseProgram(); p.kind = "personal";
  p.notes = ["Back rules (disc-friendly): no loaded spinal flexion, brace every rep, swap Zercher for goblet squat on irritated days.",
             "If next-morning back pain is 2+ points above your normal, cut that week's lower-body loads by 20%.",
             "Start lifting at least 60 minutes after waking."];
  return p;
}
function standardProgram(){
  const p = baseProgram(); p.kind = "standard";
  p.days.forEach(d => d.ex.forEach(e => { if (e.side) e.side.extra = null; delete e.cueMe; }));
  p.notes = ["Leave 2–3 reps in the tank on the big lifts. Add load once every set hits the top of the rep range."];
  return p;
}

function libOptions(q, current, firstCat, all){
  const qq = (q || "").toLowerCase().trim();
  // An athlete sees exercises for their sport; searching (asking) or "all sports" shows everything. Trainers see every exercise.
  const limit = !qq && !all && !(typeof isTrainer === "function" && isTrainer()) && S.profile;
  const hit = e => (!limit || e.n === current || sportFits(e)) && (!qq || (e.n + " " + e.cat + " " + e.equip).toLowerCase().includes(qq));
  const cats = [...new Set(LIB.map(e => e.cat))].sort((a,b) => (b===firstCat) - (a===firstCat));
  const personal = S.profile && prog().kind === "personal";
  let html = "", n = 0;
  cats.forEach(c => {
    const items = LIB.filter(e => e.cat === c && hit(e)); if (!items.length) return;
    html += `<optgroup label="${esc(c)}">` + items.map(e => { n++; return `<option value="${esc(e.n)}" ${e.n===current?"selected":""}>${esc(e.n)} · ${esc(e.equip)}${personal && e.back ? " · back caution" : ""}</option>`; }).join("") + `</optgroup>`;
  });
  return n ? html : `<option value="">No matches — add it as a custom exercise below</option>`;
}

function sportTargets(sp){ const o = ((set_().sportTargets || {})[sp.k]) || {}; return sp.week.map((t, i) => ({...t, t: num(o[i]) ? +o[i] : t.t})); }
function targetValue(t, logs){
  const rows = logs.filter(r => modeIs(r, t.m));

function bestLiftSeries(exMap){

    if (s.event){ return; }
    s.exercises.forEach(e => { const f = exMap[e.performedAs]; if (!f) return; doneSets(e).forEach(x => { const v = e1rm(+x.kg, +x.reps); if (v && (!pts[s.date] || v * f > pts[s.date])) pts[s.date] = v * f; }); });

    return (b.deload||[]).includes(w) ? {name:"Deload", short:"Deload"} : {name:"Training", short:"Training"}; }

  if (w === 6) return {name:"Deload", short:"Deload"};

      for (let i=1;i<=n;i++) out.push(s + i);

  let n = isDeload(w) ? Math.min(2, +ex.sets) : comebackFor(w) ? cbSets(+ex.sets) : ((blk().extra || []).includes(w) && idx === 0 ? +ex.sets + 1 : +ex.sets);

function targetReps(ex, w){

  if (base == null || (!inc && !cbD && !(isDeload(w) && (ex.type === "run" || ex.type === "cardio")))) return String(ex.reps);

/* ============ Charts ============ */
function niceTicks(min, max, n=4){
  if (min === max){ min -= 1; max += 1; }
  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1,2,2.5,5,10].map(m => m*mag).find(s => s >= step0) || 10*mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step; const t = [];
  for (let v = lo; v <= hi + step/2; v += step) t.push(+v.toFixed(6));
  return t;
}
function lineChart(series, {unit="", h=180, dec=1} = {}){
  const all = series.flatMap(s => s.pts); if (!all.length) return "";
  const W = 340, L = 38, R = 14, T = 14, B = 26;
  const xs = all.map(p => parse(p.x).getTime()); let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1){ x0 -= 86400000*3; x1 += 86400000*3; }
  const ys = all.map(p => p.y); const ticks = niceTicks(Math.min(...ys), Math.max(...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length-1];
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0)/(y1 - y0)) * (h - T - B);
  let g = ticks.map(t => `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axis" x="${L-6}" y="${Y(t)+4}" text-anchor="end">${fmt(t,dec)}</text>`).join("");
  g += `<text class="axis" x="${L}" y="${h-6}">${shortDate(ymd(new Date(x0)))}</text><text class="axis" x="${W-R}" y="${h-6}" text-anchor="end">${shortDate(ymd(new Date(x1)))}</text>`;
  series.forEach((s, si) => {
    const pts = [...s.pts].sort((a,b) => a.x.localeCompare(b.x));
    const d = pts.map((p,i) => `${i?"L":"M"}${X(parse(p.x).getTime()).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
    if (si === 0 && pts.length > 1) g += `<path class="s1a" d="${d}L${X(parse(pts[pts.length-1].x).getTime())},${Y(y0)}L${X(parse(pts[0].x).getTime())},${Y(y0)}Z"/>`;
    g += `<path class="${si ? "s2" : "s1"}" d="${d}"/>`;
    pts.forEach((p,i) => { const last = i === pts.length-1; g += `<circle class="${si?"d2":"d1"}" cx="${X(parse(p.x).getTime())}" cy="${Y(p.y)}" r="${last?4.5:3}"/>`; });
    if (si === 0){ const p = pts[pts.length-1]; const x = X(parse(p.x).getTime()); g += `<text class="lab" x="${Math.min(x, W-R)}" y="${Y(p.y)-9}" text-anchor="${x > W-60 ? "end" : "middle"}">${fmt(p.y,dec)}${unit}</text>`; }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`;
}
function barChart(rows, {h=170} = {}){
  if (!rows.length) return "";
  const W = 340, L = 38, R = 10, T = 14, B = 24;
  const max = Math.max(...rows.map(r => Math.max(r.v, r.plan||0)), 10); const ticks = niceTicks(0, max); const y1 = ticks[ticks.length-1];
  const bw = (W - L - R) / rows.length;
  const Y = v => T + (1 - v/y1) * (h - T - B);
  let g = ticks.map(t => `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axis" x="${L-6}" y="${Y(t)+4}" text-anchor="end">${t}</text>`).join("");
  rows.forEach((r,i) => {
    const x = L + i*bw + bw*0.18, w = bw*0.64;
    g += `<rect class="bar${r.plan && r.v < r.plan*0.9 ? " low" : ""}" x="${x}" y="${Y(r.v)}" width="${w}" height="${Math.max(0, Y(0)-Y(r.v))}" rx="3"/>`;
    if (r.plan) g += `<line class="plan" x1="${x-2}" x2="${x+w+2}" y1="${Y(r.plan)}" y2="${Y(r.plan)}"/>`;
    g += `<text class="axis" x="${x + w/2}" y="${h-6}" text-anchor="middle">${esc(r.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`;
}

/* ---- Weight changes: adjust the reps so the effort stays the same ---- */
function setRef(x, e, w, si, prev){
  const s = x.sets[si];
  const p = prev ? (prev.sets.find(t => t.label === s.label && t.done) || null) : null;
  const tk0 = targetKg(e, w), tk = tk0 != null && isLb() ? loadOut(tk0) * LBK : tk0, tr = repTop(targetReps(e, w));
  const refKg = p && +p.kg > 0 ? +p.kg : tk, refReps = p && +p.reps > 0 ? +p.reps : tr;
  let kgIn = null;
  for (let j = si; j >= 0; j--){ const v = x.sets[j].kg; if (v !== "" && v != null && +v > 0){ kgIn = +v; break; } }
  let repsPh = p ? p.reps : (tr ?? ""), adj = null;
  if (x.type === "load" && kgIn != null && refKg && refReps && Math.abs(kgIn - refKg) > 0.01){
    // Brzycki estimate: steadier than Epley across 5–20 reps
    const rir = rirFor(e, w) ?? 2, tot = Math.min(30, refReps + rir), e1 = refKg * 36 / (37 - tot);
    const r = Math.max(1, Math.min(30, Math.round(37 - 36 * kgIn / e1) - rir));
    adj = {reps: r, refKg, refReps, kg: kgIn}; repsPh = r;
  }
  return {p, kgPh: kgIn != null ? kgIn : (refKg ?? ""), repsPh, adj};
}
function adjNote(x, e, w, prev){
  for (let si = 0; si < x.sets.length; si++){
    if (x.sets[si].done) continue;
    const a = setRef(x, e, w, si, prev).adj; if (!a) continue;
    let msg = `At ${W(a.kg)}, aim for about ${a.reps} reps a set: the same effort as ${a.refReps} × ${W(a.refKg)}.`;
    if (a.reps > 20) msg += " That's light for this exercise: add a set, or lower the weight slowly.";
    if (a.reps < 3) msg += " That's very heavy for this exercise: go lighter if you can.";
    return msg;
  }
  return "";
}

function zonePill(hr){

}

/* ---- Timer ---- */
function timerHTML(){
  if (!S.timer) return "";
  const left = Math.max(0, Math.ceil((S.timer.end - Date.now())/1000));
  const pct = S.timer.total ? (1 - left / S.timer.total) * 100 : 100;
  return `<div class="timer ${left===0?"ring":""}" id="timer" role="timer" aria-live="polite" ${S.view==="log" ? 'style="bottom:calc(16px + env(safe-area-inset-bottom,0px))"' : ""}><div class="wrap"><div class="box">
  <b id="t-left">${left === 0 ? "Go!" : `${Math.floor(left/60)}:${pad(left%60)}`}</b><div class="bar"><i id="t-bar" style="width:${pct}%"></i></div>
  ${left === 0 ? `<span class="small t-next" style="font-weight:600">Next set</span>` : `<button data-act="t-add">+15s</button><button data-act="t-stop">Skip</button>`}</div></div></div>`;
}
/* Loud beep when rest ends. Web Audio needs a tap to unlock it, so it's unlocked when the timer starts. */
let AC = null;
function ensureAudio(){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch(e){ AC = null; } }
function beep(){
  ensureAudio(); if (!AC) return;
  try {
    const t0 = AC.currentTime + 0.02;
    [[0, 0.18, 988], [0.3, 0.18, 988], [0.6, 0.55, 1319]].forEach(([d, len, f]) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(1, t0 + d + 0.015);
      g.gain.setValueAtTime(1, t0 + d + len - 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + len);
      o.connect(g); g.connect(AC.destination); o.start(t0 + d); o.stop(t0 + d + len + 0.02);
    });
  } catch(e){}
}
let timerTick = null;
function startTimer(sec){
  if (!sec) return;
  ensureAudio();
  S.timer = {end: Date.now() + sec*1000, total: sec, rang:false};
  if (!timerTick) timerTick = setInterval(updateTimer, 250);
  const old = document.getElementById("timer"); if (old) old.remove();
  app.insertAdjacentHTML("beforeend", timerHTML());
}
function updateTimer(){
  if (!S.timer){ clearInterval(timerTick); timerTick = null; return; }
  const left = Math.max(0, Math.ceil((S.timer.end - Date.now())/1000));
  const el = document.getElementById("t-left"), bar = document.getElementById("t-bar"), box = document.getElementById("timer");
  if (el) el.textContent = left === 0 ? "Go!" : `${Math.floor(left/60)}:${pad(left%60)}`;
  if (bar) bar.style.width = (1 - left / S.timer.total) * 100 + "%";
  if (left === 0 && !S.timer.rang){
    S.timer.rang = true; S.timer.rangAt = Date.now();
    if (box){ box.classList.add("ring"); box.querySelectorAll("button").forEach(b => b.remove()); if (!box.querySelector(".t-next")) box.querySelector(".box").insertAdjacentHTML("beforeend", `<span class="small t-next" style="font-weight:600">Next set</span>`); }
    beep();
    try { if (NATIVE && NATIVE.Plugins && NATIVE.Plugins.Haptics) NATIVE.Plugins.Haptics.vibrate({duration:600}); else if (navigator.vibrate) navigator.vibrate([200,100,200]); } catch(e){}
  }
  // the finished timer clears itself after a few seconds: no button to tap
  if (S.timer.rang && Date.now() - S.timer.rangAt > 4000){ S.timer = null; const tb = document.getElementById("timer"); if (tb) tb.remove(); return; }
  const em = document.getElementById("elapsed");
  if (em && S.draft) em.textContent = `${Math.max(0, Math.round((Date.now() - S.draft.startedAt)/60000))} min · week ${S.draft.week}`;
}

const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
const numOrNull = v => v === "" || v == null || isNaN(+v) ? null : +v;

async function saveRec(col, rec){
  const arr = S.data[col]; const i = arr.findIndex(r => r.id === rec.id);
  if (i >= 0) arr[i] = rec; else arr.push(rec);
  if (S.hist) S.hist.touch(col, rec);
  if (isCloudClient()) return cloudSaveRec(col, rec);
  try { await Store.put({...rec, col}); } catch(e){ toast("Couldn't save on this device."); throw e; }
}
async function delRec(col, id){
  const rec = S.data[col].find(r => r.id === id);
  S.data[col] = S.data[col].filter(r => r.id !== id);
  if (S.hist) S.hist.touch(col, id, true);
  if (isCloudClient()){ cloudDelRec(col, id); if (rec && rec.fileId) Store.delFile(rec.fileId).catch(()=>{}); return; }
  try { await Store.del(id); if (rec && rec.fileId) await Store.delFile(rec.fileId); } catch(e){ toast("Couldn't delete on this device."); }
}
let wakeLock = null;
// The screen stays on whenever the app is open and in front. The Android app does this natively; this covers the web version.
async function keepAwake(){
  try { if (document.visibilityState === "visible" && navigator.wakeLock && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
document.addEventListener("pointerdown", () => keepAwake(), {passive: true});
function goLog(){ S.view = "log"; S.forceRender = true; render(); window.scrollTo(0,0); keepAwake(); }

async function finishWorkout(){
  const D = S.draft;
  const any = D.exercises.some(x => x.sets.some(s => s.done || s.reps !== "" || s.kg !== ""));
  if (!any){ toast("Log at least one set before saving."); return; }
  const session = { id: D.id, date: D.date, ts: String(D.startedAt), week: D.week, day: D.day, title: D.title,
    durationMin: Math.round((Date.now() - D.startedAt)/60000), backPain: D.backPain, notes: D.notes, pre: D.pre,
    exercises: D.exercises.map(x => ({ base:x.base, performedAs:x.performedAs, type:x.type, note:x.note,
      ...(x.speed ? {speed: +x.speed || x.speed} : {}), ...(x.incline ? {incline: +x.incline || x.incline} : {}), ...(num(x.hr) ? {hr: +x.hr} : {}),
      sets: x.sets.map(s => ({label:s.label, reps:s.reps, kg:s.kg, done: s.done || (s.reps !== "")})) })) };
  const before = gameStats();
  try { await saveRec("sessions", session); } catch(e){ return; }
  sendWorkoutAlert(session);
  const after = gameStats();
  clearDraft(); S.timer = null; keepAwake();
  const sets = session.exercises.reduce((a,e)=>a + e.sets.filter(s=>s.done).length, 0);
  S.view = "workouts"; S.sub = null; window.scrollTo(0,0);
  openSheet({kind:"celebrate", c:{title: `${session.title} · ${sets} sets · ${session.durationMin} min`, pts: after.xp - before.xp, xp: after.xp,
    pbs: after.pb.events.filter(e => e.sid === session.id), rankUp: after.rank.idx > before.rank.idx, rank: after.rank.name, nextName: after.rank.nextName,
    badges: [...after.badges].filter(b => !before.badges.has(b)), streak: after.streak.cur, weekDone: after.rings.work[0], weekPlan: after.rings.work[1]}});
  if (isCloudClient()) scheduleSync();
}

async function exportCSV(){
  if (S.hist && !S.hist.all){ toast("Loading your full history…"); await S.hist.load(true); }
  const rows = [["date","week","day","workout","exercise","performed_as","set","reps_or_metres_or_sec","kg","done","back_pain","session_notes"]];
  [...S.data.sessions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s => s.exercises.forEach(e => e.sets.forEach(t =>
    rows.push([s.date, s.week, s.day, s.title, e.base, e.performedAs, t.label, t.reps, t.kg, t.done ? "yes" : "no", s.backPain ?? "", s.notes || ""]))));

  saveFile(`primal-strength-sets-${today()}.csv`, csv, "Sets spreadsheet");

let downloadsNS;
const NATIVE = (() => { try { return window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() ? window.Capacitor : null; } catch(e){ return null; } })();
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
async function saveFile(filename, data, title){
  if (NATIVE && NATIVE.Plugins && NATIVE.Plugins.Filesystem && NATIVE.Plugins.Share){
    try {
      const opts = {path: filename.replace(/[^\w.\-]+/g, "_"), directory: "CACHE"};
      if (typeof data === "string"){ opts.data = data; opts.encoding = "utf8"; } else opts.data = await blobToB64(data);
      const r = await NATIVE.Plugins.Filesystem.writeFile(opts);
      await NATIVE.Plugins.Share.share({title, files:[r.uri], dialogTitle: title});
      return true;
    } catch(e){
      if (/cancel/i.test(String(e && (e.message || e)))) return false;
      if (typeof data === "string"){ openSheet({kind:"text", title, text:data}); } else toast("Couldn't share the file.");
      return false;
    }
  }
  try {
    if (downloadsNS === undefined) downloadsNS = window.claude ? await window.claude.use("downloads") : null;
  } catch(e){ downloadsNS = null; }
  if (!downloadsNS){ if (typeof data === "string"){ openSheet({kind:"text", title, text:data}); } else toast("Saving files isn't available here."); return false; }
  try { await downloadsNS.save({filename, data}); toast("Saved"); return true; }
  catch(e){
    if (e && e.code === "declined") return false;
    if (e && e.code === "rate_limited"){ toast("A save is already open. Try again in a moment."); return false; }
    if (typeof data === "string") openSheet({kind:"text", title, text:data}); else toast("Couldn't save the file here.");
    return false;
  }
}
async function restore(file){
  try {
    const j = JSON.parse(await file.text());
    if (!j || !Array.isArray(j.sessions)) throw new Error("bad");
    S.sheet = {kind:"confirm", title:"Restore this backup?", text:`It holds ${j.sessions.length} workouts, ${ (j.cardio||[]).length } cardio sessions and ${(j.body||[]).length} check-ins from ${j.exportedAt ? j.exportedAt.slice(0,10) : "an earlier date"}. It replaces what's on this device now. Report files aren't included in backups.`, yes:"Replace and restore", danger:true, run: async () => {
      if (isCloudClient()){
        for (const c of COLS) for (const r of (j[c] || [])) await saveRec(c, {...r, fileId: c === "dexa" ? null : r.fileId});
        if (j.settings) S.profile.settings = {...S.profile.settings, ...j.settings};
        if (j.program && !trainerManaged()) S.profile.program = j.program;
        await persistProfile(); toast("Backup restored to your account"); return;
      }
      await Store.clearRecords();
      for (const c of COLS){ S.data[c] = (j[c] || []).map(r => ({...r, fileId: c === "dexa" ? null : r.fileId})); for (const r of S.data[c]) await Store.put({...r, col:c}); }
      if (Store.mode === "local") Store._local();
      if (j.program) S.profile.program = j.program; if (j.settings) S.profile.settings = {...S.profile.settings, ...j.settings};
      await Store.saveProfile(S.profile); toast("Backup restored");
    }};
    S.forceRender = true; render();
  } catch(e){ toast("That file isn't a Primal Strength backup."); }
}

function setPath(obj, path, v){
  const ks = path.split("."); let o = obj;
  for (let i = 0; i < ks.length - 1; i++) o = o[isNaN(ks[i]) ? ks[i] : +ks[i]];
  o[ks[ks.length-1]] = v;
}
async function saveBuilder(){
  const p = clean(S.builder.p);
  if (S.builder.multi){ p.block = {weeks: 8, deload: [], extra: [], builtin: false}; delete p.notesText; delete p.event; }
  const weeks = Math.round(+p.block.weeks);
  if (!(weeks >= 1 && weeks <= 52)) return toast("Block length must be 1 to 52 weeks.");
  const dl = p.block.deloadText != null ? String(p.block.deloadText).split(/[^0-9]+/).filter(Boolean).map(Number) : (p.block.deload || []);
  if (dl.some(x => x < 1 || x > weeks)) return toast(`Deload weeks must be between 1 and ${weeks}.`);
  p.block = {...p.block, weeks, deload:[...new Set(dl)].sort((a,b)=>a-b), extra:(p.block.extra||[]).filter(x => x <= weeks), builtin:false}; delete p.block.deloadText;
  if (p.event && !p.event.name && !p.event.date) delete p.event;
  if (p.notesText != null){ p.notes = String(p.notesText).split("\n").map(x => x.trim()).filter(Boolean); delete p.notesText; }
  if (!p.days.length) return toast("Add at least one training day.");
  for (const [i, d] of p.days.entries()){
    d.id = String.fromCharCode(65 + i); d.dow = +d.dow; d.title = (d.title || "").trim() || `Day ${d.id}`;
    if (!d.ex.length) return toast(`Day ${d.id} has no exercises.`);
    for (const e of d.ex){
      e.sets = Math.max(1, Math.round(+e.sets || 0)); if (!e.sets) return toast(`Set a number of sets for ${e.n}.`);
      e.rest = Math.max(0, Math.round(+e.rest || 0));
      e.kg = e.kg === "" || e.kg == null || isNaN(+e.kg) ? null : +e.kg;
      e.kgInc = e.kgInc === "" || e.kgInc == null || isNaN(+e.kgInc) ? null : +e.kgInc;
      e.rir = e.rir === "" || e.rir == null || isNaN(+e.rir) ? null : +e.rir;
      e.repsInc = e.repsInc === "" || e.repsInc == null || isNaN(+e.repsInc) || !+e.repsInc ? null : +e.repsInc;
      e.repsMax = e.repsMax === "" || e.repsMax == null || isNaN(+e.repsMax) || !+e.repsMax ? null : +e.repsMax;
      e.reps = String(e.reps || "").trim() || "8";
      ["incline","inclineInc","inclineMax"].forEach(k => { e[k] = e[k] === "" || e[k] == null || isNaN(+e[k]) ? null : +e[k]; });
      ["speed","effort"].forEach(k => { e[k] = e[k] == null ? null : String(e[k]).trim() || null; });
      if (e.side) e.side.extra = e.side.extra || null;
    }
  }
  p.startDate = mondayOf(p.startDate || today()); p.cardioWeekly = Math.max(0, Math.round(+p.cardioWeekly || 0)); p.byTrainer = true;
  if (S.builder.multi) return openSheet({kind:"msend", stage:"pick", mode:"once", date: today(), sel: [], day: p.days[0]});
  uref(S.builder.clientId).update({program: p, programUpdatedAt: ts()}).catch(e => toast("Couldn't save the program: " + (e.code || "error")));
  toast("Program saved — your client sees it next time the app syncs");
  S.view = "client"; S.ctab = "program"; S.builder = null; S.forceRender = true; render(); window.scrollTo(0,0);
}

async function authGo(){
  const email = val("a-email"), pass = (document.getElementById("a-pass") || {}).value || "";
  if (!email || !pass) return toast("Enter your email and password.");
  const btn = document.querySelector('[data-act="auth-go"]'); if (btn){ btn.disabled = true; btn.textContent = "Please wait…"; }
  try {
    const st = (S.sheet && S.sheet.kind === "auth") ? S.sheet : S.authPage;
    if (st.mode === "up"){
      const name = val("a-name"); if (!name){ if (btn){ btn.disabled = false; btn.textContent = "Create account"; } return toast("Enter your name."); }
      Cloud.pending = {role: ["trainer","owner","desk"].includes(st.role) ? st.role : "client", name, gymName: val("a-gym")};
      await firebase.auth().createUserWithEmailAndPassword(email, pass);
    } else await firebase.auth().signInWithEmailAndPassword(email, pass);
    if (S.sheet && S.sheet.kind === "auth") S.sheet = null; S.forceRender = true; render();
  } catch(e){
    Cloud.pending = null;
    const m = {"auth/email-already-in-use":"That email already has an account — sign in instead.","auth/invalid-email":"That email address isn't valid.","auth/weak-password":"Use at least 6 characters for the password.","auth/invalid-credential":"Wrong email or password.","auth/wrong-password":"Wrong email or password.","auth/user-not-found":"No account with that email.","auth/network-request-failed":"No internet connection.","auth/too-many-requests":"Too many attempts. Wait a few minutes and try again."}[e.code];
    toast(m || "Couldn't sign in: " + (e.code || e.message));
    const st2 = (S.sheet && S.sheet.kind === "auth") ? S.sheet : S.authPage;
    if (btn){ btn.disabled = false; btn.textContent = st2 && st2.mode === "up" ? "Create account" : "Sign in"; }

      hpush: "Push-up", hpush2: sh ? "Push-up" : "Pike push-up",
      hpull: "Inverted row", hpull2: "Band pull-apart",
      vpush: sh ? "Push-up" : "Pike push-up", vpull: "Inverted row",
      single: knee || hip ? "Single-leg glute bridge" : "Split squat",
      core: "Dead bug", core2: "Side plank", carry: "Bird dog",
      cond: knee ? "Mountain climber" : "Burpee", arms1: "Bench dip", arms2: "Push-up", calf: "Bird dog"

  const lower = [[E(pick.squat,1), E(pick.hinge2), E(pick.single), E(pick.calf), E(pick.core), E(pick.carry), E(pick.cond)],

function dedupeEx(ex){ const seen = new Set(); return ex.filter(e => { if (seen.has(e.n)) return false; seen.add(e.n); return true; }); }
function finishPlan(p, a, why, warn, tips, flagged){

function rankFor(xp){

function sessionCardioMin(s){ if (s.event){ const k = EVENT_KINDS[s.event.kind] || {}; return k.mode ? (s.event.finish ? s.event.finish / 60 : +s.durationMin || 0) : 0; } return s.exercises.reduce((a, e) => a + exCardioMin(e), 0); }

function pbScan(){
  const best = {}, events = [];
  ascSessions().forEach(s => {
    const seen = new Set();
    s.exercises.forEach(e => {

      let c = null;
      if (e.type === "load" || e.type === "carry"){

      } else if (["bw","time","run"].includes(e.type)){

function ringsFor(w){
  const st = weekStats(w), pd = pauseDaysIn(pauseList(), st.start, st.end), left = (7 - pd) / 7;
  const planned = pd >= 7 ? 0 : Math.max(1, Math.ceil(Math.max(1, prog().days.length) * left));
  const cardio = st.cardio;
  const target = Math.round((st.plan || 90) * left);
  const check = S.data.body.some(b => b.date >= st.start && b.date <= st.end) || pd >= 4 ? 1 : 0;
  const r = {work:[st.sessions.length, planned], cardio:[cardio, target], check:[check, 1], st, paused: pd};
  r.full = pd < 7 && st.sessions.length >= planned && cardio >= target && check === 1;

}
function activeWeeks(){
  const all = [...S.data.sessions, ...S.data.cardio, ...S.data.body].map(r => weekOf(r.date));

}
function streakInfo(){
  const sess = S.data.sessions; const cw = weekOf(today());
  if (!sess.length) return {cur:0, best:0, thisWeek:"missed"};
  const planned = Math.max(1, prog().days.length), first = Math.min(...sess.map(s => weekOf(s.date))), normal = set_().backNormal;
  const status = w => {
    const st = weekStats(w), pd = pauseDaysIn(pauseList(), st.start, st.end);
    if (st.sessions.length >= (pd ? Math.ceil(planned * (7 - pd) / 7) || 1 : planned)) return pd >= 7 ? "excused" : "done";
    if (pd >= 3) return "excused";
    const pains = [...st.sessions.map(s => s.backPain), ...S.data.body.filter(b => b.date >= st.start && b.date <= st.end).map(b => b.backPain)].filter(v => v != null && v !== "").map(Number);

}
function bodyWeightAt(d){ const r = S.data.body.filter(b => b.weight && b.date <= d).sort(byDateDesc)[0]; return r ? +r.weight : ((set_().intake && +set_().intake.weight) || null); }
function strengthScore(asOf){

    S.data.sessions.forEach(s => { if (s.date < from || s.date > asOf) return; s.exercises.forEach(e => { const fac = f.ex[e.performedAs]; if (!fac) return; doneSets(e).forEach(x => { const v = e1rm(+x.kg, +x.reps); if (v && v * fac > bestE) bestE = v * fac; }); }); });

/* ============ Event dates ============ */
const EVENT_MIN = {hyrox:8, marathon:12, half:8, "10k":5, triathlon:8};
function progWeek(w){ const b = blk(); let x = w; if (b.peak != null) x = Math.min(x, b.peak); return Math.max(1, x - (b.base || 0)); }
function fitToEvent(p, dateStr){
  if (!dateStr) return {ok:false, msg:"Pick the event date first."};
  const t0 = today();
  if (dateStr < t0) return {ok:false, msg:"That date has already passed. Pick a future date."};
  const b = p.block = {...(p.block || {})};
  if (b.builtin) return {ok:false, msg:"This program can't be fitted to a date. Start from an event template instead."};
  if (!b.templateWeeks){ b.templateWeeks = b.weeks; b.templateDeload = [...(b.deload || [])]; }
  const W = b.templateWeeks, TD = b.templateDeload;
  let T = 0; for (let w = W; w >= 1 && TD.includes(w); w--) T++; T = Math.max(1, T);
  const mid = TD.filter(d => d <= W - T);
  const dow = parse(t0).getDay(), cand = dow >= 1 && dow <= 3 ? mondayOf(t0) : mondayOf(addDays(t0, 7));
  const evMon = mondayOf(dateStr), A = Math.floor(daysBetween(cand, evMon) / 7) + 1;
  const min = EVENT_MIN[p.eventKey] || Math.ceil(W * 0.6);
  let weeks, base = 0, start, status;
  if (A < 1){ weeks = 1; start = mondayOf(t0); status = "tooShort"; }
  else if (A >= W){ base = Math.min(A - W, 12); weeks = W + base; start = addDays(evMon, -(weeks - 1) * 7); status = A - W > 12 ? "later" : "ok"; }
  else { weeks = A; start = cand; status = A >= min ? "short" : "tooShort"; }
  const Tn = Math.min(T, weeks), peak = weeks - Tn;
  const baseDl = []; for (let i = 4; i <= base; i += 4) baseDl.push(i);
  const deload = [...new Set([...baseDl, ...mid.map(d => d + base).filter(d => d <= peak - 1), ...Array.from({length: Tn}, (_, i) => peak + 1 + i)])].sort((x, y) => x - y);
  Object.assign(b, {weeks, deload, base, peak, builtin:false}); delete b.deloadText;
  p.startDate = start; p.event = {...(p.event || {}), date: dateStr}; p.fitted = status;
  const name = (p.event && p.event.name) || "your event", wk = n => `${n} week${n === 1 ? "" : "s"}`;
  const msg = {
    ok: `The plan runs ${wk(weeks)}, from ${shortDate(start)} to race week: ${base ? `${wk(base)} of base training, then the ${wk(W)} build` : `the full ${wk(W)} build`}, with a taper into race day.`,
    later: `${name} is ${wk(A)} away, so the plan starts on ${shortDate(start)} and peaks for race day. Until then, keep training generally — a coach can plan the extra time for you.`,
    short: `${name} is ${wk(A)} away, shorter than the ideal ${wk(W)}. The plan starts at the beginning and tapers into race week, so you may not reach full race volume. A coach can tailor this to you.`,
    tooShort: `There isn't enough time to fully prepare for ${name}: it's ${A < 1 ? "this week" : wk(A) + " away"}, and we'd normally plan ${wk(W)} (at least ${wk(min)}). We'll get you as close to ready as possible — building from where you are and tapering into race day — but the best way to prepare in this time is to work with a real coach.`
  }[status];
  return {ok:true, status, msg, weeks, available: A};
}

async function addBuddy(code){

    if (!d.exists) return toast("No one has that buddy code. Check it and try again.");

/* ============ DEXA-based balance work ============ */
const UNI = (() => {
  const same = {L:"L", R:"R"}, cross = {L:"R", R:"L"}, m = {};
  const add = (list, region, names, trains) => list.forEach(n => m[n] = {region, names, trains});
  add(["Suitcase carry"], "trunk", {L:"Left hand", R:"Right hand"}, cross);
  add(["Side plank"], "trunk", {L:"Left side down", R:"Right side down"}, same);
  add(["Pallof press", "Band Pallof press", "Half-kneeling cable chop", "Copenhagen plank"], "trunk", {L:"Left side", R:"Right side"}, same);
  add(["Single-arm overhead carry", "Single-arm DB row", "Single-arm cable row", "Single-arm cable pulldown", "Landmine press", "Half-kneeling landmine press"], "arm", {L:"Left arm", R:"Right arm"}, same);
  add(["Bulgarian split squat", "Split squat", "Front-foot-elevated split squat", "Reverse lunge", "Forward lunge", "Walking lunge", "Lateral lunge", "Step-up", "Single-leg RDL", "Single-leg glute bridge", "Skater squat"], "leg", {L:"Left leg", R:"Right leg"}, same);
  return m;
})();
const BAL_THRESHOLD = 5; // % difference in lean mass between sides that triggers balance work
function balanceInfo(){
  if (!S.profile || !S.profile.settings || S.profile.settings.balanceWork === false) return null;
  const d = [...(S.data.dexa || [])].filter(x => x.date).sort(byDateDesc)[0]; if (!d) return null;
  const out = {date: d.date, any: false};
  [["trunk", "trunkL", "trunkR"], ["arm", "armL", "armR"], ["leg", "legL", "legR"]].forEach(([r, l, rr]) => {
    const L = +d[l], R = +d[rr]; if (!(L > 0 && R > 0)) return;
    const pct = Math.abs(L - R) / ((L + R) / 2) * 100;
    out[r + "Pct"] = Math.round(pct * 10) / 10;
    if (pct >= BAL_THRESHOLD){ out[r] = {weak: L < R ? "L" : "R", pct: Math.round(pct), L, R}; out.any = true; }
  });
  return out;
}
function sideFor(ex){
  const u = UNI[ex.n];
  if (!u && !ex.side) return null;
  const names = u ? u.names : ex.side.names;
  const b = u ? balanceInfo() : null, reg = b && b[u.region];
  if (reg){ const s = u.trains.L === reg.weak ? "L" : "R"; return {order: [s, s === "L" ? "R" : "L"], extra: s, names, reason: reg, region: u.region}; }
  if (ex.side) return {order: ex.side.order, extra: null, names};
  return null;
}
function balanceCue(sd){
  if (!sd || !sd.extra || !sd.reason) return "";
  return `${sd.names[sd.extra]} first, with an extra set: your ${sd.reason.weak === "L" ? "left" : "right"} ${sd.region} had ${sd.reason.pct}% less lean mass on your last DEXA scan.`;
}
function balanceCard(){
  const scan = [...(S.data.dexa || [])].filter(x => x.date).sort(byDateDesc)[0];
  if (!scan) return "";
  const on = set_().balanceWork !== false;
  const b = (() => { const keep = S.profile.settings.balanceWork; S.profile.settings.balanceWork = true; try { return balanceInfo(); } finally { S.profile.settings.balanceWork = keep; } })();
  const rows = [["trunk", "Trunk", "carries, side planks, Pallof presses"], ["arm", "Arms", "single-arm rows, presses and carries"], ["leg", "Legs", "split squats, lunges, step-ups and single-leg work"]]
    .filter(([r]) => b && b[r + "Pct"] != null)
    .map(([r, lbl, ex]) => b[r] ? `<div class="small"><b>${lbl}:</b> ${b[r].weak === "L" ? "left" : "right"} side ${b[r].pct}% lighter → extra set and goes first on ${ex}.</div>` : `<div class="small"><b>${lbl}:</b> balanced (${b[r + "Pct"]}% difference).</div>`);
  if (!rows.length) return `<section class="card"><h3>Left–right balance</h3><span class="small muted">Add trunk, arm or leg lean mass for each side to your DEXA scan to get balance work.</span></section>`;
  return `<section class="card"><div class="row between" style="flex-wrap:nowrap"><h3>Left–right balance</h3><button class="toggle ${on ? "on" : ""}" data-act="bal-toggle" aria-pressed="${on}" aria-label="Balance work from DEXA"></button></div>
  <span class="small muted">From your ${shortDate(scan.date)} scan. A side with ${BAL_THRESHOLD}% or more less lean mass gets an extra set on one-sided exercises, and goes first. It switches off when a new scan shows the gap has closed.</span>${rows.join("")}
  ${on ? "" : `<span class="small muted">Balance work is off — both sides get the same sets.</span>`}</section>`;
}

const METRICS = {

  if (c.metric === "test") return `Best: ${(STESTS[c.test] || {l: "test"}).l}`;
  if (c.metric === "mix") return "Mix: " + (c.mix || []).map(m => `${METRICS[m.m] ? METRICS[m.m][0] : m.m} ×${m.w}`).join(" + ");
  return METRICS[c.metric] ? METRICS[c.metric][0] : c.metric;

function metricValue(m, ch){
  const inW = d => d >= ch.start && d <= ch.end;
  const sess = S.data.sessions.filter(s => inW(s.date));
  const sets = s => s.exercises.flatMap(e => doneSets(e).map(x => ({e, x})));
  switch (m){
    case "sessions": return sess.length;
    case "cardio": return Math.round(S.data.cardio.filter(c => inW(c.date)).reduce((a, c) => a + (+c.minutes || 0), 0) + sess.reduce((a, s) => a + sessionCardioMin(s), 0));
    case "km": return Math.round(sess.reduce((a, s) => a + sessionKm(s), 0) * 10) / 10;
    case "points": return xpLedger(pbScan()).items.filter(i => inW(i.date)).reduce((a, i) => a + i.pts, 0);
    case "strength": { const a = strengthScore(addDays(ch.start, -1)), b = strengthScore(ch.end < today() ? ch.end : today()); return a && b ? b.score - a.score : 0; }
    case "sets": return sess.reduce((a, s) => a + sets(s).length, 0);
    case "tonnes": return Math.round(sess.reduce((a, s) => a + sessionVolume(s), 0) / 10) / 100;
    case "checkins": return new Set(S.data.body.filter(b => inW(b.date)).map(b => b.date)).size;
    case "pbs": return pbScan().events.filter(e => inW(e.date)).length;
    case "fullweeks": return activeWeeks().filter(w => { const r = ringsFor(w); return r.full && r.st.start >= mondayOf(ch.start) && r.st.start <= ch.end; }).length;
    case "exkg": { const v = Math.max(0, ...sess.flatMap(s => sets(s).filter(o => o.e.performedAs === ch.exercise).map(o => +o.x.kg || 0))); return v || null; }
    case "exreps": { const v = Math.max(0, ...sess.flatMap(s => sets(s).filter(o => o.e.performedAs === ch.exercise).map(o => +o.x.reps || 0))); return v || null; }
    case "swim": case "bike": case "row": case "endmin": case "rounds": case "races": case "climbs": case "mobility": case "evbest": case "test": return sportMetricValue(m, ch);
    case "pace": { const ps = sess.flatMap(s => sets(s).filter(o => o.e.type === "run" && +o.x.reps >= 1 && +o.x.kg > 0).map(o => +o.x.kg / +o.x.reps)); return ps.length ? Math.round(Math.min(...ps) * 100) / 100 : null; }
  }
  return 0;
}

/* ---- periods ---- */
const endOfMonth = d => { const x = parse(d); return ymd(new Date(x.getFullYear(), x.getMonth() + 1, 0)); };
function presetDates(p){
  const t = today(), mon = mondayOf(t), first = d => { const x = parse(d); return ymd(new Date(x.getFullYear(), x.getMonth(), 1)); };
  if (p === "thisweek") return [t, addDays(mon, 6)];
  if (p === "nextweek") return [addDays(mon, 7), addDays(mon, 13)];
  if (p === "thismonth") return [t, endOfMonth(t)];
  if (p === "nextmonth"){ const n = addDays(endOfMonth(t), 1); return [n, endOfMonth(n)]; }
  if (p === "4w") return [t, addDays(t, 27)];
  if (p === "8w") return [t, addDays(t, 55)];
  return null;
}
function nextPeriod(c){
  const start = addDays(c.end, 1);
  if (c.repeat === "week") return [start, addDays(start, 6)];
  if (c.repeat === "month") return [start, parse(start).getDate() === 1 ? endOfMonth(start) : addDays(start, daysBetween(c.start, c.end))];
  return [start, addDays(start, daysBetween(c.start, c.end))];
}
async function rollChallenges(){
  if (!isTrainer()) return;
  Social.rolling = Social.rolling || new Set();
  for (const c of Social.challenges){
    if (!c.repeat || c.next || c.end >= today() || Social.rolling.has(c.id)) continue;
    Social.rolling.add(c.id);
    let cur = c, guard = 0, created = null;
    while (cur.end < today() && guard++ < 60){
      const [start, end] = nextPeriod(cur);
      created = {...cur, start, end, prev: c.id, series: c.series || c.id, next: null};
      created.id = `${created.series}_${start}`;
      cur = created;
    }
    if (!created) continue;
    const {id, ...data} = created;
    await Cloud.db.collection("challenges").doc(id).set(clean({...data, created: null})).then(() => Cloud.db.collection("challenges").doc(c.id).update({next: id})).catch(() => {});
  }
}

function sportMetricValue(m, ch){
  const inW = d => d >= ch.start && d <= ch.end, L0 = sportLogs().filter(r => inW(r.date));
  const sum = (mode, f) => L0.filter(r => modeIs(r, mode)).reduce((a, r) => a + f(r), 0);
  switch (m){
    case "swim": return Math.round(sum("swim", r => (r.km || 0) * 1000));

    case "endmin": return Math.round(sum("swim,bike,run", r => r.min));
    case "rounds": return sum("combat", r => +r.rounds || 0);

/* ============ Bounded reads ============
   A listener re-reads every document it returns each time the app opens (after about 30 minutes away),
   so listeners cover only recent records. Older records come from this phone's saved copy, which is free;
   the server is asked for them once per phone. By default history goes back 6 months; "Load older history"
   fetches the rest, once per phone. */
const LIVE_DAYS = 42, HISTORY_DAYS = 183, DATED_COLS = ["sessions", "cardio", "body"];
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
// The live window: 6 weeks back, or a week before this phone last synced, whichever is earlier
function liveStart(key){ const seen = lsGet("ps-seen:" + key), d = addDays(today(), -LIVE_DAYS); return seen && addDays(seen, -7) < d ? addDays(seen, -7) : d; }
// Records dated from `want` up to (not including) `to`: from this phone's copy where the server copy was already fetched here
async function fetchHistory(colRef, key, to, want){
  const have = lsGet("ps-hist-from:" + key), out = new Map();
  const add = q => { if (q) q.docs.forEach(d => out.set(d.id, d.data())); };
  if (have && have < to) add(await colRef.where("date", ">=", have > want ? have : want).where("date", "<", to).get({source: "cache"}).catch(() => null));
  if (!have || have > want){
    const q = await colRef.where("date", ">=", want).where("date", "<", have && have < to ? have : to).get().catch(() => null);
    if (q){ add(q); lsSet("ps-hist-from:" + key, want); }
  }
  return [...out.values()];
}
// Listen to someone's collections into target.data: recent records live, older ones as history
function attachData(uid, target, key, onChange){
  const ref = uref(uid), unsubs = [], live = {}, hist = {}, start = liveStart(key);
  const merge = c => { const m = new Map(); (hist[c] || []).forEach(r => m.set(r.id, r)); (live[c] || []).forEach(r => m.set(r.id, r)); target.data[c] = [...m.values()]; };
  COLS.forEach(c => {
    let q = ref.collection(c);
    if (c === "reports" && uid && isTrainer()) q = q.where("shared", "==", true);
    if (DATED_COLS.includes(c)) q = q.where("date", ">=", start);
    unsubs.push(q.onSnapshot(sn => {
      live[c] = sn.docs.map(d => d.data()); merge(c);
      if (c === "sessions" && !(sn.metadata && sn.metadata.fromCache)) lsSet("ps-seen:" + key, today());
      onChange();
    }, () => {}));
  });
  const H = {all: lsGet("ps-hist-all:" + key) === "1", loading: false,
    // keep an edited or deleted record that is older than the live window in step with the screen
    touch(c, rec, del){ if (!DATED_COLS.includes(c) || !hist[c]) return; hist[c] = hist[c].filter(r => r.id !== (del ? rec : rec.id)); if (!del && rec.date < start) hist[c].push(rec); },
    async load(all){
      if (all){ H.all = true; lsSet("ps-hist-all:" + key, "1"); }
      H.loading = true; const want = H.all ? "0000-00-00" : addDays(today(), -HISTORY_DAYS);
      for (const c of DATED_COLS){ hist[c] = await fetchHistory(ref.collection(c), key + ":" + c, start, want); merge(c); }
      H.loading = false; onChange();
    }};
  H.load(false);
  return {unsubs, H};
}

  const H = S.cctx ? S.cctx.H : S.hist; if (!H || H.all) return "";
  return `<div class="row between small" style="flex-wrap:nowrap;gap:12px"><span class="muted">${H.loading ? "Loading history…" : "Showing the last 6 months."}</span><button class="btn ghost" data-act="hist-all">Load older history</button></div>`;

const PAUSE_WHY = [["travel", "Travel / holiday"], ["ill", "Illness"], ["injury", "Injury"], ["busy", "Work / busy"], ["other", "Other"]];
const pauseList = () => (S.profile && S.profile.pauses) || [];
const pauseOn = (list, d) => (list || []).find(p => p && p.from <= d && p.to >= d) || null;
function pauseDaysIn(list, a, b){ if (!(list || []).length) return 0; let n = 0; for (let d = a; d <= b; d = addDays(d, 1)) if (pauseOn(list, d)) n++; return n; }
function curPause(list){ const t = today(); return pauseOn(list, t) || (list || []).filter(p => p.from > t).sort((a, b) => a.from.localeCompare(b.from))[0] || null; }
const pubPauses = list => (list || []).filter(p => p.to >= addDays(today(), -63)).map(p => ({from: p.from, to: p.to}));

/* ---- Comeback plan: after 10+ days off, the first 7 days back are lighter ---- */
let CB = {arr: null, k: "", v: null};
function comebackInfo(){
  const ss = (S.data && S.data.sessions) || [], t = today(), off = (S.profile && set_().comebackOff) || "";
  const k = ss.length + "|" + t + "|" + off;
  if (CB.arr === ss && CB.k === k) return CB.v;
  const ds = [...new Set(ss.map(s => s.date).filter(d => d && d <= t))].sort();
  let v = null;
  if (ds.length){
    const lastD = ds[ds.length - 1], gapNow = daysBetween(lastD, t);
    if (gapNow >= 10) v = {start: t, end: addDays(t, 6), gap: gapNow, after: lastD, waiting: true};
    else for (let i = ds.length - 1; i >= 1; i--){
      if (daysBetween(ds[i], t) > 6) break;
      const g = daysBetween(ds[i - 1], ds[i]);
      if (g >= 10){ v = {start: ds[i], end: addDays(ds[i], 6), gap: g, after: ds[i - 1]}; break; }
    }
  }
  if (v && off === v.after) v = null;
  CB = {arr: ss, k, v};
  return v;
}

/* ---- Personal risk score: each member against their own usual pattern ---- */
// c is a public summary (weekCounts by Monday, lastWorkout, joined, pauses). wkBack > 0 looks at an earlier week, for trends.
function riskOf(c, wkBack = 0){
  const M0 = mondayOf(today()), M = addDays(M0, -7 * wkBack), D = wkBack ? addDays(M, 6) : today();
  const wc = c.weekCounts || {}, wk = i => +wc[addDays(M, -7 * i)] || 0;
  const pauses = c.pauses || [];
  const since = c.joined || c.firstSession || null;
  if (since && since > D) return {st: "none"};
  const isNew = !!since && daysBetween(since, D) < 60;
  const pz = pauseOn(pauses, D);
  if (pz) return {st: "paused", why: `Paused until ${shortDate(pz.to)}`, isNew};
  let last = !wkBack && c.lastWorkout && c.lastWorkout.date ? c.lastWorkout.date : null;
  if (!last) for (let i = 0; addDays(M, -7 * i) >= addDays(M0, -49); i++) if (wk(i) > 0){ last = addDays(M, -7 * i + 3); if (last > D) last = D; break; }
  if (!last && c.lastWorkout && c.lastWorkout.date && c.lastWorkout.date <= D) last = c.lastWorkout.date;
  if (!last){
    const d = since ? daysBetween(since, D) : 0;
    return d >= 7 ? {st: "never", why: "No workout logged yet", isNew, days: d} : {st: "never", why: "Just joined", isNew, fresh: true};
  }
  const pEnd = pauses.filter(p => p.to < D).map(p => addDays(p.to, 1)).sort().pop();
  const ref = pEnd && pEnd > last ? pEnd : last, days = Math.max(0, daysBetween(ref, D));
  const norms = [];
  for (let i = 2; i <= 7; i++){
    const m = addDays(M, -7 * i), e = addDays(m, 6);
    if (m < addDays(M0, -49) || (since && e < since) || pauseDaysIn(pauses, m, e) >= 3) continue;
    norms.push(wk(i));
  }
  const norm = norms.length >= 2 ? norms.reduce((a, b) => a + b, 0) / norms.length : null;
  const usual = norm ? `usually ${fmt(norm, 1)} a week` : "";
  const out = (st, why) => ({st, why, days, norm, isNew});
  if (days > 30) return out("inactive", `No workout for ${days} days`);
  if (days >= (isNew ? 7 : 14)) return out("risk", `No workout for ${days} days${usual ? `; ${usual}` : ""}`);
  if (norm != null && norm >= 1){
    if (days >= Math.max(isNew ? 6 : 8, Math.round(7 / norm * 3))) return out("risk", `No workout for ${days} days; ${usual}`);
    const k = isNew ? 0.67 : 0.5, recent = wk(1), cur = wk(0);
    const lastPaused = pauseDaysIn(pauses, addDays(M, -7), addDays(M, -1)) >= 3;
    if (!lastPaused && recent <= norm * k && norm - recent >= 1 && cur < Math.ceil(norm * k)) return out("risk", `${recent} workout${recent === 1 ? "" : "s"} last week; ${usual}`);
  }
  return out("active", usual ? `Training as usual (${usual.replace("usually ", "")})` : "Training");
}
const RISK_ORDER = {inactive: 0, risk: 1, never: 2, active: 3, paused: 4, none: 5};

async function shareReport(m){

  const name = `primal-strength-${m}.png`;
  if (!NATIVE && navigator.canShare && typeof File === "function"){
    const f = new File([blob], name, {type: "image/png"});

  }
  if (NATIVE) return saveFile(name, blob, "Monthly report card");

}

const joinedOf = c => c.joined || c.firstSession || null;
function retainedAt(c, n){ const j = joinedOf(c); if (!j || addDays(j, n) > today()) return null; return !!(c.lastWorkout && c.lastWorkout.date >= addDays(j, n)); }
function retCells(list){
  return [30, 90, 180].map(n => { const el = list.map(c => retainedAt(c, n)).filter(v => v != null); return el.length ? {p: Math.round(el.filter(Boolean).length / el.length * 100), n: el.length} : null; });
}
const retCell = x => x ? `<b>${x.p}%</b> <span class="muted">of ${x.n}</span>` : `<span class="muted">–</span>`;
function retentionHTML(members, splits){

  out += `<section class="grid3"><div class="stat"><b class="num">${members.length}</b><span>Members</span></div><div class="stat"><b class="num">${cnt("active")}</b><span>Active</span></div><div class="stat"><b class="num">${cnt("risk") + cnt("inactive")}</b><span>At risk or inactive</span></div>

  const keys = Object.keys(splits), k = keys.includes(S.ui.retSplit) ? S.ui.retSplit : keys[0];

  ${Object.entries(groups).sort((a, b) => b[1].length - a[1].length).map(([g, l]) => `<tr><td style="white-space:normal;min-width:110px">${esc(g)}</td><td>${l.length}</td><td>${l.filter(c => ["risk", "inactive"].includes(riskOf(c).st)).length}</td>${retCells(l).map(x => `<td>${retCell(x)}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="6" class="muted">No members yet.</td></tr>`}</table></div></section>`;
  const wks = [5, 4, 3, 2, 1, 0], lab = k2 => k2 ? `−${k2}w` : "Now";

/* ---- metrics from client summaries (no private data) ---- */
function clientStatus(c){ return riskOf(c).st; }
function last4(c){ const wk = c.weekCounts || {}; let n = 0; for (let i = 0; i < 4; i++) n += +wk[addDays(mondayOf(today()), -7 * i)] || 0; return n; }
function trainerStats(tid){
  const cl = Owner.clients[tid] || [], n = cl.length;
  const st = {n, active: 0, risk: 0, inactive: 0, never: 0, paused: 0, none: 0, isNew: 0, w4: 0, planned4: 0, streak: 0, pbs30: 0, week: 0};
  cl.forEach(c => { const r = riskOf(c); st[r.st]++; if (r.isNew) st.isNew++; const w = last4(c); st.w4 += w; st.planned4 += (+c.planned || 0) * 4; st.streak += +c.streak || 0; st.pbs30 += +c.pbs30 || 0; st.week += fresh(c, "weekSessions"); });
  st.perWeek = n ? st.w4 / n / 4 : 0;
  st.adherence = st.planned4 ? Math.min(100, Math.round(st.w4 / st.planned4 * 100)) : null;
  st.avgStreak = n ? st.streak / n : 0;
  st.retention = n ? Math.round(st.active / n * 100) : null;
  const ch = (Owner.chals[tid] || []); st.liveChals = ch.filter(c => c.start <= today() && c.end >= today()).length;
  st.inChallenges = cl.filter(c => (+c.joinedChallenges || 0) > 0).length;

}

   Gym-owned records live under gyms/{gid} (gid = owner's uid): plans, members (including people
   who don't use the app), payments (recorded by hand, with numbered receipts), checkins, staff
   (front-desk logins) and counters. Only the owner and the gym's front desk can read or write them. */
const Hub = {gid: null, gym: null, plans: [], members: [], pays: [], checks: [], staff: [], joined: null, unsub: [], payCache: {}, tSync: ""};
const isDesk = () => !!(Cloud.user && Cloud.me && Cloud.me.role === "desk");
const isGymSide = () => isOwner() || isDesk();
const hubGid = () => isOwner() ? Cloud.user.uid : (Cloud.me && Cloud.me.gymId) || null;
const gref = c => { const g = Cloud.db.collection("gyms").doc(Hub.gid); return c ? g.collection(c) : g; };
const EXIT_WHY = [["cost", "Cost"], ["time", "No time"], ["injury", "Injury or health"], ["moved", "Moved away"], ["interest", "Lost interest"], ["other", "Other"]];
const PAY_MODES = [["upi", "UPI"], ["cash", "Cash"], ["card", "Card"], ["bank", "Bank transfer"]];
const exitLabel = k => (EXIT_WHY.find(x => x[0] === k) || [, "Not given"])[1];
const modeLabel = k => (PAY_MODES.find(x => x[0] === k) || [, k || "–"])[1];
const rupee = n => "₹" + Math.round(+n || 0).toLocaleString("en-IN");
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const digits = s => String(s || "").replace(/\D/g, "");
const finYear = d => { const y = +d.slice(0, 4), m = +d.slice(5, 7), s = m >= 4 ? y : y - 1; return `${s}-${pad((s + 1) % 100)}`; };
const addMonths = (d, n) => { const x = parse(d); const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n); const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return ymd(x); };
const gymName = () => (Hub.gym && Hub.gym.name) || (Cloud.me && Cloud.me.gymName) || "Your gym";
const gymTrainers = () => (Hub.gym && Hub.gym.trainers) || [];
const trainerName = id => (gymTrainers().find(t => t.id === id) || {}).name || "";
const gstRate = () => Hub.gym && Hub.gym.gstin ? (num(Hub.gym.gstRate) ? +Hub.gym.gstRate : 18) : 0;
const rcptPrefix = () => ((Hub.gym && Hub.gym.prefix) || gymName().split(/\s+/).map(w => w[0]).join("").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4) || "PS");

function hubStop(){ Hub.unsub.forEach(f => { try { f(); } catch(e){} }); Object.assign(Hub, {gid: null, gym: null, plans: [], members: [], pays: [], checks: [], staff: [], joined: null, unsub: [], payCache: {}, tSync: ""}); }
function attachHub(){
  const gid = hubGid(); if (Hub.gid === gid && Hub.unsub.length) return;
  hubStop(); Hub.gid = gid; if (!gid) return render();
  const on = () => {
    Hub.unsub.push(gref().onSnapshot(sn => { Hub.gym = sn.exists ? sn.data() : {}; syncGymTrainers(); render(); }, () => {}));
    Hub.unsub.push(gref("plans").onSnapshot(q => { Hub.plans = q.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (a.months - b.months) || (a.price - b.price)); render(); }, () => {}));
    Hub.unsub.push(gref("members").onSnapshot(q => { Hub.members = q.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (a.name || "").localeCompare(b.name || "")); render(); }, () => {}));
    Hub.unsub.push(gref("payments").where("date", ">=", monthStart(prevMonth())).onSnapshot(q => { Hub.pays = q.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (b.date + (b.receipt || "")).localeCompare(a.date + (a.receipt || ""))); render(); }, () => {}));
    Hub.unsub.push(gref("checkins").where("date", ">=", addDays(today(), -30)).onSnapshot(q => { Hub.checks = q.docs.map(d => ({id: d.id, ...d.data()})); render(); }, () => {}));
    if (isOwner()) Hub.unsub.push(gref("staff").onSnapshot(q => { Hub.staff = q.docs.map(d => ({id: d.id, ...d.data()})); render(); }, () => {}));
  };
  if (isOwner()){ Hub.joined = true; on(); return; }
  // Front desk: access lasts while the owner keeps their staff record
  let started = false;
  Hub.unsub.push(gref("staff").doc(Cloud.user.uid).onSnapshot(sn => {
    Hub.joined = sn.exists;
    if (sn.exists && !started){ started = true; on(); }
    if (!sn.exists && started){ const keep = Hub.unsub.shift(); Hub.unsub.forEach(f => { try { f(); } catch(e){} }); Hub.unsub = [keep]; started = false; Object.assign(Hub, {gym: null, plans: [], members: [], pays: [], checks: []}); }
    render();
  }, () => { Hub.joined = false; render(); }));
}
// The owner's app keeps the gym's trainer list on the gym record, so the front desk can assign trainers
function syncGymTrainers(){
  if (!isOwner() || !Hub.gym) return;
  const tl = Owner.trainers.map(t => ({id: t.id, name: t.name || t.email || "Trainer"})), k = JSON.stringify(tl);
  if (k === JSON.stringify(Hub.gym.trainers || []) || k === Hub.tSync) return;
  Hub.tSync = k; gref().update({trainers: tl}).catch(() => {});
}

/* ---- membership state ---- */
function memState(m){
  if (m.status === "left") return "left";
  if (!m.end) return "none";
  if (m.end < today()) return "expired";
  return daysBetween(today(), m.end) <= 30 ? "ending" : "active";
}
const isOverdue = m => m.status !== "left" && (memState(m) === "expired" || (+m.due || 0) > 0);
const monthlyFee = m => +m.fee && +m.months ? +m.fee / +m.months : 0;
const appMembers = () => Owner.trainers.flatMap(t => (Owner.clients[t.id] || []).map(c => ({...c, _t: t.name || t.email || "Trainer", _tid: t.id})));
const pubFor = m => m && m.uid ? appMembers().find(c => c.id === m.uid) || null : null;
// Activity: from the app (personal risk score) when the member uses it, otherwise from desk check-ins
function memberActivity(m){
  const pub = pubFor(m); if (pub) return {...riskOf(pub), src: "app"};
  if (m.status === "left") return {st: "left", why: "Left the gym"};
  const ref = m.lastVisit || null, since = m.from || m.start || null;
  if (!ref){ const d = since ? daysBetween(since, today()) : 0; return d >= 7 ? {st: "never", why: "No visit recorded yet", src: "desk"} : {st: "never", why: "Just joined", fresh: true, src: "desk"}; }
  const d = daysBetween(ref, today());
  return d > 30 ? {st: "inactive", why: `No visit for ${d} days`, days: d, src: "desk"} : d >= 14 ? {st: "risk", why: `No visit for ${d} days`, days: d, src: "desk"} : {st: "active", why: `Last visit ${shortDate(ref)}`, days: d, src: "desk"};
}
function memPill(m){
  const s = memState(m);
  return s === "left" ? `<span class="pill">Left</span>` : s === "expired" ? `<span class="pill bad">Expired ${shortDate(m.end)}</span>` : s === "ending" ? `<span class="pill warn">Ends ${shortDate(m.end)}</span>` : s === "none" ? `<span class="pill">No plan</span>` : `<span class="pill good">Until ${shortDate(m.end)}</span>`;
}
const duePill = m => +m.due > 0 ? ` <span class="pill warn">Due ${rupee(m.due)}</span>` : "";
const waURL = (phone, text) => { let p = digits(phone); if (p.length === 10) p = "91" + p; return `https://wa.me/${p}?text=${encodeURIComponent(text)}`; };

/* ---- layout ---- */
function gymNav(){

    ? [["owner", "Dashboard", I.chart], ["gmembers", "Members", I.body], ["gcheck", "Check-in", I.check], ["gpay", "Payments", I.note], ["oretention", "Retention", I.squad], ["gsettings", "Settings", I.gear]]
    : [["gcheck", "Check-in", I.check], ["gmembers", "Members", I.body], ["gpay", "Payments", I.note], ["gaccount", "Account", I.gear]];

}

/* ---- front desk: joining a gym ---- */
function viewDeskJoin(){
  if (Hub.joined === null && Hub.gid) return `<div class="empty">Opening your gym…</div>`;
  return `<div><span class="eyebrow">Front desk</span><h1>Join your gym</h1></div>
  <section class="card"><span class="small">Ask the gym owner for the <b>front-desk code</b> (Settings → Front desk in their app), then enter it here.</span>
  ${Hub.gid && Hub.joined === false ? `<div class="banner warn"><div>Your access to ${esc((Cloud.me && Cloud.me.gymName) || "the gym")} was removed by the owner, or hasn't been set up. Enter a new code to join again.</div></div>` : ""}
  <div class="row" style="flex-wrap:nowrap"><input id="desk-code" placeholder="Front-desk code" autocapitalize="characters" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:var(--surface);color:var(--ink)"><button class="btn blue" data-act="desk-join">Join</button></div>
  <button class="btn block" data-act="signout">Sign out</button></section>`;

async function deskJoin(code){
  code = (code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length !== 8) return toast("Front-desk codes are 8 letters and numbers.");
  try {
    const d = await Cloud.db.collection("gymcodes").doc(code).get();
    if (!d.exists || d.data().kind !== "desk") return toast("That isn't a front-desk code. Check it with the gym owner.");
    const gid = d.data().gymId;
    await Cloud.db.collection("gyms").doc(gid).collection("staff").doc(Cloud.user.uid).set({name: Cloud.me.name || "", email: Cloud.user.email || "", code, added: today()});
    await uref().update({gymId: gid, gymCode: code, gymName: d.data().name || "your gym"});
    toast(`Joined ${d.data().name || "the gym"}`);
  } catch(e){ toast("Couldn't join: " + (e.code || "error")); }
}
function viewDeskAccount(){
