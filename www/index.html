/* ---- check-in ---- */
function checkinResults(){
  const q = (S.ui.gq || "").trim().toLowerCase(), qd = digits(q);
  if (!q) return `<div class="empty">Type a member's name or phone number.</div>`;
  if (/^[\d\s+]+$/.test(q) && qd.length < 3) return `<div class="empty">Keep typing: at least 3 digits of the phone number.</div>`;
  const hits = Hub.members.filter(m => m.status !== "left" && ((m.name || "").toLowerCase().includes(q) || (qd.length >= 3 && digits(m.phone).includes(qd)))).slice(0, 8);
  if (!hits.length) return `<div class="empty">No member matches "${esc(S.ui.gq)}". <button class="btn ghost" data-act="g-madd">Add a new member</button></div>`;
  return hits.map(m => { const c = Hub.checks.find(x => x.memberId === m.id && x.date === today());
    return `<div class="row between" style="flex-wrap:nowrap;gap:10px;border-top:1px solid var(--line);padding-top:10px"><div style="min-width:0"><button class="btn ghost" style="padding:0;font-weight:700" data-act="g-mopen" data-id="${m.id}">${esc(m.name)}</button><div class="small muted">${esc(m.phone || "")}${m.planName ? " · " + esc(m.planName) : ""}</div><div style="margin-top:4px">${memPill(m)}${duePill(m)}</div></div>
    <div class="row" style="gap:6px;flex:none">${memState(m) === "expired" ? `<button class="btn" data-act="g-payopen" data-id="${m.id}">Renew</button>` : ""}${c ? `<span class="pill good">✓ In at ${esc(c.time || "")}</span>` : `<button class="btn primary" data-act="g-in" data-id="${m.id}">Check in</button>`}</div></div>`; }).join("");
}
function viewCheckin(){
  const todays = Hub.checks.filter(c => c.date === today()).sort((a, b) => (b.time || "").localeCompare(a.time || ""));
  return `<div class="row between"><div><span class="eyebrow">${esc(dayLabel(today()))} · ${shortDate(today())}</span><h1>Check-in</h1></div><button class="btn blue" data-act="g-madd">Add member</button></div>
  <section class="card"><input id="g-q" value="${esc(S.ui.gq || "")}" placeholder="Search by name or phone" autocomplete="off" style="border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:18px;background:var(--surface);color:var(--ink)"><div id="g-res" style="display:flex;flex-direction:column;gap:10px">${checkinResults()}</div></section>
  <section class="card"><div class="row between"><h3>Today's visits</h3><span class="pill">${todays.length}</span></div>${todays.length ? `<div class="tbl"><table><tr><th>Time</th><th>Member</th><th>Membership</th></tr>${todays.map(c => { const m = Hub.members.find(x => x.id === c.memberId) || {name: c.name}; return `<tr><td class="num">${esc(c.time || "")}</td><td>${esc(m.name || c.name || "")}</td><td>${m.id ? memPill(m) + duePill(m) : ""}</td></tr>`; }).join("")}</table></div>` : `<div class="empty">No one has checked in yet today.</div>`}</section>`;
}
async function checkIn(id){
  const m = Hub.members.find(x => x.id === id); if (!m) return;
  try {
    await gref("checkins").doc(`${id}_${today()}`).set({memberId: id, name: m.name || "", date: today(), time: nowHM(), by: Cloud.user.uid});
    await gref("members").doc(id).update({lastVisit: today()});
  } catch(e){ return toast("Couldn't check in: " + (e.code || "error")); }
  const st = memState(m);
  toast(st === "expired" ? `${firstOf(m.name)} checked in. Membership expired ${shortDate(m.end)}: please renew.` : +m.due > 0 ? `${firstOf(m.name)} checked in. Balance due ${rupee(m.due)}.` : `${firstOf(m.name)} checked in`);
}
const firstOf = n => String(n || "").trim().split(/\s+/)[0] || "Member";

/* ---- members ---- */
const MEM_FILTERS = [["current", "Current"], ["ending", "Ending in 30 days"], ["overdue", "Overdue"], ["left", "Left"], ["all", "All"]];
const memFilter = (f, m) => f === "all" ? true : f === "left" ? m.status === "left" : m.status === "left" ? false : f === "ending" ? memState(m) === "ending" : f === "overdue" ? isOverdue(m) : true;
function memberRows(){

}
function viewMembers(){
  const f = S.ui.gmf || "current";
  let out = `<div class="row between"><div><span class="eyebrow">${esc(gymName())}</span><h1>Members</h1></div><button class="btn blue" data-act="g-madd">Add member</button></div>

function memberSheet(){

    <div class="grid2"><button class="btn primary" data-act="g-payopen" data-id="${id}">Record payment</button>${m.status === "left" ? `<button class="btn" data-act="g-rejoin" data-id="${id}">Rejoined</button>` : `<button class="btn" data-act="g-in" data-id="${id}">Check in</button>`}</div>`;
  h += `<label class="f">Name<input id="gm-name" value="${esc(m.name || "")}" autocomplete="off"></label>
  <div class="grid2"><label class="f">Phone (WhatsApp)<input id="gm-phone" type="tel" inputmode="tel" value="${esc(m.phone || "")}" placeholder="98450 12345"></label><label class="f">Email (optional)<input id="gm-email" type="email" value="${esc(m.email || "")}"></label>

  <button class="btn primary block" data-act="g-msave">${id ? "Save changes" : "Add member"}</button>`;
  if (id){
    if (m.phone) h += `<a class="btn block" href="${esc(waURL(m.phone, `Hi ${firstOf(m.name)}, `))}" target="_blank" rel="noopener">WhatsApp ${esc(firstOf(m.name))}</a>`;

    if (isOwner()) h += `<button class="btn danger block" data-act="g-mdel" data-id="${id}">Delete this member and their records</button>`;
  }
  return h + `<button class="btn block" data-act="sheet-close">Close</button>`;
}
async function saveMember(){
  const id = S.sheet.id, name = val("gm-name");
  if (!name) return toast("Enter the member's name.");
  const phone = val("gm-phone").replace(/[^\d+ ]/g, "").trim().slice(0, 20);
  if (phone && digits(phone).length < 10) return toast("Enter a 10-digit phone number.");
  const dup = phone && Hub.members.find(x => x.id !== id && digits(x.phone).slice(-10) === digits(phone).slice(-10));
  if (dup && !S.sheet.dupOK){ S.sheet.dupOK = true; return toast(`${dup.name} already has this number. Tap again to save anyway.`); }
  const data = clean({name: name.slice(0, 120), phone: phone || null, email: val("gm-email").slice(0, 120) || null, trainerId: val("gm-trainer") || null, start: val("gm-start") || today(), notes: val("gm-notes").slice(0, 300) || null});
  if (document.getElementById("gm-uid")) data.uid = val("gm-uid") || null;

    try {
      await Cloud.db.collection("gymcodes").doc(code).set({gymId: Cloud.user.uid, name: gymName(), kind: "desk"});
      await gref().update({deskCode: code});
      if (old) await Cloud.db.collection("gymcodes").doc(old).delete().catch(() => {});
      return toast("Front-desk code ready");
    } catch(e){}
  }
  toast("Couldn't create a code. Try again.");
}

/* ---- owner dashboard additions ---- */
function revenueAtRisk(){
  const rows = Hub.members.filter(m => m.status !== "left" && memState(m) !== "expired").map(m => ({m, a: memberActivity(m), v: monthlyFee(m)})).filter(x => ["risk", "inactive"].includes(x.a.st) && x.v > 0).sort((a, b) => b.v - a.v);
  return {rows, total: rows.reduce((a, x) => a + x.v, 0)};
}
function actionLists(){
  const apps = appMembers(), recent = c => joinedOf(c) && daysBetween(joinedOf(c), today()) <= 30;
  const needNew = apps.filter(c => !recent(c) && (!c.program || (c.program.weeks && c.program.week > c.program.weeks)));
  const newNo = apps.filter(c => recent(c) && !c.program);
  const overdue = Hub.members.filter(isOverdue), ending = Hub.members.filter(m => m.status !== "left" && memState(m) === "ending");
  return [
    {k: "needprog", t: "Need a new program", d: "Program finished, or no program", list: needNew.map(c => ({n: c.name, s: c.program ? `${c.program.name} finished` : "No program", tr: c._t}))},
    {k: "newnoprog", t: "New, no program yet", d: "Joined in the last 30 days", list: newNo.map(c => ({n: c.name, s: `Joined ${shortDate(joinedOf(c))}`, tr: c._t}))},
    {k: "overdue", t: "Overdue", d: "Membership expired or balance due", list: overdue.map(m => ({n: m.name, s: memState(m) === "expired" ? `Expired ${shortDate(m.end)}${+m.due > 0 ? `, due ${rupee(m.due)}` : ""}` : `Due ${rupee(m.due)}`, tr: trainerName(m.trainerId), id: m.id})), f: "overdue"},
    {k: "ending", t: "Ending in 30 days", d: "Remind them to renew", list: ending.map(m => ({n: m.name, s: `Ends ${shortDate(m.end)}`, tr: trainerName(m.trainerId), id: m.id})), f: "ending"}
  ];
}
function ownerGymCards(){
  const cur = Hub.members.filter(m => m.status !== "left"), active = cur.filter(m => ["active", "ending"].includes(memState(m))).length;
  const got = Hub.pays.filter(p => monthKey(p.date) === monthKey(today())).reduce((a, p) => a + (+p.paid || 0), 0);
  const owed = cur.reduce((a, m) => a + (+m.due || 0), 0), exp = cur.filter(m => memState(m) === "expired").length, rr = revenueAtRisk();
  let out = `<section class="grid3"><div class="stat"><b class="num">${active}</b><span>Paid-up members</span></div><div class="stat"><b class="num">${rupee(got)}</b><span>Received this month</span></div><div class="stat"><b class="num">${rupee(owed)}</b><span>Balance due${exp ? ` · ${exp} expired` : ""}</span></div></section>`;
  out += `<section class="card"><div class="row between"><h3>Revenue at risk</h3><b class="num" style="font-size:22px;color:var(--warn)">${rupee(rr.total)}<span class="small muted"> a month</span></b></div><span class="small muted">Monthly value of paid-up members who are training well below their usual pace or haven't visited in 2 weeks.</span>
  ${rr.rows.length ? `<div class="tbl"><table><tr><th>Member</th><th>Why</th><th>Trainer</th><th>Plan</th><th>A month</th></tr>${rr.rows.slice(0, 8).map(x => `<tr><td><button class="btn ghost" style="padding:0" data-act="g-mopen" data-id="${x.m.id}">${esc(x.m.name)}</button></td><td style="white-space:normal">${esc(x.a.why || "")}</td><td>${esc(trainerName(x.m.trainerId) || "–")}</td><td>${esc(x.m.planName || "")}</td><td class="num">${rupee(x.v)}</td></tr>`).join("")}</table></div>` : `<div class="empty">No paid-up members at risk right now.</div>`}</section>`;
  out += `<section class="card"><h3>To do</h3><div class="grid2" style="align-items:start">${actionLists().map(a => `<div style="border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0"><div class="row between"><b>${esc(a.t)}</b><span class="pill ${a.list.length ? "warn" : ""}">${a.list.length}</span></div><span class="small muted">${esc(a.d)}</span>
    ${a.list.slice(0, 5).map(x => `<div class="small">${x.id ? `<button class="btn ghost" style="padding:0;font-size:inherit" data-act="g-mopen" data-id="${x.id}">${esc(x.n || "Member")}</button>` : `<b>${esc(x.n || "Member")}</b>`} · ${esc(x.s)}${x.tr ? ` <span class="muted">· ${esc(x.tr)}</span>` : ""}</div>`).join("")}${a.list.length > 5 && a.f ? `<button class="btn ghost" style="align-self:flex-start;padding:0" data-act="g-mfgo" data-v="${a.f}">See all ${a.list.length}</button>` : a.list.length > 5 ? `<span class="small muted">and ${a.list.length - 5} more</span>` : ""}</div>`).join("")}</div></section>`;
  return out;
}

/* ---- retention additions: win-back, exit reasons, trainer ranking ---- */
function winBackList(){
  const out = [], seen = new Set();
  Hub.members.forEach(m => {
    const st = memState(m), a = memberActivity(m);
    const lapsed = st === "expired" && daysBetween(m.end, today()) <= 180;
    const leftRecent = m.status === "left" && m.exitReason !== "moved" && m.leftOn && daysBetween(m.leftOn, today()) <= 180;
    const gone = m.status !== "left" && a.st === "inactive";
    if (!(lapsed || leftRecent || gone)) return;
    if (m.uid) seen.add(m.uid);
    out.push({n: m.name, phone: m.phone, tr: trainerName(m.trainerId), why: leftRecent ? `Left ${m.leftOn ? shortDate(m.leftOn) : ""}: ${exitLabel(m.exitReason)}` : lapsed ? `Membership expired ${shortDate(m.end)}` : a.why, id: m.id});
  });
  appMembers().forEach(c => { if (seen.has(c.id) || Hub.members.some(m => m.uid === c.id)) return; const r = riskOf(c); if (r.st === "inactive") out.push({n: c.name, tr: c._t, why: r.why}); });
  return out;
}
function winBackCard(){
  const L = winBackList(), offer = (Hub.gym && Hub.gym.offer) || DEFAULT_OFFER;
  const msg = n => offer.replace(/\{name\}/g, firstOf(n)).replace(/\{gym\}/g, gymName());
  return `<section class="card"><div class="row between"><h3>Win-back list</h3><span class="pill ${L.length ? "warn" : ""}">${L.length}</span></div><span class="small muted">Members who stopped coming, let their membership lapse or left in the last 6 months (not those who moved away). The message is set in Settings.</span>
  ${L.length ? `<div class="tbl"><table><tr><th>Member</th><th>Why</th><th>Trainer</th><th></th></tr>${L.map(x => `<tr><td>${x.id ? `<button class="btn ghost" style="padding:0" data-act="g-mopen" data-id="${x.id}">${esc(x.n || "Member")}</button>` : esc(x.n || "Member")}</td><td style="white-space:normal;min-width:160px">${esc(x.why || "")}</td><td>${esc(x.tr || "–")}</td><td>${x.phone ? `<a class="btn" href="${esc(waURL(x.phone, msg(x.n)))}" target="_blank" rel="noopener">WhatsApp offer</a>` : `<span class="small muted">No phone: add them on Members</span>`}</td></tr>`).join("")}</table></div>` : `<div class="empty">Nobody to win back right now.</div>`}</section>`;
}
function exitReasonsCard(){
  const left = Hub.members.filter(m => m.status === "left" && m.leftOn && daysBetween(m.leftOn, today()) <= 365), n = left.length;
  return `<section class="card"><h3>Why members left</h3><span class="small muted">Reasons recorded when a member is marked as left, last 12 months.</span>
  ${n ? EXIT_WHY.map(([k, l]) => { const c = left.filter(m => (m.exitReason || "other") === k).length; return c ? `<div class="row" style="gap:10px;flex-wrap:nowrap"><span style="width:130px;flex:none" class="small">${esc(l)}</span><div style="flex:1;height:14px;background:var(--sunk);border-radius:7px;overflow:hidden"><i style="display:block;height:100%;width:${Math.round(c / n * 100)}%;background:var(--accent)"></i></div><b class="small num" style="width:70px;text-align:right">${c} · ${Math.round(c / n * 100)}%</b></div>` : ""; }).join("") : `<div class="empty">No one has been marked as left yet.</div>`}</section>`;
}
function trainerRankingCard(){
  const rows = Owner.trainers.map(t => { const cl = Owner.clients[t.id] || [], r = retCells(cl), calls = Owner.calls[t.id] || [];
    const gm = Hub.members.filter(m => m.trainerId === t.id), months = gm.filter(m => m.start).map(m => daysBetween(m.start, m.status === "left" && m.leftOn ? m.leftOn : today()) / 30.4);
    return {t, n: cl.length, r, risk: cl.filter(c => ["risk", "inactive"].includes(riskOf(c).st)).length, calls, avg: months.length ? months.reduce((a, b) => a + b, 0) / months.length : null}; })
    .sort((a, b) => ((b.r[1] || {}).p ?? -1) - ((a.r[1] || {}).p ?? -1) || ((b.r[0] || {}).p ?? -1) - ((a.r[0] || {}).p ?? -1) || (b.avg || 0) - (a.avg || 0));
  return `<section class="card"><h3>Trainer ranking</h3><span class="small muted">Ranked by how many clients are still training at 90 days, then 30 days. Follow-ups are from each trainer's weekly call list (last 8 weeks).</span>
  <div class="tbl"><table><tr><th>#</th><th>Trainer</th><th>Clients</th><th>30 days</th><th>90 days</th><th>180 days</th><th>Avg. membership</th><th>At risk</th><th>Follow-ups</th><th>Back training</th><th>Lost</th></tr>
  ${rows.map((x, i) => `<tr><td><b>${i + 1}</b></td><td>${esc(x.t.name || x.t.email)}</td><td>${x.n}</td>${x.r.map(c => `<td>${retCell(c)}</td>`).join("")}<td>${x.avg != null ? fmt(x.avg, 1) + " mo" : "–"}</td><td>${x.risk}</td><td>${x.calls.length}</td><td>${x.calls.filter(c => c.outcome === "back").length}</td><td>${x.calls.filter(c => c.outcome === "lost").length}</td></tr>`).join("") || `<tr><td colspan="11" class="muted">No trainers yet.</td></tr>`}</table></div></section>`;
}

/* ============ Start over ============ */
// Starting over clears the log but keeps your consent, date of birth, location and units.
function keepOnReset(){ const s = set_(); return clean({consent: s.consent || null, loc: s.loc || null, units: s.units || null, unitsManual: s.unitsManual || null, intake: s.intake && s.intake.dob ? {dob: s.intake.dob} : null}); }
async function resetAccount(){
  toast("Deleting your data…");
  try {
    if (isCloudClient()){
      for (const c of COLS){
        const q = await uref().collection(c).get();
        await Promise.all(q.docs.map(d => uref().collection(c).doc(d.id).delete()));
      }
      const fresh = defaultsFor(false); Object.assign(fresh.settings, keepOnReset());
      await uref().update({program: clean(fresh.program), settings: clean(fresh.settings), trainerId: null, trainerCode: null, trainerName: null});
    }
    await Store.clearAll();
    clearDraft(); S.timer = null;
    S.data = emptyData();
    const keep = keepOnReset();
    S.profile = defaultsFor(false); Object.assign(S.profile.settings, keep);
    if (!isCloudClient()) await Store.saveProfile(S.profile);
    S.ob = null; S.obOffered = false; S.view = "today"; S.sub = null;
    toast("Done — you're starting fresh");
  } catch(e){ console.warn(e); toast("Couldn't finish deleting: " + (e.code || e.message || "error") + ". Try again."); }
}

/* ============ Boot ============ */
async function boot(){
  render();
  await Store.open();
  const {data, profile} = await Store.loadAll();
  S.data = data;
  if (profile) S.profile = profile;
  else {
    let owner = false;
    try { const u = window.claude ? await Promise.race([window.claude.use("user"), new Promise(r => setTimeout(() => r(null), 3000))]) : null; owner = u ? !!u.isOwner() : false; } catch(e){}
    S.profile = defaultsFor(owner);
    await Store.saveProfile(S.profile).catch(()=>{});
  }
  try { const d = JSON.parse(localStorage.getItem("sl-draft") || "null"); if (d && d.exercises) S.draft = d; } catch(e){}
  S.ready = true; S.forceRender = true; render();
  cloudInit();
  if (Store.mode === "memory") toast("This browser is blocking storage. Save a backup before closing.");
}
nativeSetup();
boot();
</script>
