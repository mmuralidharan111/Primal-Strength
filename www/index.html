<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1215">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>12-Week Strength Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — sticky header, scrolling view, fixed bottom tab bar; Trainerize-style logging rows */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --sunk:#EEF0EC; --ink:#15181C; --muted:#5F6772; --line:#DADDD7;
  --accent:#1F5BB8; --accent-soft:#E4ECF8; --cta:#F5C518; --cta-ink:#1A1600;
  --good:#2D7A4C; --good-soft:#E2F1E7; --warn:#A8670F; --warn-soft:#FBF0DC; --bad:#B42318; --bad-soft:#FBE6E3;
  --chart-2:#C2410C;
  --f-display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1215; --surface:#171B20; --sunk:#1E242A; --ink:#E8EBEE; --muted:#9AA3AD; --line:#2A3139;
  --accent:#6A9BEA; --accent-soft:#1B2A40; --cta:#F2C744; --cta-ink:#1A1600;
  --good:#5BC28A; --good-soft:#15291E; --warn:#E3A945; --warn-soft:#2E2412; --bad:#F07167; --bad-soft:#341A18;
  --chart-2:#F0965A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1215; --surface:#171B20; --sunk:#1E242A; --ink:#E8EBEE; --muted:#9AA3AD; --line:#2A3139;
  --accent:#6A9BEA; --accent-soft:#1B2A40; --cta:#F2C744; --cta-ink:#1A1600;
  --good:#5BC28A; --good-soft:#15291E; --warn:#E3A945; --warn-soft:#2E2412; --bad:#F07167; --bad-soft:#341A18;
  --chart-2:#F0965A; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--f-display);font-size:20px;letter-spacing:.2px;line-height:1.1}
.brand span{font-size:13px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:14px;padding-block:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.2px}
h1{font-size:30px;line-height:1.05}
h2{font-size:22px}
h3{font-size:18px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--sunk);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--cta);color:var(--cta-ink);border-color:transparent;font-size:18px;padding:14px 24px;font-family:var(--f-display);letter-spacing:.3px}
.btn.blue{background:var(--accent);color:#fff;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:6px}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:.02em}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.banner.bad{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.banner.info{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.banner b{font-weight:700}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);width:100%;font-weight:400}
textarea{resize:vertical;min-height:64px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{min-width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
/* workout list + overview */
.wcard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.dayblock{width:54px;height:54px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-size:28px;flex:none}
.dayblock.sm{width:44px;height:44px;font-size:16px;border-radius:10px;background:var(--sunk);color:var(--ink)}
.exlist{display:flex;flex-direction:column}
.exitem{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.exitem:first-child{border-top:0}
.exitem b{display:block;font-size:17px}
.metaline{display:flex;flex-direction:column;gap:6px;font-size:16px}
.metaline div{display:flex;gap:10px;align-items:center}
.metaline svg{width:20px;height:20px;flex:none}
.equip{display:flex;gap:8px;flex-wrap:wrap}
.equip span{background:var(--sunk);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600}
.sticky-cta{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:5}
.sticky-cta .btn{pointer-events:auto;min-width:220px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.group-head{background:var(--sunk);margin-inline:-16px;padding:10px 16px;font-weight:700}
/* logging */
.logbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.logbar .wrap{display:flex;align-items:center;gap:8px;padding-block:8px}
.logbar .title{flex:1;min-width:0}
.logbar .title b{font-family:var(--f-display);font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logbar .title span{font-size:13px;color:var(--muted)}
.savebtn{font-family:var(--f-display);font-size:20px;font-weight:700;background:none;border:0;padding:6px 8px}
.excard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}
.excard.done{border-left-color:var(--good)}
.exhead{display:flex;gap:10px;align-items:flex-start}
.exhead .nm{flex:1;min-width:0}
.exhead .nm b{font-size:19px;display:block;line-height:1.2}
.exhead .nm span{font-size:14px;color:var(--muted)}
.exhead .iconbtn{width:38px;height:38px;color:var(--accent);border-color:transparent;background:var(--accent-soft)}
.restchip{display:flex;align-items:center;justify-content:space-between;background:var(--sunk);border-radius:999px;padding:6px 6px 6px 14px;color:var(--accent);font-size:14px;font-weight:600}
.restchip button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;color:var(--accent);font-weight:700;display:flex;gap:6px;align-items:center}
.sets{display:grid;grid-template-columns:44px minmax(0,1fr) 72px 72px 44px;gap:8px 8px;align-items:center}
.sets .h{font-weight:700;font-size:14px}
.sets .lbl{font-weight:600;font-size:15px}
.sets .prev{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.sets input:disabled{background:var(--sunk);color:var(--muted)}
.tick{width:44px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.tick svg{width:20px;height:20px}
.tick.on{background:var(--good);border-color:var(--good);color:#fff}
.setrow-done input{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.hint{font-size:14px;border-radius:10px;padding:8px 10px;background:var(--good-soft);color:var(--good);font-weight:600}
.cue{font-size:14px;color:var(--muted)}
.toggle{width:50px;height:30px;border-radius:999px;background:var(--line);border:0;position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:23px}
/* timer */
.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:24;pointer-events:none}
.timer .wrap{pointer-events:auto}
.timer .box{background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer .box b{font-family:var(--f-display);font-size:30px;min-width:76px;font-variant-numeric:tabular-nums}
.timer .box .bar{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.timer .box .bar i{display:block;height:100%;background:var(--cta)}
.timer .box button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:999px;padding:6px 10px;font-weight:700;font-size:14px}
.timer.ring .box{background:var(--cta);color:var(--cta-ink)}
.timer.ring .box button{color:var(--cta-ink);border-color:var(--cta-ink)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:50;font-size:15px;max-width:calc(100% - 32px)}
/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.strip div{background:var(--sunk);border-radius:10px;padding:6px 2px;text-align:center;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:0}
.strip div b{font-size:15px;color:var(--ink);font-family:var(--f-display)}
.strip div.today{outline:2px solid var(--accent)}
.strip div.lift b{color:var(--accent)}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
/* tables + charts */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
svg.chart{width:100%;height:auto;display:block}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
svg.chart .s1{stroke:var(--accent);fill:none;stroke-width:2.5}
svg.chart .s1a{fill:var(--accent);opacity:.12}
svg.chart .d1{fill:var(--accent)}
svg.chart .s2{stroke:var(--chart-2);fill:none;stroke-width:2;stroke-dasharray:5 4}
svg.chart .d2{fill:var(--chart-2)}
svg.chart .lab{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--f-body)}
svg.chart .bar{fill:var(--accent)}
svg.chart .bar.low{fill:color-mix(in srgb,var(--accent) 45%,var(--sunk))}
svg.chart .plan{stroke:var(--ink);stroke-width:2}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px;background:var(--accent)}
.legend i.b{background:var(--chart-2)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:14px}
.thumb{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.histitem{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.histitem:first-of-type{border-top:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.sets{grid-template-columns:34px minmax(0,1fr) 62px 62px 40px;gap:6px}.grid3{grid-template-columns:1fr 1fr}}
</style>

<div id="app"></div>

<script>
"use strict";
/* ============ Program ============ */
const SIDE_L = "Left hand", SIDE_R = "Right hand";
function baseProgram(){
  return {
    name: "3-Day Strength Block",
    days: [
      {id:"A", title:"Squat + horizontal push/pull", dow:1, equip:["Barbell","Dumbbell","Cable"], ex:[
        {n:"Zercher squat", sets:3, reps:"6–8", rest:150, type:"load", main:true, alts:["Goblet squat","Belt squat"], cue:"Unrack from pins at mid-thigh. Go only as deep as you can without your lower back rounding."},
        {n:"DB bench press", sets:3, reps:"8–10", rest:120, type:"load", alts:["Barbell bench in a rack","Machine chest press"]},
        {n:"Chest-supported DB row", sets:3, reps:"8–10", rest:90, type:"load", alts:["Seated cable row"]},
        {n:"Cable pull-through", sets:3, reps:"12", rest:90, type:"load", alts:["Glute bridge","45° hip extension"], cue:"Hinge at the hips; keep the spine neutral."},
        {n:"Suitcase carry", sets:3, reps:"30", rest:60, type:"carry", side:{order:["L","R"], extra:"L", names:{L:SIDE_L,R:SIDE_R}}, cueMe:"Weight in your left hand loads the right side of your trunk — that side gets the extra set."},
        {n:"Side plank", sets:3, reps:"30–45", rest:30, type:"time", side:{order:["R","L"], extra:"R", names:{R:"Right side down",L:"Left side down"}}}
      ]},
      {id:"B", title:"Hinge + vertical push/pull", dow:3, equip:["Trap bar","Dumbbell","Cable"], ex:[
        {n:"Trap-bar deadlift (high handles)", sets:3, reps:"6", rest:180, type:"load", main:true, alts:["Kettlebell deadlift from a step","Cable pull-through"], cue:"High handles. Brace before every rep; no grinding reps."},
        {n:"Seated DB overhead press", sets:3, reps:"8–10", rest:120, type:"load", alts:["Landmine press"]},
        {n:"Lat pulldown", sets:3, reps:"8–12", rest:90, type:"load", alts:["Assisted pull-up","Single-arm cable pulldown"]},
        {n:"Bulgarian split squat", sets:3, reps:"8", rest:90, type:"load", each:true, alts:["Reverse lunge"], cue:"Right leg first; match the left to it."},
        {n:"Pallof press", sets:3, reps:"10", rest:45, type:"load", side:{order:["R","L"], extra:"R", names:{R:"Right side",L:"Left side"}}, alts:["Band Pallof press"]},
        {n:"Farmer carry", sets:3, reps:"40", rest:60, type:"carry"}
      ]},
      {id:"C", title:"Single-leg + hypertrophy", dow:5, equip:["Machines","Dumbbell","Cable"], ex:[
        {n:"Leg press", sets:3, reps:"10–12", rest:120, type:"load", main:true, alts:["Hack squat","Goblet squat"], cue:"Stop before your lower back lifts off the pad."},
        {n:"Incline DB press", sets:3, reps:"10–12", rest:90, type:"load", alts:["Incline machine press"]},
        {n:"Single-arm DB row", sets:3, reps:"10", rest:60, type:"load", each:true, alts:["Single-arm cable row"], cue:"Right arm first."},
        {n:"Hip thrust", sets:3, reps:"10", rest:90, type:"load", alts:["Glute bridge","45° hip extension"]},
        {n:"Lateral raise", sets:2, reps:"12–15", rest:0, type:"load", group:"Superset · 2 rounds"},
        {n:"DB curl", sets:2, reps:"12–15", rest:0, type:"load", group:"Superset · 2 rounds"},
        {n:"Cable triceps pushdown", sets:2, reps:"12–15", rest:60, type:"load", group:"Superset · 2 rounds"},
        {n:"Single-arm overhead carry", sets:3, reps:"20", rest:60, type:"carry", side:{order:["R","L"], extra:"R", names:{R:"Right arm",L:"Left arm"}}},
        {n:"Dead bug", sets:3, reps:"8", rest:30, type:"bw", each:true}
      ]}
    ]
  };
}
function personalProgram(){
  const p = baseProgram(); p.kind = "personal";
  p.notes = ["Back rules (disc-friendly): no loaded spinal flexion, brace every rep, swap Zercher for goblet squat on irritated days.",
             "If next-morning back pain is 2+ points above your normal, cut that week's lower-body loads by 20%.",
             "Start lifting at least 60 minutes after waking."];
  return p;
}
function standardProgram(){
  const p = baseProgram(); p.kind = "standard";
  p.days.forEach(d => d.ex.forEach(e => { if (e.side) e.side.extra = null; delete e.cueMe; }));
  p.notes = ["Leave 2–3 reps in the tank on the big lifts. Add load once every set hits the top of the rep range."];
  return p;
}

/* ============ Block structure ============ */
function phaseOf(w){
  if (w < 1) return {name:"Not started", short:"Pre-block"};
  if (w <= 5) return {name:"Build", short:"Build"};
  if (w === 6) return {name:"Deload", short:"Deload"};
  if (w <= 11) return {name:"Push", short:"Push"};
  if (w === 12) return {name:"Deload + retest", short:"Deload"};
  return {name:"Block complete", short:"Done"};
}
const isDeload = w => w === 6 || w === 12;
function rirFor(ex, w){
  if (ex.type !== "load") return null;
  if (isDeload(w)) return 4;
  if (w <= 2) return 3;
  if (w <= 5) return 2;
  if (ex.main) return 2;
  return w <= 9 ? 2 : 1;
}
function setLabels(ex, idx, w){
  if (ex.side){
    const [a,b] = ex.side.order; const out = [];
    for (const s of [a,b]){
      let n = isDeload(w) ? 2 : ex.sets + (ex.side.extra === s ? 1 : 0);
      for (let i=1;i<=n;i++) out.push(s + i);
    }

function niceTicks(min, max, n=4){
  if (min === max){ min -= 1; max += 1; }
  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1,2,2.5,5,10].map(m => m*mag).find(s => s >= step0) || 10*mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step; const t = [];
  for (let v = lo; v <= hi + step/2; v += step) t.push(+v.toFixed(6));
  return t;
}
function lineChart(series, {unit="", h=180, dec=1} = {}){
  const all = series.flatMap(s => s.pts); if (!all.length) return "";
  const W = 340, L = 38, R = 14, T = 14, B = 26;
  const xs = all.map(p => parse(p.x).getTime()); let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1){ x0 -= 86400000*3; x1 += 86400000*3; }
  const ys = all.map(p => p.y); const ticks = niceTicks(Math.min(...ys), Math.max(...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length-1];
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0)/(y1 - y0)) * (h - T - B);
  let g = ticks.map(t => `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axis" x="${L-6}" y="${Y(t)+4}" text-anchor="end">${fmt(t,dec)}</text>`).join("");
  g += `<text class="axis" x="${L}" y="${h-6}">${shortDate(ymd(new Date(x0)))}</text><text class="axis" x="${W-R}" y="${h-6}" text-anchor="end">${shortDate(ymd(new Date(x1)))}</text>`;
  series.forEach((s, si) => {
    const pts = [...s.pts].sort((a,b) => a.x.localeCompare(b.x));
    const d = pts.map((p,i) => `${i?"L":"M"}${X(parse(p.x).getTime()).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
    if (si === 0 && pts.length > 1) g += `<path class="s1a" d="${d}L${X(parse(pts[pts.length-1].x).getTime())},${Y(y0)}L${X(parse(pts[0].x).getTime())},${Y(y0)}Z"/>`;
    g += `<path class="${si ? "s2" : "s1"}" d="${d}"/>`;
    pts.forEach((p,i) => { const last = i === pts.length-1; g += `<circle class="${si?"d2":"d1"}" cx="${X(parse(p.x).getTime())}" cy="${Y(p.y)}" r="${last?4.5:3}"/>`; });
    if (si === 0){ const p = pts[pts.length-1]; const x = X(parse(p.x).getTime()); g += `<text class="lab" x="${Math.min(x, W-R)}" y="${Y(p.y)-9}" text-anchor="${x > W-60 ? "end" : "middle"}">${fmt(p.y,dec)}${unit}</text>`; }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`;
}
function barChart(rows, {h=170} = {}){
  if (!rows.length) return "";
  const W = 340, L = 38, R = 10, T = 14, B = 24;
  const max = Math.max(...rows.map(r => Math.max(r.v, r.plan||0)), 10); const ticks = niceTicks(0, max); const y1 = ticks[ticks.length-1];
  const bw = (W - L - R) / rows.length;

  rows.forEach((r,i) => {

    if (r.plan) g += `<line class="plan" x1="${x-2}" x2="${x+w+2}" y1="${Y(r.plan)}" y2="${Y(r.plan)}"/>`;

  // cardio weekly
  const cw = Math.min(12, Math.max(1, weekOf(today())));
  const rows = []; for (let w = Math.max(1, cw-7); w <= cw; w++){ const st = weekStats(w); rows.push({label:"W"+w, v:st.cardio, plan:st.plan}); }
  out += `<section class="card"><h3>Cardio minutes per week</h3>${barChart(rows)}<div class="legend"><span><i></i>Logged</span><span><i style="background:var(--ink);height:2px"></i>Plan</span></div></section>`;
  // weekly table
  const wrows = []; for (let w = 1; w <= cw; w++){ const st = weekStats(w); const bodyW = S.data.body.filter(b => b.date >= st.start && b.date <= st.end && b.waist).sort(byDateDesc)[0]; wrows.push(`<tr><td>W${w}</td><td>${st.sessions.length}/${prog().days.length}</td><td>${st.cardio}/${st.plan}</td>${set_().trackBack?`<td>${st.pain!=null?fmt(st.pain):"–"}</td>`:""}<td>${bodyW?fmt(bodyW.waist):"–"}</td></tr>`); }
  out += `<section class="card"><h3>Week by week</h3><div class="tbl"><table><tr><th>Week</th><th>Lifts</th><th>Cardio min</th>${set_().trackBack?"<th>Back avg</th>":""}<th>Waist</th></tr>${wrows.reverse().join("")}</table></div></section>`;
  // DEXA trends
  const dx = S.data.dexa.filter(d => d.date).sort((a,b)=>a.date.localeCompare(b.date));
  if (dx.length > 1){
    out += `<section class="card"><h3>DEXA trends</h3>`;
    [["lean","Lean mass"," kg",1],["fat","Fat mass"," kg",1],["vat","Visceral fat"," g",0],["android","Android fat","%",1]].forEach(([k,l,u,d]) => {
      const pts = dx.filter(r => r[k] != null && r[k] !== "").map(r => ({x:r.date, y:+r[k]}));
      if (pts.length > 1) out += `<b class="small">${l}</b>${lineChart([{pts}], {unit:u, h:150, dec:d})}`;
    });
    out += `</section>`;
  }
  // PRs
  const prs = {};
  S.data.sessions.forEach(s => s.exercises.forEach(e => { const t = topSet(e); if (t && e.type === "load"){ const v = e1rm(+t.kg, +t.reps) || +t.kg; if (!prs[e.performedAs] || v > prs[e.performedAs].v) prs[e.performedAs] = {v, t, date:s.date}; } }));
  const pk = Object.keys(prs);
  if (pk.length) out += `<section class="card"><h3>Best sets</h3><div class="tbl"><table><tr><th>Exercise</th><th>Set</th><th>Est. 1RM</th><th>Date</th></tr>${pk.map(n => `<tr><td>${esc(n)}</td><td>${prs[n].t.kg} × ${prs[n].t.reps}</td><td>${fmt(prs[n].v)}</td><td>${shortDate(prs[n].date)}</td></tr>`).join("")}</table></div></section>`;
  out += `<button class="btn blue block" data-act="export-json">Export for Claude review</button>`;
  return out;
}

function timerHTML(){
  if (!S.timer) return "";
  const left = Math.max(0, Math.ceil((S.timer.end - Date.now())/1000));
  const pct = S.timer.total ? (1 - left / S.timer.total) * 100 : 100;
  return `<div class="timer ${left===0?"ring":""}" id="timer" ${S.view==="log" ? 'style="bottom:calc(16px + env(safe-area-inset-bottom,0px))"' : ""}><div class="wrap"><div class="box">
  <b id="t-left">${Math.floor(left/60)}:${pad(left%60)}</b><div class="bar"><i id="t-bar" style="width:${pct}%"></i></div>
  <button data-act="t-add">+15s</button><button data-act="t-stop">${left===0?"Done":"Skip"}</button></div></div></div>`;
}
let timerTick = null;
function startTimer(sec){
  if (!sec) return;
  S.timer = {end: Date.now() + sec*1000, total: sec, rang:false};
  if (!timerTick) timerTick = setInterval(updateTimer, 250);
  const old = document.getElementById("timer"); if (old) old.remove();
  app.insertAdjacentHTML("beforeend", timerHTML());
}
function updateTimer(){
  if (!S.timer){ clearInterval(timerTick); timerTick = null; return; }
  const left = Math.max(0, Math.ceil((S.timer.end - Date.now())/1000));
  const el = document.getElementById("t-left"), bar = document.getElementById("t-bar"), box = document.getElementById("timer");
  if (el) el.textContent = `${Math.floor(left/60)}:${pad(left%60)}`;
  if (bar) bar.style.width = (1 - left / S.timer.total) * 100 + "%";
  if (left === 0 && !S.timer.rang){
    S.timer.rang = true; if (box){ box.classList.add("ring"); const b = box.querySelector('[data-act="t-stop"]'); if (b) b.textContent = "Done"; }
    try { if (NATIVE && NATIVE.Plugins && NATIVE.Plugins.Haptics) NATIVE.Plugins.Haptics.vibrate({duration:600}); else if (navigator.vibrate) navigator.vibrate([200,100,200]); } catch(e){}
  }
  const em = document.getElementById("elapsed");
  if (em && S.draft) em.textContent = `${Math.max(0, Math.round((Date.now() - S.draft.startedAt)/60000))} min · week ${S.draft.week}`;
}

const numOrNull = v => v === "" || v == null || isNaN(+v) ? null : +v;

async function saveRec(col, rec){
  const arr = S.data[col]; const i = arr.findIndex(r => r.id === rec.id);
  if (i >= 0) arr[i] = rec; else arr.push(rec);
  try { await Store.put({...rec, col}); } catch(e){ toast("Couldn't save on this device."); throw e; }
}
async function delRec(col, id){
  const rec = S.data[col].find(r => r.id === id);
  S.data[col] = S.data[col].filter(r => r.id !== id);
  try { await Store.del(id); if (rec && rec.fileId) await Store.delFile(rec.fileId); } catch(e){ toast("Couldn't delete on this device."); }
}
let wakeLock = null;
async function keepAwake(on){
  try { if (on && navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request("screen"); else if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; } } catch(e){ wakeLock = null; }
}
function goLog(){ S.view = "log"; S.forceRender = true; render(); window.scrollTo(0,0); keepAwake(true); }

async function finishWorkout(){
  const D = S.draft;
  const any = D.exercises.some(x => x.sets.some(s => s.done || s.reps !== "" || s.kg !== ""));
  if (!any){ toast("Log at least one set before saving."); return; }
  const session = { id: D.id, date: D.date, ts: String(D.startedAt), week: D.week, day: D.day, title: D.title,
    durationMin: Math.round((Date.now() - D.startedAt)/60000), backPain: D.backPain, notes: D.notes, pre: D.pre,
    exercises: D.exercises.map(x => ({ base:x.base, performedAs:x.performedAs, type:x.type, note:x.note,
      sets: x.sets.map(s => ({label:s.label, reps:s.reps, kg:s.kg, done: s.done || (s.reps !== "")})) })) };
  try { await saveRec("sessions", session); } catch(e){ return; }
  clearDraft(); S.timer = null; keepAwake(false);
  const sets = session.exercises.reduce((a,e)=>a + e.sets.filter(s=>s.done).length, 0);
  S.view = "workouts"; S.sub = null; S.forceRender = true; render(); window.scrollTo(0,0);

let downloadsNS;
const NATIVE = (() => { try { return window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() ? window.Capacitor : null; } catch(e){ return null; } })();
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
async function saveFile(filename, data, title){
  if (NATIVE && NATIVE.Plugins && NATIVE.Plugins.Filesystem && NATIVE.Plugins.Share){
    try {
      const opts = {path: filename.replace(/[^\w.\-]+/g, "_"), directory: "CACHE"};
      if (typeof data === "string"){ opts.data = data; opts.encoding = "utf8"; } else opts.data = await blobToB64(data);
      const r = await NATIVE.Plugins.Filesystem.writeFile(opts);
      await NATIVE.Plugins.Share.share({title, files:[r.uri], dialogTitle: title});
      return true;
    } catch(e){
      if (/cancel/i.test(String(e && (e.message || e)))) return false;
      if (typeof data === "string"){ openSheet({kind:"text", title, text:data}); } else toast("Couldn't share the file.");
      return false;
    }
  }
  try {
    if (downloadsNS === undefined) downloadsNS = window.claude ? await window.claude.use("downloads") : null;
  } catch(e){ downloadsNS = null; }
  if (!downloadsNS){ if (typeof data === "string"){ openSheet({kind:"text", title, text:data}); } else toast("Saving files isn't available here."); return false; }
  try { await downloadsNS.save({filename, data}); toast("Saved"); return true; }
  catch(e){
    if (e && e.code === "declined") return false;
    if (e && e.code === "rate_limited"){ toast("A save is already open. Try again in a moment."); return false; }
    if (typeof data === "string") openSheet({kind:"text", title, text:data}); else toast("Couldn't save the file here.");
    return false;
  }
}
async function restore(file){
  try {
    const j = JSON.parse(await file.text());
    if (!j || !Array.isArray(j.sessions)) throw new Error("bad");
    S.sheet = {kind:"confirm", title:"Restore this backup?", text:`It holds ${j.sessions.length} workouts, ${ (j.cardio||[]).length } cardio sessions and ${(j.body||[]).length} check-ins from ${j.exportedAt ? j.exportedAt.slice(0,10) : "an earlier date"}. It replaces what's on this device now. Report files aren't included in backups.`, yes:"Replace and restore", danger:true, run: async () => {
      await Store.clearRecords();
      for (const c of COLS){ S.data[c] = (j[c] || []).map(r => ({...r, fileId: c === "dexa" ? null : r.fileId})); for (const r of S.data[c]) await Store.put({...r, col:c}); }
      if (Store.mode === "local") Store._local();
      if (j.program) S.profile.program = j.program; if (j.settings) S.profile.settings = {...S.profile.settings, ...j.settings};
      await Store.saveProfile(S.profile); toast("Backup restored");
    }};
    S.forceRender = true; render();
  } catch(e){ toast("That file isn't a Strength Log backup."); }
}

    const x = S.draft.exercises[+t.dataset.x], s = x.sets[+t.dataset.s];
    if (!s.done){
      const r = document.getElementById(`r-${t.dataset.x}-${t.dataset.s}`), k = document.getElementById(`k-${t.dataset.x}-${t.dataset.s}`);
      if (s.reps === "" && r && r.placeholder){ s.reps = r.placeholder; r.value = s.reps; }
      if (s.kg === "" && k && k.placeholder && !k.disabled){ s.kg = k.placeholder; k.value = s.kg; }
      s.done = true; startTimer(x.rest || 0);
    } else s.done = false;
    t.classList.toggle("on", s.done); t.setAttribute("aria-pressed", s.done);
    const card = document.getElementById("ex-" + t.dataset.x); if (card) card.classList.toggle("done", x.sets.every(z => z.done));
    saveDraft(); return;
  }
  if (a === "addset"){ const x = S.draft.exercises[+t.dataset.x]; const last = x.sets[x.sets.length-1]; const lab = /^[LR]\d+$/.test(last.label) ? last.label[0] + (+last.label.slice(1) + 1) : String(x.sets.length + 1); x.sets.push({label:lab, reps:"", kg:"", done:false}); saveDraft(); return rerenderLogKeepScroll(); }
  if (a === "rmset"){ const x = S.draft.exercises[+t.dataset.x]; x.sets.pop(); saveDraft(); return rerenderLogKeepScroll(); }
  if (a === "restcycle"){ const x = S.draft.exercises[+t.dataset.x]; const steps = [30,45,60,90,120,150,180,240]; const i = steps.indexOf(x.rest); x.rest = steps[(i+1) % steps.length]; saveDraft(); return rerenderLogKeepScroll(); }
  if (a === "swap") return openSheet({kind:"swap", x:+t.dataset.x});
  if (a === "swap-pick" || a === "swap-custom"){
    const v = a === "swap-pick" ? t.dataset.v : val("swap-custom"); if (!v) return toast("Type an exercise name first.");
    const x = S.draft.exercises[S.sheet.x]; x.performedAs = v; x.sets.forEach(s => { if (!s.done){ s.reps = ""; s.kg = ""; } });
    if (S.ui.autofill) applyAutofill(); saveDraft(); S.sheet = null; return rerenderLogKeepScroll();
  }
  if (a === "exinfo") return openSheet({kind:"exinfo", x:+t.dataset.x});
  if (a === "exnote-save"){ S.draft.exercises[S.sheet.x].note = val("ex-note"); saveDraft(); S.sheet = null; return rerenderLogKeepScroll(); }
  if (a === "lognote") return openSheet({kind:"lognote"});
  if (a === "lognote-save"){ S.draft.notes = val("ln-text"); saveDraft(); S.sheet = null; return rerenderLogKeepScroll(); }
  if (a === "timer-open") return openSheet({kind:"timer"});
  if (a === "t-start"){ S.sheet = null; S.forceRender = true; render(); return startTimer(+t.dataset.v); }
  if (a === "t-add"){ if (S.timer){ S.timer.end += 15000; S.timer.total += 15; S.timer.rang = false; const box = document.getElementById("timer"); if (box) box.classList.remove("ring"); } return; }
  if (a === "t-stop"){ S.timer = null; const el = document.getElementById("timer"); if (el) el.remove(); return; }
  if (a === "pain"){ S.draft.backPain = +t.dataset.v; t.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === t)); saveDraft(); return; }
  if (a === "finish") return finishWorkout();
  if (a === "discard"){ S.sheet = {kind:"confirm", title:"Discard this workout?", text:"Nothing from this session will be saved.", yes:"Discard workout", danger:true, run: () => { clearDraft(); S.timer = null; keepAwake(false); S.view = "workouts"; S.sub = null; }}; S.forceRender = true; return render(); }
  if (a === "confirm-yes"){ const run = S.sheet.run; S.sheet = null; if (run) await run(); S.forceRender = true; render(); return; }
  if (a === "sheet-close") return closeSheet();
  if (a === "viewsession") return openSheet({kind:"session", id:t.dataset.id});
  if (a === "ask-del-session"){ const id = t.dataset.id; S.sheet = {kind:"confirm", title:"Delete this workout?", text:"It will be removed from your history and graphs.", yes:"Delete workout", danger:true, run: () => delRec("sessions", id)}; S.forceRender = true; return render(); }
  if (a === "del"){ const col = t.dataset.col, id = t.dataset.id; S.sheet = {kind:"confirm", title:"Delete this entry?", text:"This can't be undone.", yes:"Delete", danger:true, run: () => delRec(col, id)}; S.forceRender = true; return render(); }
  if (a === "dexa-new") return openSheet({kind:"dexa", id:null});
  if (a === "dexa-edit") return openSheet({kind:"dexa", id:t.dataset.id});
  if (a === "dexa-save") return saveDexa();
  if (a === "ask-del-dexa"){ const id = t.dataset.id; S.sheet = {kind:"confirm", title:"Delete this scan?", text:"Its numbers and attached report will be removed.", yes:"Delete scan", danger:true, run: () => delRec("dexa", id)}; S.forceRender = true; return render(); }
  if (a === "dexa-file"){
    const d = S.data.dexa.find(x => x.id === t.dataset.id); if (!d) return;
    const blob = await Store.getFile(d.fileId).catch(() => null); if (!blob) return toast("The report file isn't on this device.");
    return openSheet({kind:"file", name:d.fileName, isImg:/^image\//.test(blob.type), url:URL.createObjectURL(blob), blob});
  }
  if (a === "file-save"){ return saveFile(S.sheet.name || "dexa-report", S.sheet.blob, "Report"); }
  if (a === "pick-lift"){ S.ui.lift = t.dataset.v; S.forceRender = true; return render(); }
  if (a === "pick-metric"){ S.ui.metric = t.dataset.v; S.forceRender = true; return render(); }
  if (a === "s-back"){ S.sheet.back = !S.sheet.back; t.classList.toggle("on", S.sheet.back); t.setAttribute("aria-pressed", S.sheet.back); return; }
  if (a === "settings-save"){
    const s = S.profile.settings; const sd = val("s-start");
    if (sd) s.startDate = mondayOf(sd);
    s.zoneLow = numOrNull(val("s-zl")); s.zoneHigh = numOrNull(val("s-zh")); s.dexaWeeks = numOrNull(val("s-dexa")) || 12; s.backNormal = numOrNull(val("s-bn")); s.trackBack = !!S.sheet.back;
    await Store.saveProfile(S.profile); S.sheet = null; S.forceRender = true; render(); return toast(sd && sd !== s.startDate ? `Saved — block starts Monday ${shortDate(s.startDate)}` : "Settings saved");
  }
  if (a === "ask-prog"){ const v = t.dataset.v; S.sheet = {kind:"confirm", title: v === "personal" ? "Switch to back-friendly + right side?" : "Switch to the standard program?", text: v === "personal" ? "Adds an extra set on the weaker side for carries, side planks and Pallof presses, plus back-pain tracking and back rules." : "Equal sets on both sides and general coaching notes. Your logged workouts stay.", yes:"Switch program", run: async () => { S.profile.program = v === "personal" ? personalProgram() : standardProgram(); if (v === "personal") S.profile.settings.trackBack = true; await Store.saveProfile(S.profile); toast("Program updated"); }}; S.forceRender = true; return render(); }
  if (a === "export-json") return exportJSON("export");
  if (a === "export-csv") return exportCSV();
  if (a === "backup") return exportJSON("backup");
  if (a === "copy-out"){ const ta = document.getElementById("out-text"); try { await navigator.clipboard.writeText(ta.value); toast("Copied"); } catch(e){ ta.select(); toast("Text selected — copy it from the menu."); } return; }
});
function rerenderLogKeepScroll(){ const y = window.scrollY; S.forceRender = true; render(); window.scrollTo(0, y); }
function applyAutofill(){
  S.draft.exercises.forEach(x => { const prev = previousFor(x.performedAs, S.draft.id); if (!prev) return;
    x.sets.forEach(s => { const p = prev.sets.find(t => t.label === s.label && t.done); if (!p || s.done) return; if (s.reps === "") s.reps = p.reps; if (s.kg === "" && x.type !== "bw") s.kg = p.kg; }); });
}
app.addEventListener("input", ev => {
  const el = ev.target; const f = el.dataset && el.dataset.in; if (!f || !S.draft) return;
  if (f === "notes"){ S.draft.notes = el.value; } else { const s = S.draft.exercises[+el.dataset.x].sets[+el.dataset.s]; s[f] = el.value.replace(",", "."); }
  saveDraft();
});
app.addEventListener("focusout", () => { setTimeout(() => { if (pendingRender && !(document.activeElement && document.activeElement.matches("main input, main textarea, main select"))){ S.forceRender = true; render(); } }, 50); });
app.addEventListener("submit", async ev => {
  ev.preventDefault();
  if (ev.target.id === "cardioForm"){
    const mins = numOrNull(val("c-min")) ?? numOrNull(document.getElementById("c-min").placeholder);
    if (!mins) return toast("Enter the minutes you walked.");
    const date = val("c-date") || today();
    await saveRec("cardio", {id:uid("c"), date, week:weekOf(date), type:val("c-type"), minutes:mins, avgHr:numOrNull(val("c-hr")), speed:numOrNull(val("c-speed")), incline:numOrNull(val("c-inc")), notes:val("c-notes")}).catch(()=>{});
    S.forceRender = true; render(); toast(`Saved ${mins} min`);
  }
  if (ev.target.id === "bodyForm"){
    const rec = {date: val("b-date") || today(), weight:numOrNull(val("b-weight")), waist:numOrNull(val("b-waist")), sleep:numOrNull(val("b-sleep")), recovery:numOrNull(val("b-rec")), backPain: set_().trackBack ? numOrNull(val("b-back")) : null, source:"check-in"};
    if ([rec.weight, rec.waist, rec.sleep, rec.recovery, rec.backPain].every(v => v == null)) return toast("Enter at least one measurement.");
    await saveRec("body", {id:uid("b"), ...rec}).catch(()=>{});
    S.forceRender = true; render(); toast("Check-in saved");
  }
});
app.addEventListener("change", ev => { if (ev.target.id === "restore-file" && ev.target.files[0]) restore(ev.target.files[0]); });
async function saveDexa(){
  const existing = S.sheet.id ? S.data.dexa.find(x => x.id === S.sheet.id) : null;
  const rec = {id: existing ? existing.id : uid("d"), date: val("d-date") || null, notes: val("d-notes"), fileId: existing ? existing.fileId : null, fileName: existing ? existing.fileName : null};
  DEXA_FIELDS.forEach(([k]) => rec[k] = numOrNull(val("d-" + k)));
  if (!rec.date && DEXA_FIELDS.every(([k]) => rec[k] == null)) return toast("Add the scan date or at least one number.");
  const f = document.getElementById("d-file").files[0];
  if (f){
    if (f.size > 25 * 1024 * 1024) return toast("That file is over 25 MB. Try a smaller photo or PDF.");
    try { const fid = uid("f"); await Store.putFile(fid, f); if (rec.fileId) await Store.delFile(rec.fileId).catch(()=>{}); rec.fileId = fid; rec.fileName = f.name; }
    catch(e){ toast(e.message || "Couldn't store the report on this device."); return; }
  }
  await saveRec("dexa", rec).catch(()=>{});
  S.sheet = null; S.forceRender = true; render(); toast("Scan saved");
}

/* ============ Android app shell ============ */
function nativeSetup(){
  const App = NATIVE && NATIVE.Plugins && NATIVE.Plugins.App; if (!App) return;
  App.addListener("backButton", () => {
    if (S.sheet) return closeSheet();
    if (S.view === "log"){ saveDraft(); S.view = "today"; S.forceRender = true; return render(); }
    if (S.sub){ S.sub = null; S.forceRender = true; return render(); }
    if (S.view !== "today"){ S.view = "today"; S.forceRender = true; render(); return window.scrollTo(0,0); }
    App.exitApp();
  });
}
/* ============ Boot ============ */
async function boot(){
  render();
  await Store.open();
  const {data, profile} = await Store.loadAll();
  S.data = data;
  if (profile) S.profile = profile;
  else {
    let owner = false;
    try { const u = window.claude ? await Promise.race([window.claude.use("user"), new Promise(r => setTimeout(() => r(null), 3000))]) : null; owner = u ? !!u.isOwner() : false; } catch(e){}
    S.profile = defaultsFor(owner);
    await Store.saveProfile(S.profile).catch(()=>{});
  }
  try { const d = JSON.parse(localStorage.getItem("sl-draft") || "null"); if (d && d.exercises) S.draft = d; } catch(e){}
  S.ready = true; S.forceRender = true; render();
  if (Store.mode === "memory") toast("This browser is blocking storage. Save a backup before closing.");
}
nativeSetup();
boot();
</script>
