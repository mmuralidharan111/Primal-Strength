<style>
/* Layout: one-column phone app — sticky header, scrolling view, fixed bottom tab bar; Trainerize-style logging rows */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1215; --surface:#171B20; --sunk:#1E242A; --ink:#E8EBEE; --muted:#9AA3AD; --line:#2A3139;
  --accent:#6A9BEA; --accent-soft:#1B2A40; --cta:#F2C744; --cta-ink:#1A1600;
  --good:#5BC28A; --good-soft:#15291E; --warn:#E3A945; --warn-soft:#2E2412; --bad:#F07167; --bad-soft:#341A18;
  --chart-2:#F0965A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1215; --surface:#171B20; --sunk:#1E242A; --ink:#E8EBEE; --muted:#9AA3AD; --line:#2A3139;
  --accent:#6A9BEA; --accent-soft:#1B2A40; --cta:#F2C744; --cta-ink:#1A1600;
  --good:#5BC28A; --good-soft:#15291E; --warn:#E3A945; --warn-soft:#2E2412; --bad:#F07167; --bad-soft:#341A18;
  --chart-2:#F0965A; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.brand{flex:1;min-width:0}

label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);width:100%;font-weight:400}
textarea{resize:vertical;min-height:64px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{min-width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

/* workout list + overview */
.wcard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

.exlist{display:flex;flex-direction:column}
.exitem{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}

.logbar .title{flex:1;min-width:0}
.logbar .title b{font-family:var(--f-display);font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logbar .title span{font-size:13px;color:var(--muted)}
.savebtn{font-family:var(--f-display);font-size:20px;font-weight:700;background:none;border:0;padding:6px 8px}
.excard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}

.exhead{display:flex;gap:10px;align-items:flex-start}
.exhead .nm{flex:1;min-width:0}

.exhead .nm span{font-size:14px;color:var(--muted)}

.restchip{display:flex;align-items:center;justify-content:space-between;background:var(--sunk);border-radius:999px;padding:6px 6px 6px 14px;color:var(--accent);font-size:14px;font-weight:600}
.restchip button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;color:var(--accent);font-weight:700;display:flex;gap:6px;align-items:center}
.sets{display:grid;grid-template-columns:44px minmax(0,1fr) 72px 72px 44px;gap:8px 8px;align-items:center}
.sets .h{font-weight:700;font-size:14px}

.sets input{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
.sets input:disabled{background:var(--sunk);color:var(--muted)}
.tick{width:44px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.tick svg{width:20px;height:20px}

.toggle{width:50px;height:30px;border-radius:999px;background:var(--line);border:0;position:relative;flex:none}

.toggle.on{background:var(--accent)}

/* timer */
.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:24;pointer-events:none}
.timer .wrap{pointer-events:auto}

.timer.ring .box{background:var(--cta);color:var(--cta-ink)}
.timer.ring .box button{color:var(--cta-ink);border-color:var(--cta-ink)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}

.gymbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;background:var(--bg);border-bottom:1px solid var(--line);padding:10px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px))}
.gymbar .mark{height:40px}
.gymgrid{display:grid;gap:14px;overflow-x:auto;align-items:start}
.gymcol{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--accent);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}

.tbl{overflow-x:auto}

const SIDE_L = "Left hand", SIDE_R = "Right hand";
function baseProgram(){
  return {
    name: "3-Day Strength Block",
    days: [
      {id:"A", title:"Squat + horizontal push/pull", dow:1, equip:["Barbell","Dumbbell","Cable"], ex:[
        {n:"Zercher squat", sets:3, reps:"6–8", rest:150, type:"load", main:true, alts:["Goblet squat","Belt squat"], cue:"Unrack from pins at mid-thigh. Go only as deep as you can without your lower back rounding."},
        {n:"DB bench press", sets:3, reps:"8–10", rest:120, type:"load", alts:["Barbell bench in a rack","Machine chest press"]},
        {n:"Chest-supported DB row", sets:3, reps:"8–10", rest:90, type:"load", alts:["Seated cable row"]},
        {n:"Cable pull-through", sets:3, reps:"12", rest:90, type:"load", alts:["Glute bridge","45° hip extension"], cue:"Hinge at the hips; keep the spine neutral."},
        {n:"Suitcase carry", sets:3, reps:"30", rest:60, type:"carry", side:{order:["L","R"], extra:"L", names:{L:SIDE_L,R:SIDE_R}}, cueMe:"Weight in your left hand loads the right side of your trunk — that side gets the extra set."},
        {n:"Side plank", sets:3, reps:"30–45", rest:30, type:"time", side:{order:["R","L"], extra:"R", names:{R:"Right side down",L:"Left side down"}}}
      ]},
      {id:"B", title:"Hinge + vertical push/pull", dow:3, equip:["Trap bar","Dumbbell","Cable"], ex:[
        {n:"Trap-bar deadlift (high handles)", sets:3, reps:"6", rest:180, type:"load", main:true, alts:["Kettlebell deadlift from a step","Cable pull-through"], cue:"High handles. Brace before every rep; no grinding reps."},
        {n:"Seated DB overhead press", sets:3, reps:"8–10", rest:120, type:"load", alts:["Landmine press"]},
        {n:"Lat pulldown", sets:3, reps:"8–12", rest:90, type:"load", alts:["Assisted pull-up","Single-arm cable pulldown"]},
        {n:"Bulgarian split squat", sets:3, reps:"8", rest:90, type:"load", each:true, alts:["Reverse lunge"], cue:"Right leg first; match the left to it."},
        {n:"Pallof press", sets:3, reps:"10", rest:45, type:"load", side:{order:["R","L"], extra:"R", names:{R:"Right side",L:"Left side"}}, alts:["Band Pallof press"]},
        {n:"Farmer carry", sets:3, reps:"40", rest:60, type:"carry"}
      ]},
      {id:"C", title:"Single-leg + hypertrophy", dow:5, equip:["Machines","Dumbbell","Cable"], ex:[
        {n:"Leg press", sets:3, reps:"10–12", rest:120, type:"load", main:true, alts:["Hack squat","Goblet squat"], cue:"Stop before your lower back lifts off the pad."},
        {n:"Incline DB press", sets:3, reps:"10–12", rest:90, type:"load", alts:["Incline machine press"]},
        {n:"Single-arm DB row", sets:3, reps:"10", rest:60, type:"load", each:true, alts:["Single-arm cable row"], cue:"Right arm first."},
        {n:"Hip thrust", sets:3, reps:"10", rest:90, type:"load", alts:["Glute bridge","45° hip extension"]},
        {n:"Lateral raise", sets:2, reps:"12–15", rest:0, type:"load", group:"Superset · 2 rounds"},
        {n:"DB curl", sets:2, reps:"12–15", rest:0, type:"load", group:"Superset · 2 rounds"},
        {n:"Cable triceps pushdown", sets:2, reps:"12–15", rest:60, type:"load", group:"Superset · 2 rounds"},
        {n:"Single-arm overhead carry", sets:3, reps:"20", rest:60, type:"carry", side:{order:["R","L"], extra:"R", names:{R:"Right arm",L:"Left arm"}}},
        {n:"Dead bug", sets:3, reps:"8", rest:30, type:"bw", each:true}
      ]}
    ]
  };
}
function personalProgram(){
  const p = baseProgram(); p.kind = "personal";
  p.notes = ["Back rules (disc-friendly): no loaded spinal flexion, brace every rep, swap Zercher for goblet squat on irritated days.",
             "If next-morning back pain is 2+ points above your normal, cut that week's lower-body loads by 20%.",
             "Start lifting at least 60 minutes after waking."];
  return p;
}
function standardProgram(){
  const p = baseProgram(); p.kind = "standard";
  p.days.forEach(d => d.ex.forEach(e => { if (e.side) e.side.extra = null; delete e.cueMe; }));
  p.notes = ["Leave 2–3 reps in the tank on the big lifts. Add load once every set hits the top of the rep range."];
  return p;
}

const Store = {
  mode:"memory", idb:null,
  async open(){
    try {
      this.idb = await new Promise((res, rej) => {
        const r = indexedDB.open("strength-log", 1);
        r.onupgradeneeded = () => { const db = r.result; db.createObjectStore("records", {keyPath:"id"}); db.createObjectStore("files"); db.createObjectStore("kv"); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        setTimeout(() => rej(new Error("timeout")), 4000);
      });
      this.mode = "idb";
    } catch(e){
      try { localStorage.setItem("sl-probe","1"); localStorage.removeItem("sl-probe"); this.mode = "local"; } catch(e2){ this.mode = "memory"; }
    }
  },
  tx(store, mode){ return this.idb.transaction(store, mode).objectStore(store); },
  req(r){ return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async loadAll(){
    const data = emptyData(); let profile = null;
    if (this.mode === "idb"){
      const all = await this.req(this.tx("records","readonly").getAll());
      all.forEach(r => { if (data[r.col]) data[r.col].push(r); });
      profile = await this.req(this.tx("kv","readonly").get("profile")) || null;
    } else if (this.mode === "local"){
      try { const j = JSON.parse(localStorage.getItem("sl-data") || "null"); if (j){ COLS.forEach(c => data[c] = j[c] || []); profile = j.profile || null; } } catch(e){}
    }
    return {data, profile};
  },
  _local(){ try { localStorage.setItem("sl-data", JSON.stringify({...S.data, profile:S.profile})); } catch(e){ toast("Couldn't save on this device — storage is full or blocked."); } },
  async put(rec){
    if (this.mode === "idb") return this.req(this.tx("records","readwrite").put(rec));
    if (this.mode === "local") this._local();
  },
  async del(id){
    if (this.mode === "idb") return this.req(this.tx("records","readwrite").delete(id));
    if (this.mode === "local") this._local();
  },
  async saveProfile(p){
    if (this.mode === "idb") return this.req(this.tx("kv","readwrite").put(p, "profile"));
    if (this.mode === "local") this._local();
  },
  async putFile(id, blob){ if (this.mode !== "idb") throw new Error("Files need in-app storage, which this browser has blocked."); return this.req(this.tx("files","readwrite").put(blob, id)); },
  async getFile(id){ if (this.mode !== "idb") return null; return this.req(this.tx("files","readonly").get(id)); },
  async delFile(id){ if (this.mode === "idb") return this.req(this.tx("files","readwrite").delete(id)); },
  async clearRecords(){
    if (this.mode === "idb"){ await this.req(this.tx("records","readwrite").clear()); }
  },
  async clearAll(){
    if (this.mode === "idb"){ await this.req(this.tx("records","readwrite").clear()); await this.req(this.tx("files","readwrite").clear()); }
    try { localStorage.removeItem("sl-data"); localStorage.removeItem("sl-draft"); } catch(e){}

const byDateDesc = (a,b) => (b.date + (b.ts||"")).localeCompare(a.date + (a.ts||""));

function previousFor(name, excludeId){
  for (const s of sessionsSorted()){
    if (s.id === excludeId) continue;
    const e = s.exercises.find(x => x.performedAs === name);
    if (e && e.sets.some(t => t.done)) return {date:s.date, sets:e.sets};
  }

}
function topSet(e){
  let best = null;
  e.sets.filter(t => t.done && +t.kg > 0).forEach(t => { if (!best || +t.kg > +best.kg || (+t.kg === +best.kg && +t.reps > +best.reps)) best = t; });
  return best;
}
const e1rm = (kg, reps) => reps > 0 && reps <= 12 ? kg * (1 + reps/30) : null;
function repTop(reps){ const m = String(reps).match(/(\d+(?:\.\d+)?)(?!.*\d)/); return m ? +m[1] : null; }
function loadHint(ex, prev){
  if (!prev || ex.type !== "load") return null;
  const done = prev.sets.filter(t => t.done && +t.kg > 0);
  const top = repTop(ex.reps);
  if (!done.length || !top) return null;
  if (done.every(t => +t.reps >= top)){
    const kg = Math.max(...done.map(t => +t.kg));
    const inc = ex.main && /zercher/i.test(ex.n) ? 2.5 : (ex.main || /thrust|leg press|deadlift/i.test(ex.n)) ? 5 : 2.5;
    return `You hit ${top} reps on every set last time. Try ${+(kg + inc).toFixed(1)} kg.`;
  }
  return null;
}
function weekStats(w){
  const start = addDays(startDate(), (w-1)*7), end = addDays(start, 6);
  const inWeek = r => r.date >= start && r.date <= end;
  const sess = S.data.sessions.filter(inWeek);
  const cardio = S.data.cardio.filter(inWeek).reduce((s,c) => s + (+c.minutes||0), 0);
  const pains = sess.map(s => s.backPain).filter(v => v != null && v !== "");
  return {start, end, sessions:sess, cardio, plan:weekCardioPlan(w), pain: pains.length ? pains.reduce((a,b)=>a+ +b,0)/pains.length : null};
}
function latestBody(field){
  const rows = [...S.data.body].filter(b => b[field] != null && b[field] !== "").sort(byDateDesc);

function dexaStatus(){
  const dated = S.data.dexa.filter(d => d.date).sort(byDateDesc);
  if (!dated.length) return {state:"none"};
  const next = addDays(dated[0].date, (set_().dexaWeeks || 12) * 7);
  const left = daysBetween(today(), next);
  return {state: left < 0 ? "overdue" : left <= 14 ? "soon" : "ok", next, left, last: dated[0].date};
}
function nextWorkout(){
  const w = weekOf(today());
  const st = weekStats(w);
  const doneIds = st.sessions.map(s => s.day);
  const order = prog().days.map(d => d.id);
  const remaining = order.filter(id => !doneIds.includes(id));
  return {week:w, remaining, next: remaining[0] || null, done: doneIds.length};
}

/* ============ Charts ============ */
function niceTicks(min, max, n=4){
  if (min === max){ min -= 1; max += 1; }
  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1,2,2.5,5,10].map(m => m*mag).find(s => s >= step0) || 10*mag;
  const lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step; const t = [];
  for (let v = lo; v <= hi + step/2; v += step) t.push(+v.toFixed(6));
  return t;
}
function lineChart(series, {unit="", h=180, dec=1} = {}){
  const all = series.flatMap(s => s.pts); if (!all.length) return "";
  const W = 340, L = 38, R = 14, T = 14, B = 26;
  const xs = all.map(p => parse(p.x).getTime()); let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x0 === x1){ x0 -= 86400000*3; x1 += 86400000*3; }
  const ys = all.map(p => p.y); const ticks = niceTicks(Math.min(...ys), Math.max(...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length-1];
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - (v - y0)/(y1 - y0)) * (h - T - B);
  let g = ticks.map(t => `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axis" x="${L-6}" y="${Y(t)+4}" text-anchor="end">${fmt(t,dec)}</text>`).join("");
  g += `<text class="axis" x="${L}" y="${h-6}">${shortDate(ymd(new Date(x0)))}</text><text class="axis" x="${W-R}" y="${h-6}" text-anchor="end">${shortDate(ymd(new Date(x1)))}</text>`;
  series.forEach((s, si) => {
    const pts = [...s.pts].sort((a,b) => a.x.localeCompare(b.x));
    const d = pts.map((p,i) => `${i?"L":"M"}${X(parse(p.x).getTime()).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
    if (si === 0 && pts.length > 1) g += `<path class="s1a" d="${d}L${X(parse(pts[pts.length-1].x).getTime())},${Y(y0)}L${X(parse(pts[0].x).getTime())},${Y(y0)}Z"/>`;
    g += `<path class="${si ? "s2" : "s1"}" d="${d}"/>`;
    pts.forEach((p,i) => { const last = i === pts.length-1; g += `<circle class="${si?"d2":"d1"}" cx="${X(parse(p.x).getTime())}" cy="${Y(p.y)}" r="${last?4.5:3}"/>`; });
    if (si === 0){ const p = pts[pts.length-1]; const x = X(parse(p.x).getTime()); g += `<text class="lab" x="${Math.min(x, W-R)}" y="${Y(p.y)-9}" text-anchor="${x > W-60 ? "end" : "middle"}">${fmt(p.y,dec)}${unit}</text>`; }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`;
}
function barChart(rows, {h=170} = {}){
  if (!rows.length) return "";
  const W = 340, L = 38, R = 10, T = 14, B = 24;
  const max = Math.max(...rows.map(r => Math.max(r.v, r.plan||0)), 10); const ticks = niceTicks(0, max); const y1 = ticks[ticks.length-1];
  const bw = (W - L - R) / rows.length;
  const Y = v => T + (1 - v/y1) * (h - T - B);
  let g = ticks.map(t => `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text class="axis" x="${L-6}" y="${Y(t)+4}" text-anchor="end">${t}</text>`).join("");
  rows.forEach((r,i) => {
    const x = L + i*bw + bw*0.18, w = bw*0.64;
    g += `<rect class="bar${r.plan && r.v < r.plan*0.9 ? " low" : ""}" x="${x}" y="${Y(r.v)}" width="${w}" height="${Math.max(0, Y(0)-Y(r.v))}" rx="3"/>`;
    if (r.plan) g += `<line class="plan" x1="${x-2}" x2="${x+w+2}" y1="${Y(r.plan)}" y2="${Y(r.plan)}"/>`;
    g += `<text class="axis" x="${x + w/2}" y="${h-6}" text-anchor="middle">${esc(r.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`;
}

  if (recentFives.length) out += `<section class="card"><b>🦍 ${esc(recentFives[0].fromName)}${recentFives.length > 1 ? ` and ${recentFives.length - 1} more` : ""} high-fived your workout</b><button class="btn ghost" data-act="tab" data-v="squad">See Squad</button></section>`;
  if (set_().trackBack){
    const last = sessionsSorted()[0];
    if (last && last.backPain != null && set_().backNormal != null && +last.backPain >= +set_().backNormal + 2)
      out += `<div class="banner bad"><div><b>Back flag.</b> Last session's back pain was ${last.backPain}/10, 2+ above your normal of ${set_().backNormal}. Cut lower-body loads by 20% this week and use goblet squats.</div></div>`;
  }
  if (ds.state === "overdue") out += `<div class="banner warn"><div><b>DEXA scan overdue.</b> Your last scan was ${shortDate(ds.last)}; the next was due ${shortDate(ds.next)}. <button class="btn ghost" data-act="tab" data-v="body">Add scan</button></div></div>`;
  else if (ds.state === "soon") out += `<div class="banner warn"><div><b>DEXA due in ${ds.left} days</b> (${shortDate(ds.next)}). Book the same machine as last time.</div></div>`;
  else if (ds.state === "none") out += `<div class="banner info"><div><b>Add your last DEXA scan</b> so the app can remind you when the next one is due. <button class="btn ghost" data-act="tab" data-v="body">Add scan</button></div></div>`;
  const lb = set_().lastBackup;
  if (S.data.sessions.length && (!lb || daysBetween(lb, t) >= 7)) out += `<div class="banner info"><div><b>Back up your log.</b> It lives only on this device. ${lb ? `Last backup ${shortDate(lb)}.` : "No backup yet."} <button class="btn ghost" data-act="backup">Save backup</button></div></div>`;

  if (!hasProgram()){ out += getStartedCard(); return out + todayStatsBlock(); }
  // hero
  const isLiftDay = prog().days.some(d => d.dow === dow);
  const nd = nw.next ? dayById(nw.next) : null;
  out += `<section class="card"><span class="eyebrow">${w < 1 ? "Block starts " + shortDate(startDate()) : DOW[dow] + " · " + shortDate(t)}</span>`;
  if (nd){
    out += `<div class="row" style="flex-wrap:nowrap"><div class="dayblock">${esc(nd.id)}</div><div style="min-width:0"><h2>${esc(nd.title)}</h2><span class="muted small">${isLiftDay ? "Next up" : "Next in rotation — today is a cardio day"} · est. ${estMinutes(nd, Math.max(1,w))} min · ${nd.ex.length} exercises</span></div></div>
    <button class="btn primary block" data-act="openday" data-d="${nd.id}">View workout</button>`;
  } else out += `<h2>All ${prog().days.length} workouts done this week</h2><p class="muted small">Walk today and rest up. The next block of lifts starts Monday.</p>`;
  const cp = cardioPlan(Math.max(1,w), dow);
  const cardioLine = cp[0] ? `<b>Cardio today:</b> ${esc(cp[0])}${cp[1] ? ` · ${cp[1]} min` : ""}` : st.plan ? `<b>Cardio this week:</b> ${st.cardio} of ${st.plan} min` : `<b>Cardio:</b> log any walks or sessions`;
  out += `<div class="row between small"><span>${I.walk.replace("<svg", '<svg width="18" height="18" style="vertical-align:-4px"')} ${cardioLine}</span><button class="btn ghost" data-act="tab" data-v="cardio">Log</button></div></section>`;

  // week strip
  const mon = mondayOf(t);
  out += `<section class="card"><div class="row between"><h3>This week</h3><span class="muted small">${G.weekPts} points</span></div>${ringsCard(G)}<div class="strip">`;
  for (let i=0;i<7;i++){
    const d = addDays(mon,i); const s = S.data.sessions.filter(x => x.date === d); const c = S.data.cardio.filter(x => x.date === d).reduce((a,b)=>a+ +b.minutes,0);
    out += `<div class="${d===t?"today":""} ${s.length?"lift":""}"><span>${DOW[parse(d).getDay()]}</span><b>${s.length ? s.map(x=>x.day).join("") : "·"}</b><span class="num">${c ? c+"′" : ""}</span></div>`;
  }
  out += `</div><div class="meter" aria-label="Cardio progress"><i style="width:${Math.min(100, st.plan ? st.cardio/st.plan*100 : 0)}%"></i></div></section>`;

  out += todayStatsBlock();
  if (prog().notes && prog().notes.length) out += `<section class="card"><span class="eyebrow">Program notes</span>${prog().notes.map(n => `<p class="small" style="margin:0">${esc(n)}</p>`).join("")}</section>`;
  return out;
}

/* ---- Logging ---- */
function newDraft(dayId){
  const d = dayById(dayId); const w = Math.max(1, weekOf(today()));
  return { id: uid("s"), day: d.id, title: d.title, date: today(), week: w, startedAt: Date.now(), backPain: null, notes: "", pre: null,
    exercises: d.ex.map((e,i) => ({ key: i, base: e.n, performedAs: e.n, type: e.type, rest: +e.rest || 0, note: "",
      sets: setLabels(e,i,w).map(l => ({label:l, reps:"", kg:"", done:false})) })) };
}
function exDef(dx){ const d = dayById(S.draft.day); return d.ex[dx.key] || {n:dx.base, reps:"", type:dx.type, sets:dx.sets.length}; }
function setLabelText(e, label){
  if (!e.side) return label;
  return label;
}
function viewLog(){
  const D = S.draft; const w = D.week;
  const mins = Math.max(0, Math.round((Date.now() - D.startedAt)/60000));
  let out = `<div class="logbar"><div class="wrap"><button class="iconbtn" data-act="minimize" aria-label="Minimise workout">${I.down}</button>
  <div class="title"><b>${esc(D.title)}</b><span id="elapsed">${mins} min · week ${w}</span></div>
  <button class="iconbtn" data-act="timer-open" aria-label="Rest timer">${I.clock}</button>
  <button class="iconbtn" data-act="lognote" aria-label="Workout note">${I.note}</button>
  <button class="savebtn" data-act="finish">Save</button></div></div>
  <main style="padding-bottom:calc(140px + env(safe-area-inset-bottom,0px))"><div class="wrap">
  <div class="row between"><span>Auto-fill from last time</span><button class="toggle ${S.ui.autofill?"on":""}" data-act="autofill" aria-pressed="${S.ui.autofill}" aria-label="Auto-fill from last time"></button></div>`;
  if (prog().notes && prog().kind === "personal" && D.pre && set_().trackBack && D.pre.backPain != null && set_().backNormal != null && +D.pre.backPain >= +set_().backNormal + 2)
    out += `<div class="banner bad"><div><b>Back is up today (${D.pre.backPain}/10).</b> Use goblet squats and take 20% off lower-body loads.</div></div>`;
  let lastGroup = null;

    const e = exDef(x); const cols = COL[x.type] || COL.load;
    if (e.group && e.group !== lastGroup) out += `<div class="group-head" style="margin-inline:0;border-radius:10px">${esc(e.group)}</div>`;
    lastGroup = e.group || null;
    const prev = previousFor(x.performedAs, D.id);
    const hint = loadHint(e, prev);
    const rir = rirFor(e, w);
    const allDone = x.sets.length && x.sets.every(s => s.done);
    const sd = sideFor(e) || (x.sets.some(z => /^[LR]\d+$/.test(z.label)) ? {order:["L","R"], names:{L:"Left", R:"Right"}} : null);
    out += `<section class="excard ${allDone?"done":""}" id="ex-${xi}">
    <div class="exhead"><div class="nm"><b>${esc(x.performedAs)}</b><span>${esc(targetText(e, x.key, w))}${rir!=null?` · RIR ${rir}`:""}${x.performedAs!==x.base?` · swapped from ${esc(x.base)}`:""}</span></div>
    <button class="iconbtn" data-act="exinfo" data-x="${xi}" aria-label="Notes for ${esc(x.performedAs)}">${I.info}</button>
    <button class="iconbtn" data-act="swap" data-x="${xi}" aria-label="Swap exercise">${I.swap}</button></div>
    ${x.rest ? `<div class="restchip"><span>Rest between each set</span><button data-act="restcycle" data-x="${xi}">${I.clock.replace("<svg",'<svg width="16" height="16"')}${fmtRest(x.rest)}</button></div>` : ""}
    ${hint ? `<div class="hint">${esc(hint)}</div>` : ""}
    ${(e.cue || balanceCue(sd)) ? `<div class="cue">${esc([e.cue, balanceCue(sd)].filter(Boolean).join(" "))}</div>` : ""}
    <div class="sets"><span class="h">Set</span><span class="h">Previous</span><span class="h">${cols[0]}</span><span class="h">${cols[1]}</span><span></span>`;
    x.sets.forEach((s, si) => {
      const p = prev ? (prev.sets.find(t => t.label === s.label && t.done) || null) : null;
      const pText = p ? `${p.reps || "–"} × ${p.kg ? p.kg + " kg" : "–"}` : "–";
      const lbl = s.label;
      out += `<span class="lbl num" title="${sd && sd.names[s.label[0]] ? esc(sd.names[s.label[0]]) : ""}">${esc(lbl)}</span><span class="prev num">${esc(pText)}</span>
      <input inputmode="numeric" data-in="reps" data-x="${xi}" data-s="${si}" value="${esc(s.reps)}" placeholder="${p ? esc(p.reps) : esc(String(repTop(targetReps(e, w)) ?? ""))}" aria-label="${cols[0]} set ${esc(lbl)}" id="r-${xi}-${si}">
      <input inputmode="decimal" data-in="kg" data-x="${xi}" data-s="${si}" value="${esc(s.kg)}" placeholder="${p && p.kg ? esc(p.kg) : (targetKg(e, w) != null ? esc(targetKg(e, w)) : "")}" ${x.type==="bw"?"disabled":""} aria-label="Kg set ${esc(lbl)}" id="k-${xi}-${si}">
      <button class="tick ${s.done?"on":""}" data-act="tick" data-x="${xi}" data-s="${si}" aria-label="Mark set ${esc(lbl)} done" aria-pressed="${s.done}">${I.check}</button>`;
    });
    out += `</div>${sd ? `<div class="cue">${sd.order.map(k => `${k} = ${esc(sd.names[k])}`).join(" · ")}</div>` : ""}
    <div class="row"><button class="btn ghost" data-act="addset" data-x="${xi}">${I.plus.replace("<svg",'<svg width="20" height="20"')} Add new set</button>${x.sets.length > 1 ? `<button class="btn ghost" data-act="rmset" data-x="${xi}" style="color:var(--muted)">Remove last</button>` : ""}</div>
    ${x.note ? `<div class="cue">Note: ${esc(x.note)}</div>` : ""}</section>`;
  });
  out += `<section class="card"><h3>Finish</h3>
  ${set_().trackBack ? `<div><div class="small muted" style="font-weight:600;margin-bottom:6px">Back pain now (0–10)</div><div class="seg">${[...Array(11)].map((_,i)=>`<button data-act="pain" data-v="${i}" class="${D.backPain===i?"on":""}">${i}</button>`).join("")}</div></div>` : ""}
  <label class="f">Workout notes<textarea id="lognotes" data-in="notes">${esc(D.notes)}</textarea></label>
  <button class="btn primary block" data-act="finish">Save workout</button>
  <button class="btn danger block" data-act="discard">Discard workout</button></section></div></main>`;
  return out;
}

function zonePill(hr){

  return `<span class="pill good">Z2</span>`;
}

const DEXA_FIELDS = [["lean","Lean mass kg",1],["fat","Fat mass kg",1],["bf","Body fat %",1],["vat","Visceral fat g",0],["android","Android fat %",1],["ag","A/G ratio",2],["trunkL","Trunk lean L kg",2],["trunkR","Trunk lean R kg",2],["armL","Arm lean L kg",2],["armR","Arm lean R kg",2],["legL","Leg lean L kg",2],["legR","Leg lean R kg",2]];

/* ---- Progress ---- */
function viewProgress(){
  const ptab = S.ui.ptab || "stats";
  let out = `<div><span class="eyebrow">Trends</span><h1>Progress</h1></div><div class="chips"><button class="chip ${ptab==="stats"?"on":""}" data-act="ptab" data-v="stats">Stats</button><button class="chip ${ptab==="trophies"?"on":""}" data-act="ptab" data-v="trophies">Trophies</button></div>`;
  if (ptab === "trophies") return out + viewTrophies();
  // lifts
  const names = {};
  sessionsSorted().forEach(s => s.exercises.forEach(e => { if ((e.type === "load" || e.type === "carry") && topSet(e)) names[e.performedAs] = (names[e.performedAs]||0) + 1; }));
  const order = []; prog().days.forEach(d => d.ex.forEach(e => { if (names[e.n]) order.push(e.n); }));
  Object.keys(names).forEach(n => { if (!order.includes(n)) order.push(n); });
  if (!S.ui.lift || !names[S.ui.lift]) S.ui.lift = order[0] || null;
  out += `<section class="card"><h3>Lifts</h3>`;
  if (S.ui.lift){
    out += `<div class="chips">${order.map(n => `<button class="chip ${n===S.ui.lift?"on":""}" data-act="pick-lift" data-v="${esc(n)}">${esc(n)}</button>`).join("")}</div>
    <div class="chips">${[["top","Top set kg"],["e1rm","Est. 1-rep max"],["vol","Volume"]].map(([k,l]) => `<button class="chip ${S.ui.metric===k?"on":""}" data-act="pick-metric" data-v="${k}">${l}</button>`).join("")}</div>`;
    const pts = []; const rowsT = [];
    [...S.data.sessions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s => s.exercises.filter(e => e.performedAs === S.ui.lift).forEach(e => {
      const t = topSet(e); if (!t) return;
      const vol = e.sets.filter(x=>x.done).reduce((a,x)=>a + (+x.kg||0)*(+x.reps||0), 0);
      const v = S.ui.metric === "top" ? +t.kg : S.ui.metric === "e1rm" ? e1rm(+t.kg, +t.reps) : vol;
      if (v != null) pts.push({x:s.date, y:+v.toFixed(1)});
      rowsT.push({date:s.date, top:`${t.kg} kg × ${t.reps}`, vol});
    }));
    out += pts.length > 1 ? lineChart([{pts}], {unit: S.ui.metric === "vol" ? "" : " kg"}) : `<div class="empty">One session so far. The graph appears after the second.</div>`;
    if (pts.length){ const first = pts[0].y, last = pts[pts.length-1].y; out += `<p class="small" style="margin:0"><b>${last >= first ? "+" : ""}${fmt(last-first)}${S.ui.metric==="vol"?"":" kg"}</b> since ${shortDate(pts[0].x)} across ${pts.length} sessions.</p>`; }
    out += `<div class="tbl"><table><tr><th>Date</th><th>Top set</th><th>Volume kg</th></tr>${rowsT.slice(-6).reverse().map(r => `<tr><td>${shortDate(r.date)}</td><td>${esc(r.top)}</td><td>${Math.round(r.vol).toLocaleString()}</td></tr>`).join("")}</table></div>`;
  } else out += `<div class="empty">Log a workout to see lift trends.</div>`;
  out += `</section>`;
  // body weight + waist
  const bw = S.data.body.filter(b => b.weight).map(b => ({x:b.date, y:+b.weight}));
  const wa = S.data.body.filter(b => b.waist).map(b => ({x:b.date, y:+b.waist}));
  out += `<section class="card"><h3>Body weight</h3>${bw.length > 1 ? lineChart([{pts:dedupe(bw)}], {unit:" kg"}) : `<div class="empty">Weigh in before workouts to build this graph.</div>`}</section>`;
  out += `<section class="card"><h3>Waist</h3><span class="muted small">Target: −1 to −2 cm a month.</span>${wa.length > 1 ? lineChart([{pts:dedupe(wa)}], {unit:" cm"}) : `<div class="empty">Add a weekly waist measurement in Body.</div>`}</section>`;
  // cardio weekly
  const cw = weekOf(today());
  const dataWeeks = [...S.data.sessions, ...S.data.cardio, ...S.data.body].map(r => weekOf(r.date));
  const firstW = Math.min(1, cw, ...dataWeeks);
  const wLabel = w => w >= 1 ? "W" + w : shortDate(addDays(startDate(), (w-1)*7)).replace(/\s.*/, "") + "·";
  const rows = []; for (let w = Math.max(firstW, cw-7); w <= cw; w++){ const st = weekStats(w); rows.push({label:wLabel(w), v:st.cardio, plan: w >= 1 ? st.plan : 0}); }
  const runRows = []; let anyRun = false;
  for (let w = Math.max(firstW, cw-7); w <= cw; w++){
    const st = weekStats(w); let km = 0;
    st.sessions.forEach(ss => ss.exercises.forEach(e => e.sets.filter(x => x.done).forEach(x => {
      const cat = libCat(e.performedAs);
      if (e.type === "run") km += +x.reps || 0; else if (e.type === "dist" && cat === "Running") km += (+x.reps || 0) / 1000;
    })));
    if (km) anyRun = true; runRows.push({label:wLabel(w), v:Math.round(km*10)/10});
  }
  if (anyRun) out += `<section class="card"><h3>Running km per week</h3>${barChart(runRows)}</section>`;
  out += `<section class="card"><h3>Cardio minutes per week</h3>${barChart(rows)}<div class="legend"><span><i></i>Logged</span><span><i style="background:var(--ink);height:2px"></i>Plan</span></div></section>`;
  // weekly table
  const wrows = []; for (let w = firstW; w <= cw; w++){ const st = weekStats(w); const bodyW = S.data.body.filter(b => b.date >= st.start && b.date <= st.end && b.waist).sort(byDateDesc)[0]; wrows.push(`<tr><td>${w >= 1 ? "W" + w : "Before W1"}</td><td>${st.sessions.length}/${prog().days.length}</td><td>${st.cardio}/${st.plan}</td>${set_().trackBack?`<td>${st.pain!=null?fmt(st.pain):"–"}</td>`:""}<td>${bodyW?fmt(bodyW.waist):"–"}</td></tr>`); }
  out += `<section class="card"><h3>Week by week</h3><div class="tbl"><table><tr><th>Week</th><th>Lifts</th><th>Cardio min</th>${set_().trackBack?"<th>Back avg</th>":""}<th>Waist</th></tr>${wrows.reverse().join("")}</table></div></section>`;
  // DEXA trends
  const dx = S.data.dexa.filter(d => d.date).sort((a,b)=>a.date.localeCompare(b.date));
  if (dx.length > 1){
    out += `<section class="card"><h3>DEXA trends</h3>`;
    [["lean","Lean mass"," kg",1],["fat","Fat mass"," kg",1],["vat","Visceral fat"," g",0],["android","Android fat","%",1]].forEach(([k,l,u,d]) => {
      const pts = dx.filter(r => r[k] != null && r[k] !== "").map(r => ({x:r.date, y:+r[k]}));
      if (pts.length > 1) out += `<b class="small">${l}</b>${lineChart([{pts}], {unit:u, h:150, dec:d})}`;
    });
    out += `</section>`;
  }
  // PRs
  const prs = {};
  S.data.sessions.forEach(s => s.exercises.forEach(e => { const t = topSet(e); if (t && e.type === "load"){ const v = e1rm(+t.kg, +t.reps) || +t.kg; if (!prs[e.performedAs] || v > prs[e.performedAs].v) prs[e.performedAs] = {v, t, date:s.date}; } }));
  const pk = Object.keys(prs);
  if (pk.length) out += `<section class="card"><h3>Best sets</h3><div class="tbl"><table><tr><th>Exercise</th><th>Set</th><th>Est. 1RM</th><th>Date</th></tr>${pk.map(n => `<tr><td>${esc(n)}</td><td>${prs[n].t.kg} × ${prs[n].t.reps}</td><td>${fmt(prs[n].v)}</td><td>${shortDate(prs[n].date)}</td></tr>`).join("")}</table></div></section>`;
  if (!isTrainer()) out += `<button class="btn blue block" data-act="export-json">Export for Claude review</button>`;
  return out;
}

function timerHTML(){
  if (!S.timer) return "";
  const left = Math.max(0, Math.ceil((S.timer.end - Date.now())/1000));
  const pct = S.timer.total ? (1 - left / S.timer.total) * 100 : 100;
  return `<div class="timer ${left===0?"ring":""}" id="timer" ${S.view==="log" ? 'style="bottom:calc(16px + env(safe-area-inset-bottom,0px))"' : ""}><div class="wrap"><div class="box">
  <b id="t-left">${Math.floor(left/60)}:${pad(left%60)}</b><div class="bar"><i id="t-bar" style="width:${pct}%"></i></div>
  <button data-act="t-add">+15s</button><button data-act="t-stop">${left===0?"Done":"Skip"}</button></div></div></div>`;
}
let timerTick = null;
function startTimer(sec){
  if (!sec) return;
  S.timer = {end: Date.now() + sec*1000, total: sec, rang:false};
  if (!timerTick) timerTick = setInterval(updateTimer, 250);
  const old = document.getElementById("timer"); if (old) old.remove();
  app.insertAdjacentHTML("beforeend", timerHTML());
}
function updateTimer(){
  if (!S.timer){ clearInterval(timerTick); timerTick = null; return; }
  const left = Math.max(0, Math.ceil((S.timer.end - Date.now())/1000));
  const el = document.getElementById("t-left"), bar = document.getElementById("t-bar"), box = document.getElementById("timer");
  if (el) el.textContent = `${Math.floor(left/60)}:${pad(left%60)}`;
  if (bar) bar.style.width = (1 - left / S.timer.total) * 100 + "%";
  if (left === 0 && !S.timer.rang){
    S.timer.rang = true; if (box){ box.classList.add("ring"); const b = box.querySelector('[data-act="t-stop"]'); if (b) b.textContent = "Done"; }
    try { if (NATIVE && NATIVE.Plugins && NATIVE.Plugins.Haptics) NATIVE.Plugins.Haptics.vibrate({duration:600}); else if (navigator.vibrate) navigator.vibrate([200,100,200]); } catch(e){}
  }
  const em = document.getElementById("elapsed");
  if (em && S.draft) em.textContent = `${Math.max(0, Math.round((Date.now() - S.draft.startedAt)/60000))} min · week ${S.draft.week}`;
}

async function saveRec(col, rec){
  const arr = S.data[col]; const i = arr.findIndex(r => r.id === rec.id);
  if (i >= 0) arr[i] = rec; else arr.push(rec);
  if (isCloudClient()) return cloudSaveRec(col, rec);
  try { await Store.put({...rec, col}); } catch(e){ toast("Couldn't save on this device."); throw e; }
}
async function delRec(col, id){
  const rec = S.data[col].find(r => r.id === id);
  S.data[col] = S.data[col].filter(r => r.id !== id);
  if (isCloudClient()){ cloudDelRec(col, id); if (rec && rec.fileId) Store.delFile(rec.fileId).catch(()=>{}); return; }
  try { await Store.del(id); if (rec && rec.fileId) await Store.delFile(rec.fileId); } catch(e){ toast("Couldn't delete on this device."); }
}

let downloadsNS;
const NATIVE = (() => { try { return window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() ? window.Capacitor : null; } catch(e){ return null; } })();
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
async function saveFile(filename, data, title){
  if (NATIVE && NATIVE.Plugins && NATIVE.Plugins.Filesystem && NATIVE.Plugins.Share){
    try {
      const opts = {path: filename.replace(/[^\w.\-]+/g, "_"), directory: "CACHE"};
      if (typeof data === "string"){ opts.data = data; opts.encoding = "utf8"; } else opts.data = await blobToB64(data);
      const r = await NATIVE.Plugins.Filesystem.writeFile(opts);
      await NATIVE.Plugins.Share.share({title, files:[r.uri], dialogTitle: title});
      return true;
    } catch(e){
      if (/cancel/i.test(String(e && (e.message || e)))) return false;
      if (typeof data === "string"){ openSheet({kind:"text", title, text:data}); } else toast("Couldn't share the file.");
      return false;
    }
  }
  try {
    if (downloadsNS === undefined) downloadsNS = window.claude ? await window.claude.use("downloads") : null;
  } catch(e){ downloadsNS = null; }
  if (!downloadsNS){ if (typeof data === "string"){ openSheet({kind:"text", title, text:data}); } else toast("Saving files isn't available here."); return false; }
  try { await downloadsNS.save({filename, data}); toast("Saved"); return true; }
  catch(e){
    if (e && e.code === "declined") return false;
    if (e && e.code === "rate_limited"){ toast("A save is already open. Try again in a moment."); return false; }
    if (typeof data === "string") openSheet({kind:"text", title, text:data}); else toast("Couldn't save the file here.");
    return false;
  }
}
async function restore(file){
  try {
    const j = JSON.parse(await file.text());
    if (!j || !Array.isArray(j.sessions)) throw new Error("bad");
    S.sheet = {kind:"confirm", title:"Restore this backup?", text:`It holds ${j.sessions.length} workouts, ${ (j.cardio||[]).length } cardio sessions and ${(j.body||[]).length} check-ins from ${j.exportedAt ? j.exportedAt.slice(0,10) : "an earlier date"}. It replaces what's on this device now. Report files aren't included in backups.`, yes:"Replace and restore", danger:true, run: async () => {
      if (isCloudClient()){
        for (const c of COLS) for (const r of (j[c] || [])) await saveRec(c, {...r, fileId: c === "dexa" ? null : r.fileId});
        if (j.settings) S.profile.settings = {...S.profile.settings, ...j.settings};
        if (j.program && !trainerManaged()) S.profile.program = j.program;
        await persistProfile(); toast("Backup restored to your account"); return;
      }
      await Store.clearRecords();
      for (const c of COLS){ S.data[c] = (j[c] || []).map(r => ({...r, fileId: c === "dexa" ? null : r.fileId})); for (const r of S.data[c]) await Store.put({...r, col:c}); }
      if (Store.mode === "local") Store._local();
      if (j.program) S.profile.program = j.program; if (j.settings) S.profile.settings = {...S.profile.settings, ...j.settings};
      await Store.saveProfile(S.profile); toast("Backup restored");
    }};
    S.forceRender = true; render();
  } catch(e){ toast("That file isn't a Primal Strength backup."); }
}

async function applySwap(v, type, always){

}

const tsDate = t => t && t.toDate ? ymd(t.toDate()) : (typeof t === "string" ? t.slice(0,10) : null);

async function cloudInit(){
  if (!window.firebase) return;
  try {
    firebase.initializeApp(FB_CONFIG);
    Cloud.db = firebase.firestore();
    try { await Cloud.db.enablePersistence({synchronizeTabs:true}); } catch(e){}
    firebase.auth().onAuthStateChanged(u => { Cloud.authKnown = true; S.obOffered = false; S.ob = null; if (!u) S.forceRender = true; onAuth(u).then(() => { if (!u){ S.forceRender = true; render(); } }).catch(err => { console.error(err); toast("Couldn't load your account — check your connection."); }); });
  } catch(e){ console.error(e); Cloud.db = null; }
}
function stopListeners(){ Cloud.unsub.forEach(f => { try { f(); } catch(e){} }); Cloud.unsub = []; Cloud.attached = null; closeClient(); socialStop(); ownerStop(); gymStop(); }
function softRender(){ render(); }
async function onAuth(u){
  const had = !!Cloud.user;
  stopListeners(); Cloud.user = u; Cloud.me = null;
  if (!u){
    if (!had) return;
    const {data, profile} = await Store.loadAll(); S.data = data; if (profile) S.profile = profile;
    S.view = "today"; S.sub = null; S.forceRender = true; render(); return;
  }
  let snap = null; try { snap = await uref().get(); } catch(e){}
  if (!snap || !snap.exists){
    const p = Cloud.pending || {role:"client", name:(u.email||"").split("@")[0]};
    await createUserDoc(u, p.role, p.name);
    if (p.role === "owner") await setupGym(p.gymName).catch(() => toast("Couldn't set up your gym. Try again from Account."));
  }
  Cloud.pending = null;
  Cloud.unsub.push(uref().onSnapshot(sn => {
    const d = sn.data(); if (!d) return;
    Cloud.me = {id: sn.id, ...d};
    if (d.role === "owner"){
      if (Cloud.attached !== "owner"){ Cloud.attached = "owner"; attachOwner(); S.view = "owner"; }
    } else if (d.role === "trainer"){
      if (Cloud.attached !== "trainer"){ Cloud.attached = "trainer"; attachTrainer(); S.view = "clients"; }
    } else {
      S.profile = {program: d.program || emptyProgram(), settings: {...defaultsFor(false).settings, ...(d.settings || {})}, created: ""};
      if (Cloud.attached !== "client"){ Cloud.attached = "client"; attachClient(); if (!["today","workouts","cardio","body","progress","squad","log","onboard"].includes(S.view)) S.view = "today"; }
      else { socialTrainerSync(); scheduleSync(); }
    }
    S.forceRender = S.view !== "log"; render();
  }, () => toast("Lost connection to your account.")));
}
async function createUserDoc(u, role, name){
  const doc = {role, name: name || "", email: u.email || "", trainerId: null, createdAt: ts()};
  if (role === "client"){ doc.settings = clean(S.profile.settings); doc.program = clean(S.profile.program); }
  await uref().set(doc);
  if (role === "trainer") await makeInviteCode(name);
  if (role === "client"){
    const local = COLS.reduce((n, c) => n + S.data[c].length, 0);
    if (local) await uploadLocal();
  }
}
async function uploadLocal(){
  let batch = Cloud.db.batch(), n = 0, total = 0;
  for (const c of COLS) for (const r of S.data[c]){
    const rec = {...r}; delete rec.col;
    batch.set(uref().collection(c).doc(rec.id), clean(rec)); n++; total++;
    if (n >= 400){ await batch.commit(); batch = Cloud.db.batch(); n = 0; }
  }
  if (n) await batch.commit();
  if (total) toast(`Moved ${total} entries from this phone to your account`);
}
async function makeInviteCode(name){
  const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  for (let i = 0; i < 6; i++){
    const code = Array.from({length:6}, () => A[Math.floor(Math.random()*A.length)]).join("");
    try { await Cloud.db.collection("codes").doc(code).set({trainerId: Cloud.user.uid, name: name || ""}); await uref().update({inviteCode: code}); return code; } catch(e){}
  }
  toast("Couldn't create an invite code. Try again from Account.");
}
function attachClient(){
  S.data = emptyData();
  COLS.forEach(c => Cloud.unsub.push(uref().collection(c).onSnapshot(q => { S.data[c] = q.docs.map(d => d.data()); render(); scheduleSync(); }, () => {})));
  socialStartClient();
}
function attachTrainer(){
  S.clients = []; S.alerts = [];
  socialStartTrainer();
  Cloud.unsub.push(Cloud.db.collection("users").where("trainerId", "==", Cloud.user.uid).onSnapshot(q => {
    S.clients = q.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => (a.name||"").localeCompare(b.name||""));
    render();
  }, e => toast("Couldn't load your clients.")));
  Cloud.unsub.push(Cloud.db.collection("trainers").doc(Cloud.user.uid).collection("alerts").orderBy("ts", "desc").limit(80).onSnapshot(q => {
    S.alerts = q.docs.map(d => ({id: d.id, ...d.data()})); render();
  }, () => {}));
}
async function cloudSaveRec(col, rec){
  const r = {...rec}; delete r.col;
  uref().collection(col).doc(r.id).set(clean(r)).catch(e => toast("Couldn't sync that entry: " + (e.code || "error")));
}
async function cloudDelRec(col, id){ uref().collection(col).doc(id).delete().catch(() => toast("Couldn't delete online.")); }
async function persistProfile(){
  if (isCloudClient()){
    const upd = {settings: clean(S.profile.settings)};
    if (!trainerManaged()) upd.program = clean(S.profile.program);
    uref().update(upd).catch(() => toast("Couldn't sync settings."));
    return;
  }
  return Store.saveProfile(S.profile);
}
function sendWorkoutAlert(session){
  if (!isCloudClient() || !Cloud.me.trainerId) return;
  const sets = session.exercises.reduce((a, e) => a + e.sets.filter(s => s.done).length, 0);
  Cloud.db.collection("trainers").doc(Cloud.me.trainerId).collection("alerts").add({...clean({
    clientId: Cloud.user.uid, clientName: Cloud.me.name || Cloud.me.email, sessionId: session.id, title: session.title, day: session.day,
    date: session.date, week: session.week, sets, durationMin: session.durationMin, backPain: session.backPain,
    weight: session.pre ? session.pre.weight : null, notes: session.notes || "", read: false
  }), ...{ts: ts()}}).catch(() => {});
}
async function connectTrainer(code){
  code = (code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (code.length !== 6) return toast("Invite codes are 6 letters and numbers.");
  try {
    const d = await Cloud.db.collection("codes").doc(code).get();
    if (!d.exists) return toast("No trainer has that code. Check it and try again.");
    const t = d.data();
    await uref().update({trainerId: t.trainerId, trainerCode: code, trainerName: t.name || "your trainer"});
    toast(`Connected to ${t.name || "your trainer"}`); S.sheet = null; S.forceRender = true; render();
  } catch(e){ toast("Couldn't connect: " + (e.code || "error")); }
}
async function disconnectTrainer(){
  const p = clean(S.profile.program); p.byTrainer = false;
  await uref().update({trainerId: null, trainerCode: null, trainerName: null, program: p}).catch(() => toast("Couldn't disconnect."));
  toast("Disconnected from your trainer");
}

    [E(pick.squat2,1), E(pick.hpush2), E(pick.hpull2), E(pick.hinge2), E(pick.core), E(pick.carry), E(pick.calf)]
  ];
  const upper = [[E(pick.hpush,1), E(pick.hpull,1), E(pick.vpush), E(pick.vpull), E(pick.arms1), E(pick.arms2), E(pick.core2)],
                 [E(pick.vpush,1), E(pick.vpull,1), E(pick.hpush2), E(pick.hpull2), E(pick.arms1), E(pick.arms2), E(pick.core)]];
  const lower = [[E(pick.squat,1), E(pick.hinge2), E(pick.single), E(pick.calf), E(pick.core), E(pick.carry), E(pick.cond)],
                 [E(pick.hinge,1), E(pick.squat2), E(pick.single), E(pick.hinge2), E(pick.core2), E(pick.carry), E(pick.cond)]];
  const cardioDay = exp === "new" || eq !== "gym" && eq !== "home" ? {n:"Incline walk", sets:1, reps:"30", rest:0, type:"cardio", repsInc:5, repsMax:45, cue:"Brisk, conversational pace"}
    : (g === "fitness" ? {n:"Easy run", sets:1, reps:"3 km easy", rest:0, type:"run", repsInc:0.5, repsMax:6, cue:"Conversational pace; walk breaks are fine"} : {n:"Incline walk", sets:1, reps:"35", rest:0, type:"cardio", repsInc:5, repsMax:50, cue:"Brisk, conversational pace"});
  const cardioDays = (g === "fitness" || g === "fatloss" || g === "health") ? (days >= 5 ? 2 : days >= 3 ? 1 : 0) : (days >= 5 ? 1 : 0);
  const liftDays = days - cardioDays;

  if (liftDays > lifts.length) lifts = [...lifts, ["Full body", full[0]], ["Full body 2", full[1]]];

  let li = 0; const plan = [...PATTERN].map(ch => ch === "L" ? lifts[li++] : {title: cardioDay.n === "Easy run" ? "Easy run" : "Zone 2 cardio", ex:[{...cardioDay}]});
  const program = {name: "Starter block", byTrainer: false, starter: true, startDate: null, cardioWeekly: {fatloss:150, fitness:150, health:150, strength:90, muscle:90}[g],
    notes: [], block: {weeks: 4, deload: [], extra: [], builtin: false},
    days: plan.map((d, i) => ({id: String.fromCharCode(65 + i), title: d.title, dow: WEEKDAYS[i], equip: [], ex: d.ex}))};

  // target weights from strength numbers
  const L = a.lifts || {}, E1 = {squat:e1rmOf(L.squat||{}), bench:e1rmOf(L.bench||{}), deadlift:e1rmOf(L.deadlift||{}), ohp:e1rmOf(L.ohp||{})};
  const MAP = {"Back squat":["squat",1], "Box squat":["squat",0.9], "Front squat":["squat",0.8], "Barbell bench press":["bench",1], "DB bench press":["bench",0.38], "DB floor press":["bench",0.36], "Incline DB press":["bench",0.32],
    "Trap-bar deadlift":["deadlift",1.05], "Romanian deadlift":["deadlift",0.6], "Seated DB overhead press":["ohp",0.38], "Standing barbell overhead press":["ohp",1]};

  else if (exp === "new") why.push("No target weights yet: in week 1 pick a weight you could lift about 3 more times than the set asks for. The app remembers it and shows it next time.");

function dedupeEx(ex){ const seen = new Set(); return ex.filter(e => { if (seen.has(e.n)) return false; seen.add(e.n); return true; }); }

  if ((a.pain || []).length) warn.push("If an exercise causes sharp or worsening pain, stop it and swap it from the exercise list. Persistent pain needs a physiotherapist's assessment.");
  if (+a.age && +a.age < 16) warn.push("Under 16s should train with a qualified coach supervising.");
  const kg = +a.weight;
  tips.push("Warm up for 5–10 minutes: easy cardio, then 2 lighter sets of your first exercise.");
  if (kg) tips.push(`Aim for roughly ${Math.round(kg * 1.6)} g of protein a day (about 1.6 g per kg of body weight) to support recovery and muscle.`);
  tips.push("Sleep 7–9 hours. It's when the training turns into progress.");
  if (a.goal === "fatloss") tips.push("Fat loss comes mostly from eating a little less than you burn; training keeps the muscle while you lose fat.");
  tips.push(`Get ${p.cardioWeekly || 150} minutes of moderate cardio across the week — brisk walking counts.`);
  p.notes = [...(p.notes || []), "This is a starter block from the app's coach. Ask a trainer to build your full program."];

}

/* ============ Event dates ============ */
const EVENT_MIN = {hyrox:8, marathon:12, half:8, "10k":5};
function progWeek(w){ const b = blk(); let x = w; if (b.peak != null) x = Math.min(x, b.peak); return Math.max(1, x - (b.base || 0)); }
function fitToEvent(p, dateStr){
  if (!dateStr) return {ok:false, msg:"Pick the event date first."};
  const t0 = today();
  if (dateStr < t0) return {ok:false, msg:"That date has already passed. Pick a future date."};
  const b = p.block = {...(p.block || {})};
  if (b.builtin) return {ok:false, msg:"This program can't be fitted to a date. Start from an event template instead."};
  if (!b.templateWeeks){ b.templateWeeks = b.weeks; b.templateDeload = [...(b.deload || [])]; }
  const W = b.templateWeeks, TD = b.templateDeload;
  let T = 0; for (let w = W; w >= 1 && TD.includes(w); w--) T++; T = Math.max(1, T);
  const mid = TD.filter(d => d <= W - T);
  const dow = parse(t0).getDay(), cand = dow >= 1 && dow <= 3 ? mondayOf(t0) : mondayOf(addDays(t0, 7));
  const evMon = mondayOf(dateStr), A = Math.floor(daysBetween(cand, evMon) / 7) + 1;
  const min = EVENT_MIN[p.eventKey] || Math.ceil(W * 0.6);
  let weeks, base = 0, start, status;
  if (A < 1){ weeks = 1; start = mondayOf(t0); status = "tooShort"; }
  else if (A >= W){ base = Math.min(A - W, 12); weeks = W + base; start = addDays(evMon, -(weeks - 1) * 7); status = A - W > 12 ? "later" : "ok"; }
  else { weeks = A; start = cand; status = A >= min ? "short" : "tooShort"; }
  const Tn = Math.min(T, weeks), peak = weeks - Tn;
  const baseDl = []; for (let i = 4; i <= base; i += 4) baseDl.push(i);
  const deload = [...new Set([...baseDl, ...mid.map(d => d + base).filter(d => d <= peak - 1), ...Array.from({length: Tn}, (_, i) => peak + 1 + i)])].sort((x, y) => x - y);
  Object.assign(b, {weeks, deload, base, peak, builtin:false}); delete b.deloadText;
  p.startDate = start; p.event = {...(p.event || {}), date: dateStr}; p.fitted = status;
  const name = (p.event && p.event.name) || "your event", wk = n => `${n} week${n === 1 ? "" : "s"}`;
  const msg = {
    ok: `The plan runs ${wk(weeks)}, from ${shortDate(start)} to race week: ${base ? `${wk(base)} of base training, then the ${wk(W)} build` : `the full ${wk(W)} build`}, with a taper into race day.`,
    later: `${name} is ${wk(A)} away, so the plan starts on ${shortDate(start)} and peaks for race day. Until then, keep training generally — a coach can plan the extra time for you.`,
    short: `${name} is ${wk(A)} away, shorter than the ideal ${wk(W)}. The plan starts at the beginning and tapers into race week, so you may not reach full race volume. A coach can tailor this to you.`,
    tooShort: `There isn't enough time to fully prepare for ${name}: it's ${A < 1 ? "this week" : wk(A) + " away"}, and we'd normally plan ${wk(W)} (at least ${wk(min)}). We'll get you as close to ready as possible — building from where you are and tapering into race day — but the best way to prepare in this time is to work with a real coach.`
  }[status];
  return {ok:true, status, msg, weeks, available: A};
}

/* ============ DEXA-based balance work ============ */
const UNI = (() => {
  const same = {L:"L", R:"R"}, cross = {L:"R", R:"L"}, m = {};
  const add = (list, region, names, trains) => list.forEach(n => m[n] = {region, names, trains});
  add(["Suitcase carry"], "trunk", {L:"Left hand", R:"Right hand"}, cross);
  add(["Side plank"], "trunk", {L:"Left side down", R:"Right side down"}, same);
  add(["Pallof press", "Band Pallof press", "Half-kneeling cable chop", "Copenhagen plank"], "trunk", {L:"Left side", R:"Right side"}, same);
  add(["Single-arm overhead carry", "Single-arm DB row", "Single-arm cable row", "Single-arm cable pulldown", "Landmine press", "Half-kneeling landmine press"], "arm", {L:"Left arm", R:"Right arm"}, same);
  add(["Bulgarian split squat", "Split squat", "Front-foot-elevated split squat", "Reverse lunge", "Forward lunge", "Walking lunge", "Lateral lunge", "Step-up", "Single-leg RDL", "Single-leg glute bridge", "Skater squat"], "leg", {L:"Left leg", R:"Right leg"}, same);
  return m;
})();
const BAL_THRESHOLD = 5; // % difference in lean mass between sides that triggers balance work
function balanceInfo(){
  if (!S.profile || !S.profile.settings || S.profile.settings.balanceWork === false) return null;
  const d = [...(S.data.dexa || [])].filter(x => x.date).sort(byDateDesc)[0]; if (!d) return null;
  const out = {date: d.date, any: false};
  [["trunk", "trunkL", "trunkR"], ["arm", "armL", "armR"], ["leg", "legL", "legR"]].forEach(([r, l, rr]) => {
    const L = +d[l], R = +d[rr]; if (!(L > 0 && R > 0)) return;
    const pct = Math.abs(L - R) / ((L + R) / 2) * 100;
    out[r + "Pct"] = Math.round(pct * 10) / 10;
    if (pct >= BAL_THRESHOLD){ out[r] = {weak: L < R ? "L" : "R", pct: Math.round(pct), L, R}; out.any = true; }
  });
  return out;
}
function sideFor(ex){
  const u = UNI[ex.n];
  if (!u && !ex.side) return null;
  const names = u ? u.names : ex.side.names;
  const b = u ? balanceInfo() : null, reg = b && b[u.region];
  if (reg){ const s = u.trains.L === reg.weak ? "L" : "R"; return {order: [s, s === "L" ? "R" : "L"], extra: s, names, reason: reg, region: u.region}; }
  if (ex.side) return {order: ex.side.order, extra: null, names};
  return null;
}
function balanceCue(sd){
  if (!sd || !sd.extra || !sd.reason) return "";
  return `${sd.names[sd.extra]} first, with an extra set: your ${sd.reason.weak === "L" ? "left" : "right"} ${sd.region} had ${sd.reason.pct}% less lean mass on your last DEXA scan.`;
}
function balanceCard(){
  const scan = [...(S.data.dexa || [])].filter(x => x.date).sort(byDateDesc)[0];
  if (!scan) return "";
  const on = set_().balanceWork !== false;
  const b = (() => { const keep = S.profile.settings.balanceWork; S.profile.settings.balanceWork = true; try { return balanceInfo(); } finally { S.profile.settings.balanceWork = keep; } })();
  const rows = [["trunk", "Trunk", "carries, side planks, Pallof presses"], ["arm", "Arms", "single-arm rows, presses and carries"], ["leg", "Legs", "split squats, lunges, step-ups and single-leg work"]]

const METRICS = {
  sessions: ["Workouts completed", ""], cardio: ["Cardio minutes", " min"], km: ["Running km", " km"], points: ["Points earned", " pts"],
  strength: ["Strength score gain", " pts"], sets: ["Sets completed", ""], tonnes: ["Tonnes lifted", " t"], checkins: ["Check-ins", ""],
  pbs: ["PBs set", ""], fullweeks: ["Full weeks (all rings)", ""], exkg: ["Heaviest set on an exercise", " kg"], exreps: ["Most reps in one set", " reps"],
  pace: ["Best running pace (1 km+)", " /km"], mix: ["Custom mix of metrics", " pts"]
};
const MIXABLE = ["sessions","cardio","km","points","sets","tonnes","checkins","pbs","fullweeks","strength"];
const lowerBetter = c => c.metric === "pace";
const fmtPace = v => v == null ? "–" : `${Math.floor(v)}:${String(Math.round((v % 1) * 60)).padStart(2, "0")}`;
function fmtMetric(c, v){ if (v == null) return "–"; if (c.metric === "pace") return fmtPace(v) + " /km"; return (Number.isInteger(v) ? v.toLocaleString() : fmt(v, c.metric === "tonnes" ? 2 : 1)) + (METRICS[c.metric] ? METRICS[c.metric][1] : ""); }
function metricLabel(c){
  if (c.metric === "exkg" || c.metric === "exreps") return `${c.metric === "exkg" ? "Heaviest" : "Most reps"}: ${c.exercise || "exercise"}`;
  if (c.metric === "mix") return "Mix: " + (c.mix || []).map(m => `${METRICS[m.m] ? METRICS[m.m][0] : m.m} ×${m.w}`).join(" + ");
  return METRICS[c.metric] ? METRICS[c.metric][0] : c.metric;
}
function metricValue(m, ch){
  const inW = d => d >= ch.start && d <= ch.end;
  const sess = S.data.sessions.filter(s => inW(s.date));
  const sets = s => s.exercises.flatMap(e => doneSets(e).map(x => ({e, x})));
  switch (m){
    case "sessions": return sess.length;
    case "cardio": return Math.round(S.data.cardio.filter(c => inW(c.date)).reduce((a, c) => a + (+c.minutes || 0), 0) + sess.reduce((a, s) => a + sessionCardioMin(s), 0));
    case "km": return Math.round(sess.reduce((a, s) => a + sessionKm(s), 0) * 10) / 10;
    case "points": return xpLedger(pbScan()).items.filter(i => inW(i.date)).reduce((a, i) => a + i.pts, 0);
    case "strength": { const a = strengthScore(addDays(ch.start, -1)), b = strengthScore(ch.end < today() ? ch.end : today()); return a && b ? b.score - a.score : 0; }
    case "sets": return sess.reduce((a, s) => a + sets(s).length, 0);
    case "tonnes": return Math.round(sess.reduce((a, s) => a + sessionVolume(s), 0) / 10) / 100;
    case "checkins": return new Set(S.data.body.filter(b => inW(b.date)).map(b => b.date)).size;
    case "pbs": return pbScan().events.filter(e => inW(e.date)).length;
    case "fullweeks": return activeWeeks().filter(w => { const r = ringsFor(w); return r.full && r.st.start >= mondayOf(ch.start) && r.st.start <= ch.end; }).length;
    case "exkg": { const v = Math.max(0, ...sess.flatMap(s => sets(s).filter(o => o.e.performedAs === ch.exercise).map(o => +o.x.kg || 0))); return v || null; }
    case "exreps": { const v = Math.max(0, ...sess.flatMap(s => sets(s).filter(o => o.e.performedAs === ch.exercise).map(o => +o.x.reps || 0))); return v || null; }
    case "pace": { const ps = sess.flatMap(s => sets(s).filter(o => o.e.type === "run" && +o.x.reps >= 1 && +o.x.kg > 0).map(o => +o.x.kg / +o.x.reps)); return ps.length ? Math.round(Math.min(...ps) * 100) / 100 : null; }
  }
  return 0;
}
function challengeValue(ch){
  if (ch.metric === "mix") return Math.round((ch.mix || []).reduce((a, m) => a + (+m.w || 0) * (metricValue(m.m, ch) || 0), 0) * 10) / 10;
  return metricValue(ch.metric, ch);
}
const meetsTarget = (c, v) => c.target != null && c.target !== "" && v != null && (lowerBetter(c) ? v <= +c.target : v >= +c.target);

/* ---- periods ---- */
const endOfMonth = d => { const x = parse(d); return ymd(new Date(x.getFullYear(), x.getMonth() + 1, 0)); };
function presetDates(p){
  const t = today(), mon = mondayOf(t), first = d => { const x = parse(d); return ymd(new Date(x.getFullYear(), x.getMonth(), 1)); };
  if (p === "thisweek") return [t, addDays(mon, 6)];
  if (p === "nextweek") return [addDays(mon, 7), addDays(mon, 13)];
  if (p === "thismonth") return [t, endOfMonth(t)];
  if (p === "nextmonth"){ const n = addDays(endOfMonth(t), 1); return [n, endOfMonth(n)]; }
  if (p === "4w") return [t, addDays(t, 27)];
  if (p === "8w") return [t, addDays(t, 55)];
  return null;
}
function nextPeriod(c){
  const start = addDays(c.end, 1);
  if (c.repeat === "week") return [start, addDays(start, 6)];
  if (c.repeat === "month") return [start, parse(start).getDate() === 1 ? endOfMonth(start) : addDays(start, daysBetween(c.start, c.end))];
  return [start, addDays(start, daysBetween(c.start, c.end))];
}
async function rollChallenges(){
  if (!isTrainer()) return;
  Social.rolling = Social.rolling || new Set();
  for (const c of Social.challenges){
    if (!c.repeat || c.next || c.end >= today() || Social.rolling.has(c.id)) continue;
    Social.rolling.add(c.id);
    let cur = c, guard = 0, created = null;
    while (cur.end < today() && guard++ < 60){
      const [start, end] = nextPeriod(cur);
      created = {...cur, start, end, prev: c.id, series: c.series || c.id, next: null};
      created.id = `${created.series}_${start}`;
      cur = created;
    }
    if (!created) continue;
    const {id, ...data} = created;
    await Cloud.db.collection("challenges").doc(id).set(clean({...data, created: null})).then(() => Cloud.db.collection("challenges").doc(c.id).update({next: id})).catch(() => {});
  }
}

function clientStatus(c){ const d = c.lastWorkout && c.lastWorkout.date; if (!d) return "never"; const ago = daysBetween(d, today()); return ago <= 14 ? "active" : ago <= 30 ? "risk" : "inactive"; }
function last4(c){ const wk = c.weekCounts || {}; let n = 0; for (let i = 0; i < 4; i++) n += +wk[addDays(mondayOf(today()), -7 * i)] || 0; return n; }
function trainerStats(tid){

  const st = {n, active: 0, risk: 0, inactive: 0, never: 0, w4: 0, planned4: 0, streak: 0, pbs30: 0, week: 0};
  cl.forEach(c => { st[clientStatus(c)]++; const w = last4(c); st.w4 += w; st.planned4 += (+c.planned || 0) * 4; st.streak += +c.streak || 0; st.pbs30 += +c.pbs30 || 0; st.week += fresh(c, "weekSessions"); });
  st.perWeek = n ? st.w4 / n / 4 : 0;
  st.adherence = st.planned4 ? Math.min(100, Math.round(st.w4 / st.planned4 * 100)) : null;

  <div class="stat"><b class="num">${s.n ? fmt(s.perWeek, 1) : "–"}</b><span>Workouts / client / week</span></div><div class="stat"><b class="num">${s.pbs30}</b><span>PBs, 30 days</span></div><div class="stat"><b class="num">${s.risk + s.inactive + s.never}</b><span>At risk or inactive</span></div></section>`;
  const pill = st => st === "active" ? `<span class="pill good">Active</span>` : st === "risk" ? `<span class="pill warn">At risk</span>` : st === "inactive" ? `<span class="pill bad">Inactive</span>` : `<span class="pill">No workouts</span>`;
  out += `<section class="card"><h3>Clients</h3>${cl.length ? `<div class="tbl"><table><tr><th>Client</th><th>Status</th><th>Program</th><th>Last workout</th><th>This week</th><th>4 weeks</th><th>Streak</th><th>PBs 30d</th></tr>
  ${cl.map(c => { const pr = c.program; return `<tr><td>${esc(c.name)}</td><td>${pill(clientStatus(c))}</td><td style="white-space:normal;min-width:140px">${pr ? `${esc(pr.name)} · ${pr.days} d/wk${pr.weeks ? ` · wk ${Math.max(0, Math.min(pr.week, pr.weeks))} of ${pr.weeks}` : ""}${pr.event ? ` · ${esc(pr.event.name || "event")} ${shortDate(pr.event.date)}` : ""}` : "None"}</td><td>${c.lastWorkout ? shortDate(c.lastWorkout.date) : "–"}</td><td>${fresh(c, "weekSessions")}${c.planned ? ` / ${c.planned}` : ""}</td><td>${last4(c)}</td><td>${c.streak ? "🔥" + c.streak : "–"}</td><td>${c.pbs30 || 0}</td></tr>`; }).join("")}</table></div>` : `<div class="empty">No clients yet, or clients haven't opened the latest app.</div>`}</section>`;
  const ch = (Owner.chals[t.id] || []).filter(c => c.end >= addDays(today(), -30)).sort((a, b) => b.end.localeCompare(a.end));
  out += `<section class="card"><h3>Challenges</h3>${ch.length ? ch.map(c => `<div class="row between small" style="border-top:1px solid var(--line);padding-top:6px"><div><b>${esc(c.title)}</b><div class="muted">${esc(metricLabel(c))} · ${shortDate(c.start)} – ${shortDate(c.end)}</div></div><span class="pill ${c.end >= today() && c.start <= today() ? "good" : ""}">${c.start > today() ? "Soon" : c.end < today() ? "Ended" : "Live"}</span></div>`).join("") : `<div class="empty">No challenges in the last 30 days.</div>`}</section>`;
  return out;
}
function viewOwnerAccount(){
  return `<div><span class="eyebrow">Account</span><h1>${esc(Cloud.me.name || "Gym owner")}</h1></div>
  <section class="card"><span class="muted small">Signed in as ${esc(Cloud.user.email)} · Gym owner of ${esc(Cloud.me.gymName || "your gym")}</span>
  <label class="f">Gym name<input id="o-gname" value="${esc(Cloud.me.gymName || "")}"></label><button class="btn" data-act="o-rename">Save name</button>
  <button class="btn block" data-act="signout">Sign out</button></section>`;
}

/* ============ Start over ============ */
async function resetAccount(){
  toast("Deleting your data…");
  try {
    if (isCloudClient()){
      for (const c of COLS){
        const q = await uref().collection(c).get();
        await Promise.all(q.docs.map(d => uref().collection(c).doc(d.id).delete()));
      }
      const fresh = defaultsFor(false);
      await uref().update({program: clean(fresh.program), settings: clean(fresh.settings), trainerId: null, trainerCode: null, trainerName: null});
    }
    await Store.clearAll();
    clearDraft(); S.timer = null;
    S.data = emptyData();
    S.profile = defaultsFor(false);
    if (!isCloudClient()) await Store.saveProfile(S.profile);
    S.ob = null; S.obOffered = false; S.view = "today"; S.sub = null;
    toast("Done — you're starting fresh");
  } catch(e){ console.warn(e); toast("Couldn't finish deleting: " + (e.code || e.message || "error") + ". Try again."); }
}

/* ============ Boot ============ */
async function boot(){
  render();
  await Store.open();
  const {data, profile} = await Store.loadAll();
  S.data = data;
  if (profile) S.profile = profile;
  else {
    let owner = false;
    try { const u = window.claude ? await Promise.race([window.claude.use("user"), new Promise(r => setTimeout(() => r(null), 3000))]) : null; owner = u ? !!u.isOwner() : false; } catch(e){}
    S.profile = defaultsFor(owner);
    await Store.saveProfile(S.profile).catch(()=>{});
  }
  try { const d = JSON.parse(localStorage.getItem("sl-draft") || "null"); if (d && d.exercises) S.draft = d; } catch(e){}
  S.ready = true; S.forceRender = true; render();
  cloudInit();
  if (Store.mode === "memory") toast("This browser is blocking storage. Save a backup before closing.");
}
nativeSetup();
boot();
</script>
